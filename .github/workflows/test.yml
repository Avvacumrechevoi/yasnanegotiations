name: Smoke tests

# На push в main тесты НЕ гоняем: deploy.yml делает это сам как гейт перед
# публикацией, и раньше каждый пуш прогонял набор дважды, дважды ставил
# chromium и трижды собирал бандлы. На публичном репозитории минуты Actions
# безлимитны, и это было незаметно; на приватном их 2000 в месяц, а темп
# разработки — около 105 коммитов в месяц. Дубль съедал половину лимита, и по
# его исчерпании встал бы не только сайт, но и автодеплой бэкенда.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
