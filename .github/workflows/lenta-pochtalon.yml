# ═══════════════════════════════════════════════════════════════════
# ПОЧТАЛЬОН ЛЕНТЫ — раз в час качает страницы t.me/s и превью-картинки и
# кладёт сырьё в бакет yasnalab.ru (lenta/vhod/<канал>/).
#
# ЗАЧЕМ. t.me из облака Яндекса отвечает через раз (ТСПУ): в бою 05.09.2026
# у сборщика ленты вышло две удачи из одиннадцати заходов, у всех четырёх
# каналов udacha_at пустой, лента стоит. С обычной машины те же страницы
# приходят за 0,3–0,8 с. Режут не нас, а путь, поэтому ни VPC, ни NAT, ни
# статический адрес этого не лечат. Раннеры GitHub стоят вне России и
# страницы получают спокойно, а репозиторий публичный — минуты бесплатны.
# Ничего просить у руководителей каналов не нужно.
#
# КТО КОГО ЖДЁТ. Почтальон только КЛАДЁТ сырьё. Сборщик (yasna-lenta-sbor,
# таймер раз в 15 минут) сначала пробует дойти до площадки САМ и берёт сырьё,
# только если своей дороги нет и сырьё не старше трёх часов. То есть эта
# задача — не замена сбору, а запасная дорога: если ТСПУ отпустит, лента
# пойдёт напрямую и свежее.
#
# ЧЕЙ КЛЮЧ ЗДЕСЬ ЛЕЖИТ. Только СВОЕГО аккаунта почтальона — yasna-pochtalon,
# у которого одно право: storage.uploader на бакет yasnalab.ru, а политика
# бакета разрешает ему PUT исключительно под префиксом lenta/vhod/*.
#
# Ключ деплоя (секрет YC_SA_KEY, аккаунт yasna-ci — см. шапку
# deploy-backend.yml) сюда брать НЕЛЬЗЯ, и это не придирка. Бакет yasnalab.ru
# — это сам живой сайт: в нём лежат index.html и docs/core/*.js платформы.
# Статический ключ S3 не знает про префиксы сам по себе — он даёт аккаунту
# ровно то, что аккаунту разрешено, а роли в облаке вешаются на папку. То
# есть ключ yasna-ci в секретах ПУБЛИЧНОГО репозитория, ездящий раз в час,
# был бы правом переписать сайт и выкатить любую функцию. Код почтальона
# пишет только под lenta/vhod/, но ключ этой аккуратностью не ограничен.
#
# ЧЕМ ПОЧТАЛЬОН ДОКАЗЫВАЕТ БАКЕТУ, ЧТО ОН СВОЙ. Двумя способами, и порядок
# здесь не случаен.
#
#   1. YC_STATIC_KEY_ID + YC_STATIC_KEY — статический ключ доступа аккаунта
#      yasna-pochtalon. Почтальон подписывает запросы сам (AWS SigV4), наружу
#      за токеном не ходит. ЭТО ПРЕДПОЧТИТЕЛЬНЫЙ ПУТЬ, и вот почему:
#      проверено 06.09.2026 с зарубежного адреса — storage.yandexcloud.net
#      отвечает за 0,4 с, а управляющий контур облака
#      (iam.api.cloud.yandex.net, api.cloud.yandex.net) не отдаёт даже
#      TCP-соединения. Раннеры GitHub стоят за границей, то есть ровно там же.
#      Завести:
#        yc iam service-account create --name yasna-pochtalon
#        # право: storage.uploader на бакет yasnalab.ru + политика бакета,
#        # разрешающая PUT только по префиксу lenta/vhod/*
#        yc iam access-key create --service-account-id <id yasna-pochtalon>
#      и положить key_id и secret в секреты репозитория.
#   2. YC_POCHTALON_SA_KEY — авторизованный ключ ТОГО ЖЕ аккаунта. Путь идёт
#      через IAM и может не открыться с раннера по причине выше; если не
#      открылся, почтальон скажет в логе, что делать.
#
# Перед первой поездкой стоит убедиться, что права у аккаунта и правда есть:
#   yc resource-manager folder list-access-bindings --id <folder>
# Сам почтальон делает пробное касание бакета до всякой качки, так что при
# нехватке права поездка кончается сразу, а не после шести мегабайт превью.
#
# Без обоих секретов задача не краснеет, а идёт сухим прогоном: страницы
# качаются, в бакет ничего не пишется. Так форк или ветка без доступа к
# облаку всё равно проверяют, что почтальон жив и разметка не сменилась.
#
# ЧАСЫ. Расписание Actions на публичных репозиториях опаздывает на 5–20
# минут и в час пик может пропустить тик. Это учтено: сборщик считает сырьё
# годным три часа, то есть переживает пару пропущенных поездок.
# ═══════════════════════════════════════════════════════════════════
name: Lenta pochtalon (t.me → бакет)

on:
  schedule:
    # каждый час в :25 — до тиков сборщика в :33 и :48
    - cron: '25 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/pochtalon.mjs'
      - '.github/workflows/lenta-pochtalon.yml'

concurrency:
  group: lenta-pochtalon
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pochtalon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Действия прибиты к SHA, а не к плавающему тегу v4: в этой же работе
      # лежит ключ от бакета, и подмена тега (или компрометация действия)
      # утащила бы его наружу. Задача идёт по расписанию 24 раза в сутки, то
      # есть окно для этого открыто постоянно. Обновлять — руками, сверив,
      # что SHA принадлежит нужной версии.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node 20 (глобальный fetch, зависимостей у почтальона нет)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Чем доказывать бакету, что мы свои
        id: gate
        env:
          STATIC_ID: ${{ secrets.YC_STATIC_KEY_ID }}
          STATIC: ${{ secrets.YC_STATIC_KEY }}
          SA: ${{ secrets.YC_POCHTALON_SA_KEY }}
        run: |
          if [ -n "$STATIC_ID" ] && [ -n "$STATIC" ]; then
            echo "Статический ключ доступа задан — подписываем сами (SigV4)."
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$SA" ]; then
            echo "Статического ключа нет, пробуем IAM по ключу аккаунта почтальона."
            echo "ⓘ если IAM с раннера не ответит — см. шапку этого файла, пункт 1."
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Секретов нет — иду сухим прогоном, в бакет ничего не пишу."
            echo "Как задать — в шапке этого файла."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Сухой прогон (без секретов)
        if: steps.gate.outputs.ok != 'true'
        run: node scripts/pochtalon.mjs --proba

      # YC_SA_KEY (ключ деплоя) сюда не передаётся НАМЕРЕННО: см. шапку.
      - name: Поездка почтальона
        if: steps.gate.outputs.ok == 'true'
        env:
          YC_STATIC_KEY_ID: ${{ secrets.YC_STATIC_KEY_ID }}
          YC_STATIC_KEY: ${{ secrets.YC_STATIC_KEY }}
          YC_POCHTALON_SA_KEY: ${{ secrets.YC_POCHTALON_SA_KEY }}
          LENTA_BUCKET: yasnalab.ru
        run: node scripts/pochtalon.mjs
