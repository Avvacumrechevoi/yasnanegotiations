# ═══════════════════════════════════════════════════════════════════
# Автодеплой бэкенда в Yandex Cloud.
#
# ЗАЧЕМ. Раньше облачные функции выкатывались руками по README, и это давало
# один и тот же класс проблем: «код в репозитории ≠ код в облаке». Whitelist
# режимов в submit годами не знал действующих gameId (все матчи получали 400,
# таблица matches стояла пустой), сломанный SQL в лидерборде жил незамеченным,
# а сам README врал про версию зависимости. Теперь push в main выкатывает
# бэкенд сам.
#
# ЕДИНСТВЕННАЯ РУЧНАЯ НАСТРОЙКА — один секрет репозитория YC_SA_KEY:
#   1) создать ключ сервисного аккаунта (у него уже есть нужные права):
#        yc iam key create --service-account-id aje0k8v128i3gvatqah2 \
#          --output sa-key.json --folder-id b1gc964j4lm3jfp3h038
#   2) Settings → Secrets and variables → Actions → New repository secret,
#      имя YC_SA_KEY, значение — ВСЁ содержимое sa-key.json;
#   3) удалить sa-key.json с диска.
# Без секрета workflow не падает, а тихо пропускается — чтобы форки и ветки
# без доступа к облаку не краснели.
#
# БЕЗОПАСНОСТЬ АВТОПРОМОУШЕНА. Тег stable переводится автоматически, но перед
# этим запоминаются прежние версии, а после — прод проверяется
# scripts/smoke-backend.sh. Если проверка не прошла, теги возвращаются на
# прежние версии и job краснеет. Именно этого не хватило, когда деплой с
# недостающей peer-зависимостью увёл все обращения к БД в 502.
# ═══════════════════════════════════════════════════════════════════
name: Deploy backend (Yandex Cloud)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'scripts/deploy-backend.sh'
      - 'scripts/deploy-gateway.sh'
      - 'scripts/apply-migrations.sh'
      - 'scripts/smoke-backend.sh'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: backend
  cancel-in-progress: false

env:
  YC_FOLDER_ID: b1gc964j4lm3jfp3h038
  YC_CLOUD_ID: b1gqrqgua7miqmj6m4k0
  YC_SA_ID: aje0k8v128i3gvatqah2

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Есть ли секрет YC_SA_KEY
        id: gate
        env:
          KEY: ${{ secrets.YC_SA_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "Секрет YC_SA_KEY не задан — деплой бэкенда пропускаю."
            echo "Как задать — в шапке .github/workflows/deploy-backend.yml"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Установить yc CLI
        if: steps.gate.outputs.ok == 'true'
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh \
            | bash -s -- -i "$HOME/yc" -n
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"

      - name: Установить ydb CLI (для миграций)
        if: steps.gate.outputs.ok == 'true'
        run: |
          curl -sSL https://install.ydb.tech/cli | bash
          echo "$HOME/ydb/bin" >> "$GITHUB_PATH"

      - name: Авторизоваться сервисным аккаунтом
        if: steps.gate.outputs.ok == 'true'
        env:
          KEY: ${{ secrets.YC_SA_KEY }}
        run: |
          umask 077
          printf '%s' "$KEY" > /tmp/sa-key.json
          yc config profile create ci 2>/dev/null || yc config profile activate ci
          yc config set service-account-key /tmp/sa-key.json
          yc config set cloud-id "$YC_CLOUD_ID"
          yc config set folder-id "$YC_FOLDER_ID"
          yc iam create-token > /dev/null && echo "авторизация ок"

      - name: Миграции схемы YDB
        if: steps.gate.outputs.ok == 'true'
        run: |
          YC_IAM_TOKEN="$(yc iam create-token)" ./scripts/apply-migrations.sh

      - name: Запомнить действующие версии (для отката)
        if: steps.gate.outputs.ok == 'true'
        id: before
        run: |
          rollback=""
          for fn in yasna-submit yasna-leaderboard yasna-auth-telegram yasna-content-fetch yasna-content-publish; do
            v="$(yc serverless function version list --function-name "$fn" --format json \
                 | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((x['id'] for x in d if 'stable' in (x.get('tags') or [])), ''))")"
            [ -n "$v" ] && rollback="$rollback $v"
          done
          echo "versions=$rollback" >> "$GITHUB_OUTPUT"
          echo "прежние stable:$rollback"

      - name: Деплой функций и перевод stable
        if: steps.gate.outputs.ok == 'true'
        run: ./scripts/deploy-backend.sh --promote

      - name: Применить спецификацию шлюза
        if: steps.gate.outputs.ok == 'true'
        # --tag-current: если у какой-то функции, которую скрипт деплоя не
        # трогает (yasna-profile, yasna-rooms-*), тега stable нет, спека на него
        # ссылаться не сможет и шлюз уедет в ошибку резолва. Флаг проставляет
        # тег текущей версии — поведение при этом не меняется.
        run: ./scripts/deploy-gateway.sh --tag-current

      - name: Проверить прод
        if: steps.gate.outputs.ok == 'true'
        id: smoke
        run: |
          sleep 10          # шлюзу нужен момент, чтобы подхватить новые версии
          ./scripts/smoke-backend.sh

      - name: Откат при провале проверки
        if: failure() && steps.gate.outputs.ok == 'true' && steps.before.outputs.versions != ''
        run: |
          echo "::error::Прод не прошёл проверку — возвращаю прежние версии"
          for v in ${{ steps.before.outputs.versions }}; do
            yc serverless function version set-tag --id "$v" --tag stable && echo "  откат: stable → $v"
          done
          sleep 10
          ./scripts/smoke-backend.sh || echo "::error::после отката проверка всё ещё красная — нужен человек"

      - name: Убрать ключ
        if: always()
        run: rm -f /tmp/sa-key.json
