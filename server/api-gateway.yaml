# ═══════════════════════════════════════════════════════════════════
# Спецификация API Gateway Ясны — ИСТОЧНИК ПРАВДЫ.
#
# Раньше здесь лежал шаблон, разошедшийся с реальностью: в облаке давно жили
# /profile и четыре /rooms/*, которых в файле не было вовсе, а часть маршрутов
# висела на $latest. Теперь файл описывает шлюз полностью и применяется
# скриптом scripts/deploy-gateway.sh — он подставляет id функций по их именам,
# поэтому сами id в репозиторий не попадают (репозиторий публичный).
#
# ПОЧЕМУ У ВСЕХ МАРШРУТОВ tag: stable. Ссылка на $latest означает, что любая
# созданная версия функции мгновенно уходит в прод. На этом уже был инцидент:
# деплой с недостающей peer-зависимостью увёл все обращения к БД в 502.
# С тегом откат — одна команда:
#   yc serverless function version set-tag --id <прежняя_версия> --tag stable
# ═══════════════════════════════════════════════════════════════════
openapi: 3.0.0
info:
  title: Yasna Duel API
  version: 1.1.0
servers:
  - url: https://{GATEWAY_DOMAIN}
paths:
  /auth/telegram:
    post:
      summary: Telegram Login
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {AUTH_TELEGRAM_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: OK
    options:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {AUTH_TELEGRAM_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: CORS preflight

  /submit:
    post:
      summary: Submit match result
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {SUBMIT_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: OK
    options:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {SUBMIT_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: CORS preflight

  # ───── Учебный прогресс на сервере ─────
  # Обслуживается функцией submit (server/progress.js лежит в её пакете):
  # квота serverless.functions.count в облаке исчерпана, отдельную функцию
  # создать нельзя. Разбор — в шапке server/submit.js.
  /progress:
    get:
      summary: Прогресс владельца (user_id по токену, иначе deviceId)
      parameters:
        - name: deviceId
          in: query
          schema: { type: string }
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {SUBMIT_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: OK
    put:
      summary: Залить пачку изменений прогресса
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {SUBMIT_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: OK
    post:
      summary: То же, что PUT — для клиентов, где PUT неудобен
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {SUBMIT_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: OK
    options:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {SUBMIT_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: CORS preflight

  /leaderboard:
    get:
      summary: Get leaderboard
      parameters:
        - name: gameId
          in: query
          required: true
          schema: { type: string }
        - name: yasnaId
          in: query
          required: true
          schema: { type: string }
        - name: period
          in: query
          schema: { type: string, enum: [daily, weekly, all] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
        - name: deviceId
          in: query
          schema: { type: string }
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {LEADERBOARD_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: OK
    options:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {LEADERBOARD_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: CORS preflight

  /profile:
    get:
      summary: Получить агрегированный профиль игрока
      parameters:
        - name: userId
          in: query
          schema: { type: string }
        - name: deviceId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {PROFILE_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: OK
    options:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {PROFILE_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: CORS preflight

  # ───── Polling-relay PvP (легаси; действующий транспорт — Firebase RTDB) ─────
  # Все четыре маршрута переведены на функцию submit (server/rooms-legacy.js),
  # которая отвечает честным 410 с текстом «обновите страницу». Свои функции
  # (yasna-rooms-create/join/send/poll) больше не нужны и держат слоты в
  # исчерпанной квоте serverless.functions.count — после этой правки их можно
  # удалить, освободив четыре слота. Сами маршруты оставлены: у кого-то может
  # быть открыта страница, загруженная до перехода на Firebase, и такой клиент
  # должен получить понятный ответ, а не 404 от шлюза.

  /rooms/create:
    post:
      summary: Создать комнату для PvP-Партии
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {SUBMIT_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: OK
    options:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {SUBMIT_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: CORS preflight

  /rooms/join:
    post:
      summary: Присоединиться к комнате по коду
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {SUBMIT_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: OK
    options:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {SUBMIT_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: CORS preflight

  /rooms/send:
    post:
      summary: Отправить сообщение в комнату
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {SUBMIT_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: OK
    options:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {SUBMIT_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: CORS preflight

  /rooms/poll:
    get:
      summary: Получить новые сообщения комнаты
      parameters:
        - name: roomId
          in: query
          required: true
          schema: { type: string }
        - name: deviceId
          in: query
          required: true
          schema: { type: string }
        - name: since
          in: query
          schema: { type: integer, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {SUBMIT_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: OK
    options:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {SUBMIT_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: CORS preflight

  # ───── Контентное хранилище (Tier-2 live overrides в YDB) ─────

  /content:
    get:
      summary: Get current content overrides (live revision)
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {CONTENT_FETCH_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: OK
        '304':
          description: Not Modified
    options:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {CONTENT_FETCH_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: CORS preflight

  /content/publish:
    post:
      summary: Publish new content revision (admin only)
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {CONTENT_PUBLISH_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
    options:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: {CONTENT_PUBLISH_FUNCTION_ID}
        tag: stable
        service_account_id: {SERVICE_ACCOUNT_ID}
      responses:
        '200':
          description: CORS preflight
