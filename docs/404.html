<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="yandex" content="noindex, nofollow"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<!-- Приложение: манифест, иконки и цвет строки состояния. Раньше манифест
     висел на двух страницах из девяти, иконка была одна — SVG в data-URI, а
     theme-color на каждой странице свой: на светлых страницах стояла почти
     чёрная полоса. Теперь одинаково везде, и по теме смотрящего. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0071e3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ясна">
<script>
/* Мини-тема вместо core/theme.js: 404 отдаётся с ЛЮБОГО пути, и относительный
   src здесь не резолвится. Логика та же: ключ yasna_theme, авто — по системе. */
(function(){try{
  var m=localStorage.getItem('yasna_theme');
  var d=(m==='dark')||(m!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme',d?'dark':'light');
}catch(e){}})();
</script>
<script defer src="core/pwa.js"></script>
<title>Страница не найдена · Ясна</title>
<script>
// docs/preview/ удалён с домена (это был живой дубль сайта). Старые ссылки
// вида /preview/duel.html ведут сюда — молча отправляем на настоящую страницу.
(function(){
  try {
    var m = location.pathname.match(/^(.*)\/preview\/(.*)$/);
    if (m) location.replace(m[1] + '/' + (m[2] || '') + location.search + location.hash);
  } catch(_){}
})();
</script>
<link rel="stylesheet" href="vendor/fonts/shrifty.css">
<style>
:root{
  --bg-base:#f5f6f8; --bg-card:#ffffff; --bg-tonal:#e8ecf1;
  --text-primary:#101418; --text-secondary:#5c6570; --text-tertiary:#8b95a1;
  --border:rgba(16,20,24,.1); --accent:#0077FF; --accent-hover:#0066dd;
  --accent-soft:rgba(0,119,255,.1); --accent-on:#fff;
  --font-sans:'Inter',system-ui,sans-serif; --font-display:'Manrope',system-ui,sans-serif;
  --font-serif:'Cormorant Garamond',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --bg-base:#0a0b0d; --bg-card:#16191C; --bg-tonal:#262A2E;
  --text-primary:#FEFEFE; --text-secondary:#A8B1BE; --text-tertiary:#626D7A;
  --border:rgba(255,255,255,.06); --accent-hover:#16A7FF;
  --accent-soft:rgba(0,119,255,.16) }
}
html[data-theme="dark"]{
  --bg-base:#0a0b0d; --bg-card:#16191C; --bg-tonal:#262A2E;
  --text-primary:#FEFEFE; --text-secondary:#A8B1BE; --text-tertiary:#626D7A;
  --border:rgba(255,255,255,.06); --accent-hover:#16A7FF;
  --accent-soft:rgba(0,119,255,.16) }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg-base);color:var(--text-primary);font-family:var(--font-sans);min-height:100vh}
body{
  background:radial-gradient(ellipse 80% 60% at 50% 30%,rgba(0,119,255,.08) 0%,transparent 60%),var(--bg-base);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.e-card{max-width:520px;text-align:center}
.e-mark{font-family:var(--font-serif);font-style:italic;font-size:88px;line-height:1;color:var(--accent-hover);opacity:.9}
.e-code{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-tertiary);margin-top:8px}
.e-title{font-family:var(--font-display);font-size:26px;font-weight:700;margin-top:18px;letter-spacing:-.01em}
.e-desc{font-size:16px;line-height:1.6;color:var(--text-secondary);margin-top:12px}
.e-links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
.e-btn{
  display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:100px;
  font-size:14px;font-weight:600;text-decoration:none;
  background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);
}
.e-btn--primary{background:var(--accent);border:none;color:var(--accent-on)}
.e-btn:hover{background:var(--bg-tonal)}
.e-btn--primary:hover{background:var(--accent-hover)}
/* В приложении заголовок экрана рисует общая шапка (метки стоят на <body>), и
   свой h1 повторял бы её двумя строками ниже — у одного экрана одно имя. На
   сайте общей шапки нет, там h1 и остаётся единственным заголовком. */
html.yk-shapka-est .e-title{display:none}
</style>
</head>
<!-- Кто этот экран для оболочки приложения (app/navigatsiya.js). Метки стоят
     в самой странице, а не в таблице сборщика: 404 отдаётся по ЛЮБОМУ
     несуществующему адресу, и в таблице по имени файла её не поймать.
     «дочерний» — потому что это тупик, из которого обязан быть выход: шапка
     рисует стрелку ←, и она уводит ровно туда, откуда человек пришёл (стек
     навигации), а не «куда-нибудь». Родитель — запасной путь для прямого
     захода, когда стек пуст: без него в наббаре не подсвечивалась ни одна
     вкладка, и человек не понимал, где он вообще находится. -->
<body data-yk-tip="дочерний" data-yk-imya="Страница не найдена" data-yk-roditel="index.html">
  <div class="e-card">
    <div class="e-mark">✦</div>
    <div class="e-code">Ошибка 404</div>
    <h1 class="e-title">Такой страницы нет</h1>
    <!-- «Загляните в один из разделов» не годится: в приложении navigatsiya.js
         прячет все кнопки, кроме «На главную», и человек видит одну. -->
    <p class="e-desc">Возможно, ссылка устарела или вы ошиблись адресом. Отсюда можно вернуться на главную.</p>
    <!-- Разделы зовём именами вкладок: «Разбор» и «Уроки», а не «Конструктор» и «Обучение». -->
    <div class="e-links" id="e-links">
      <a class="e-btn e-btn--primary" data-p="index.html">На главную</a>
      <a class="e-btn" data-p="konstruktor.html">Разбор</a>
      <a class="e-btn" data-p="learn.html">Уроки</a>
      <a class="e-btn" data-p="duel.html">Игры</a>
      <a class="e-btn" data-p="negotiations.html">Переговоры</a>
    </div>
    <script>
      /* Относительные ссылки здесь нельзя: Pages отдаёт эту страницу по ЛЮБОМУ
         несуществующему адресу, и «index.html» разрешился бы от /games/что-то/.
         Абсолютные тоже нельзя — корень сайта разный на github.io (проектный
         подкаталог) и на своём домене. Поэтому считаем корень на месте. */
      (function(){
        var base = location.hostname.indexOf('github.io') > -1 ? '/yasnanegotiations/' : '/';
        var a = document.getElementById('e-links').children;
        for (var i = 0; i < a.length; i++) a[i].href = base + a[i].dataset.p;
      })();
    </script>
  </div>
</body>
</html>
