<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Расклад — прототип · Ясна</title>
<!--
  ПРОТОТИП «Расклада», версия 2. Перестроен после CJM по четырём персонам.
  Первая версия начинала с того, чем автор ЗАКАНЧИВАЕТ курс: круг из 12 голых цифр,
  кресты и «причина» на первом же ходу. Новичок уходил на третьей карте.

  Лестница теперь авторская: сперва то, что человек видит глазами, потом имена, потом числа.
    Уровень 1 «Четыре времени» — круг нарисован как сами сутки, четыре сектора обычными
      словами (Ночь · Утро · День · Вечер). Одно действие — тап по сектору. Ни одного термина,
      ни одной цифры, ни очков. В конце — фокус: те же четыре сектора, но карточки костра.
    Уровень 2 «Двенадцать» — доли круга, для тех, кто прошёл первый.

  Что исправлено по замечаниям персоны носителя метода:
   • «причина» сверялась с ПРАВИЛЬНОЙ полкой, а не с заявкой игрока — игра платила за
     самопротиворечие («положил на 2, сказал опора» давало +2). Блок причины убран целиком:
     это был второй раз заданный вопрос о кресте.
   • строка различения печатала один и тот же признак дважды, когда обе полки одной чётности
     («2 — долгое, 4 — долгое»). Теперь чётность печатается, только когда она реально
     различает, иначе берётся готовая пара из разбора источника.
   • в Ясне Суток имена карт совпадали с именами полок (Искра, Сумерки, Заря) — ответ был
     написан на лицевой стороне вопроса. Карточки уровня 1 переписаны на бытовой язык.
-->
<style>
  :root{
    --bg:#0d0f12; --card:#16191c; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.06);
    --tx:#f2f3f5; --tx2:#a8b1be; --tx3:#6b7280; --acc:#4d8dff;
    --op:#e8364f; --ve:#5b9cf6; --up:#e8a834;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f5f7; --card:#fff; --line:rgba(0,0,0,.12); --line2:rgba(0,0,0,.06);
           --tx:#12161c; --tx2:#4a5260; --tx3:#8a93a0; --acc:#0071e3; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
       padding:16px;max-width:520px;margin:0 auto;-webkit-text-size-adjust:100%}
  h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--tx2);font-size:13.5px;margin-top:3px}
  .lead{font-size:16px;line-height:1.45;margin:14px 0 4px}
  svg{display:block;width:100%;height:auto;touch-action:manipulation}
  .sect{cursor:pointer}
  .sect path{transition:opacity .15s}
  .sect:hover path{opacity:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin:12px 0}
  .now{border-color:var(--acc);box-shadow:0 0 0 3px rgba(77,141,255,.13);text-align:center}
  .now .em{font-size:34px;line-height:1}
  .now .el{font-size:22px;font-weight:700;margin-top:7px;line-height:1.25}
  button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);
         border-radius:12px;padding:12px 16px;cursor:pointer;transition:all .15s;font-weight:600}
  button:hover:not(:disabled){border-color:var(--acc)}
  button:disabled{opacity:.35;cursor:not-allowed}
  button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row button{flex:1;min-width:110px}
  .rv{border-radius:16px;padding:15px 17px;margin:12px 0;border:1px solid}
  .rv.ok{border-color:rgba(62,201,138,.45);background:rgba(62,201,138,.09)}
  .rv.no{border-color:rgba(240,179,84,.45);background:rgba(240,179,84,.09)}
  .rv .hd{font-weight:700;font-size:16px}
  .rv .bd{font-size:14px;color:var(--tx2);margin-top:8px;line-height:1.55}
  .rv .bd b{color:var(--tx)}
  .muted{color:var(--tx3);font-size:12.5px;margin-top:12px;line-height:1.5}
  .prog{display:flex;gap:4px;margin:10px 0 2px}
  .prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
  .prog i.done{background:var(--acc)}
  .big{font-size:17px;padding:14px}
</style>

<h1>Расклад <span style="font-weight:400;color:var(--tx3)">· прототип</span></h1>
<div class="sub" id="sub"></div>
<div id="app"></div>

<script>
// ═══ УРОВЕНЬ 1 «Четыре времени» ═══════════════════════════════════════
// Круг делится ровно так, как его делит автор в первом уроке: горизонтом на свет и тьму,
// столбом на «прибывает» и «убывает». Четыре сектора — это два авторских деления,
// поданные картинкой, а не терминами. Ни слова «полка», ни цифр на этом уровне нет.
const SEC = [
  {id:0, n:'Ночь',  sh:[11,0,1],  d:'темно, и свет ещё не прибывает'},
  {id:1, n:'Утро',  sh:[2,3,4],   d:'ещё сумрачно или уже светло, но свет прибывает'},
  {id:2, n:'День',  sh:[5,6,7],   d:'светло, разгар'},
  {id:3, n:'Вечер', sh:[8,9,10],  d:'ещё светло, но свет убывает'}
];

// Карточки — бытовые приметы, а НЕ имена времён: иначе ответ написан на лицевой стороне.
const DAY = [
  {e:'⏰', t:'Будильник',                s:1, w:'Света ещё мало, но он уже прибывает — это утро.'},
  {e:'🌑', t:'Все спят, темнота густая', s:0, w:'Ничего не происходит, свет не убывает и не прибывает — дно круга.'},
  {e:'🌗', t:'Самая короткая тень',      s:2, w:'Выше солнце уже не поднимется. Это середина светлой половины.'},
  {e:'💡', t:'В окнах включили свет',    s:3, w:'Свет включают, когда снаружи темнеет, — а не когда уже темно.'},
  {e:'🐦', t:'Первые птицы',             s:0, w:'Ещё темно, но свет уже тронулся — самый край ночи.'},
  {e:'🌅', t:'Солнце вышло из-за края',  s:1, w:'Тот самый короткий миг, ради которого шло всё утро.'},
  {e:'🥵', t:'Самое жаркое время',       s:2, w:'Жара приходит уже после полудня: работа дня сделана и накопилась.'},
  {e:'🌆', t:'Тени вытянулись',          s:3, w:'Солнце клонится, свет убывает — вечерняя половина.'},
  {e:'☕', t:'Первая чашка кофе',        s:1, w:'День ещё только собирается — это утренняя половина.'},
  {e:'🛏️', t:'Дети уснули',              s:0, w:'Свет ушёл совсем: круг вернулся в покой.'},
  {e:'🍲', t:'Обед на столе',            s:2, w:'Самая середина светлого времени.'},
  {e:'🌒', t:'Последний отблеск заката', s:3, w:'Свет ещё виден, но это его последний остаток.'}
];
// Фокус в конце уровня: тот же круг, другое явление.
const FIRE = [
  {e:'🪵', t:'Сложены щепки, огня нет',  s:0, w:'Всё готово, но ничего не происходит — то же дно круга.'},
  {e:'🔥', t:'Вспыхнуло',               s:1, w:'Короткий миг, после которого костёр есть. Как восход.'},
  {e:'♨️', t:'Ровный жар, красные угли', s:2, w:'Разгар: то, ради чего костёр разводили.'},
  {e:'🌫️', t:'Остыли, остался пепел',    s:3, w:'Итог. Круг закрылся.'}
];

// ═══ УРОВЕНЬ 2 ════════════════════════════════════════════════════════
const SHELF = [
 {n:'Скрытая основа',   f:'Держит явление, не участвуя в нём: то, из чего всё выходит и куда возвращается.'},
 {n:'Искра',            f:'Первое поступление извне после покоя: вход и ресурс, который ещё не тратили.'},
 {n:'Заря',             f:'Длительная подготовка до главного события: рубеж ещё не перейдён.'},
 {n:'Проявление Света', f:'Главное событие: явление выходит наружу, рождается.'},
 {n:'Подъём',           f:'Устойчивый рост и переработка вышедшего в дело: умение одного.'},
 {n:'Накопитель',       f:'Запас и тонкая настройка перед вершиной.'},
 {n:'Вершина',          f:'Максимум явления: здесь делается главная работа.'},
 {n:'Первая Тьма',      f:'Работа окончена, результат достигнут: точка проверки.'},
 {n:'Вечерняя Заря',    f:'Работа с уже готовым: разделить, очистить, привести в порядок.'},
 {n:'Проявление Тьмы',  f:'Итог подводится не боем, а мерой: взвесить, оценить, договориться.'},
 {n:'Сумерки',          f:'Остаток расходится на множество одинаковых частей.'},
 {n:'Последний Свет',   f:'Последнее действие круга: отдать наружу и отсечь.'}
];
// Готовые пары различения из разбора источника — берутся, когда чётность не различает.
const PAIR = {
 '0-6':'В нуле смешивают, границы стираются. В шестёрке складывают — части остаются различимы.',
 '1-7':'Единица — ресурс, который ещё не тратили. Семёрка — результат, который уже проверяют.',
 '2-8':'Двойка работает с сырым до вершины. Восьмёрка — с готовым после неё.',
 '3-9':'Тройка запускает: побеждает то, что рождается. Девятка закрывает: побеждает то, что уходит.',
 '4-10':'Четвёрка — умение одного. Десятка — множество одинакового.',
 '5-11':'Пятёрка копит и удерживает. Одиннадцатая выводит наружу.'
};
const pairText = (a,b) => PAIR[Math.min(a,b)+'-'+Math.max(a,b)] || null;

const KUHNYA = ['Вход / Фартук','Мойка','Разделочный стол','Плита','Стол полуфабрикатов',
  'Шкаф специй','Стол для готовки','Стол готовых блюд','Делим на порции','Оценочный стол',
  'Шведский стол','Вынос блюд'];

const S = { lvl:0, mode:'menu', deck:[], i:0, right:0, placed:{}, rev:null, sel:null, src:null };
const app = () => document.getElementById('app');
const el = h => { const d=document.createElement('div'); d.innerHTML=h; return d; };

// ─── круг уровня 1: четыре сектора, залитых как сами сутки ───
function ring(){
  const cx=160, cy=160, R=118, r=62;
  const arc=(from,to,fill,op)=>{
    const a1=(90+from*30)*Math.PI/180, a2=(90+to*30)*Math.PI/180;
    const p=(rad,ang)=>[cx+rad*Math.cos(ang), cy+rad*Math.sin(ang)];
    const [x1,y1]=p(R,a1),[x2,y2]=p(R,a2),[x3,y3]=p(r,a2),[x4,y4]=p(r,a1);
    return `<path d="M${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 0 0 ${x4} ${y4} Z" fill="${fill}" opacity="${op}"/>`;
  };
  const FILL=['#1b2340','#3f5f9e','#f0c66a','#c9743f'];   // ночь · утро · день · вечер
  let out='';
  SEC.forEach((s,k)=>{
    const from=(k===0? -1 : s.sh[0]), to=from+3;
    const done=s.sh.filter(x=>S.placed[x]).length;
    out+=`<g class="sect" onclick="put(${k})">${arc(from,to,FILL[k], .86)}</g>`;
    const am=(90+(from+1.5)*30)*Math.PI/180, lx=cx+((R+r)/2)*Math.cos(am), ly=cy+((R+r)/2)*Math.sin(am);
    out+=`<text x="${lx}" y="${ly-1}" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" style="pointer-events:none">${s.n}</text>`;
    if(done) out+=`<text x="${lx}" y="${ly+16}" text-anchor="middle" font-size="11.5" fill="rgba(255,255,255,.9)" style="pointer-events:none">${'•'.repeat(done)}</text>`;
  });
  return `<svg viewBox="0 0 320 320">${out}
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--bg)"/>
    <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="11.5" fill="var(--tx3)">← свет прибывает</text>
    <text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="11.5" fill="var(--tx3)">свет убывает →</text></svg>`;
}

// ─── круг уровня 2: двенадцать долей ───
function wheel12(){
  const cx=160, cy=150, R=104, out=[];
  for(let i=0;i<12;i++){
    const a=(90+i*30)*Math.PI/180, x=cx+R*Math.cos(a), y=cy+R*Math.sin(a);
    const filled=S.placed[i]!==undefined, isSel=S.sel===i, isOpp=S.sel!==null&&i===(S.sel+6)%12;
    const cr=[0,3,6,9].includes(i)?'var(--op)':([2,5,8,11].includes(i)?'var(--ve)':'var(--up)');
    const fill = filled? cr : 'var(--card)';
    const stroke = isSel? 'var(--acc)' : (isOpp? 'var(--acc)' : (filled? cr : 'var(--line)'));
    // широкие доли — долгие протяжённые времена, узкие — короткие переломы
    const rad = i%2===0 ? 19 : 13;
    out.push(`<g class="sect" onclick="pick(${i})">
      <circle cx="${x}" cy="${y}" r="${rad}" fill="${fill}" stroke="${stroke}" stroke-width="${isSel||isOpp?3:1.5}"/>
      <text x="${x}" y="${y+5}" text-anchor="middle" font-size="${i%2===0?14:11}" font-weight="700"
            fill="${filled||isSel?'#fff':'var(--tx2)'}">${i}</text></g>`);
  }
  return `<svg viewBox="0 0 320 300">
    <line x1="${cx}" y1="${cy-R}" x2="${cx}" y2="${cy+R}" stroke="var(--line2)"/>
    <line x1="${cx-R}" y1="${cy}" x2="${cx+R}" y2="${cy}" stroke="var(--line2)"/>
    ${out.join('')}</svg>`;
}

// ═══ уровень 1 ═══
function startL1(src){
  S.lvl=1; S.mode='play'; S.src=src; S.i=0; S.right=0; S.placed={}; S.rev=null; S.sel=null;
  S.deck = (src==='fire'? FIRE : DAY).map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);
  render();
}
function put(k){
  if(S.mode!=='play'||S.lvl!==1) return;
  const c=S.deck[S.i], ok=c.s===k;
  if(ok) S.right++;
  const free=SEC[c.s].sh.find(x=>!S.placed[x]); if(free!==undefined) S.placed[free]=1;
  // на промахе не повторяем определение сектора — карточка объясняет себя сама
  S.rev={ok, head: ok?'Да':'Почти', body:(ok?'':`Это <b>${SEC[c.s].n}</b>. `)+c.w};
  S.mode='reveal'; render();
}

// ═══ уровень 2 ═══
function startL2(){
  S.lvl=2; S.mode='play'; S.i=0; S.right=0; S.placed={}; S.rev=null; S.sel=null;
  const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
  S.deck = sh([0,3,6,9]).concat(sh([1,2,4,5,7,8,10,11]));   // авторский порядок: сперва опоры
  render();
}
function pick(i){ if(S.mode!=='play'||S.lvl!==2) return; S.sel=(S.sel===i?null:i); render(); }
function place(){
  const truth=S.deck[S.i], shelf=S.sel, ok=shelf===truth;
  if(ok) S.right++;
  let head, body;
  if(ok){ head='Точно'; body=`<b>${SHELF[truth].n}.</b> ${SHELF[truth].f}`; }
  else {
    const pt=pairText(shelf,truth);
    head = shelf===(truth+6)%12 ? 'Ровно напротив' : 'Мимо';
    body = `«${KUHNYA[truth]}» живёт на <b>${truth} · ${SHELF[truth].n}</b> — ${SHELF[truth].f}<br><br>`
         + `<b>Ты положил на ${shelf} · ${SHELF[shelf].n}</b> — ${SHELF[shelf].f}<br><br>`
         + (pt ? pt
              : (shelf%2!==truth%2
                  ? `Различает длительность: ${shelf%2===0?shelf:truth} — долгое протяжённое время, ${shelf%2===0?truth:shelf} — короткий перелом.`
                  : `Эти две разводятся не признаком, а порядком работы: посмотри, что стоит рядом.`));
  }
  S.placed[truth]=truth; S.rev={ok, head, body}; S.mode='reveal'; render();
}
function next(){
  S.rev=null; S.sel=null; S.i++;
  S.mode = S.i>=S.deck.length ? 'end' : 'play';
  render();
}

function render(){
  const a=app(), sub=document.getElementById('sub'); a.innerHTML='';

  if(S.mode==='menu'){
    sub.textContent='Круг, по которому идёт любое дело';
    a.appendChild(el(`${ring()}
      <div class="lead">Сутки — это круг: внизу темно и тихо, слева светлеет, наверху разгар,
      справа всё сходит на нет. <b>Любое дело идёт так же.</b></div>
      <div class="row" style="margin-top:14px"><button class="pri big" onclick="startL1('day')">Начали</button></div>
      <div class="muted">Первый уровень — одно действие: посмотреть на карточку и ткнуть в сектор.
      Ни правил, ни терминов, ни очков.</div>
      <div class="row" style="margin-top:18px"><button onclick="startL2()">Я уже знаю Ясну → двенадцать долей</button></div>`));
    return;
  }

  if(S.lvl===1){
    sub.textContent = S.src==='day' ? 'Уровень 1 · раскладываем свой день' : 'Тот же круг — другое явление';
    a.appendChild(el(ring()));
    a.appendChild(el(`<div class="prog">${S.deck.map((_,k)=>`<i class="${k<S.i?'done':''}"></i>`).join('')}</div>`));

    if(S.mode==='end'){
      if(S.src==='day'){
        a.appendChild(el(`<div class="card"><b>Круг собран.</b> ${S.right} из 12 с первого раза.
          <div class="muted" style="margin-top:8px">А теперь фокус: те же четыре сектора,
          но речь пойдёт совсем не о сутках.</div>
          <div class="row" style="margin-top:12px"><button class="pri big" onclick="startL1('fire')">Показать фокус</button></div></div>`));
      } else {
        a.appendChild(el(`<div class="card"><b>Круг был не про сутки.</b>
          <div class="sub" style="margin-top:8px">Костёр лёг на те же четыре места: сложенные щепки —
          там же, где глухая ночь; вспышка — там же, где восход; ровный жар — там же, где полдень;
          пепел — там же, где закат. Это и есть Ясна: у любого явления одно устройство, меняется
          только оболочка.</div>
          <div class="row" style="margin-top:14px">
            <button class="pri" onclick="startL2()">Дальше: разделить круг на двенадцать</button>
            <button onclick="S.mode='menu';S.lvl=0;render()">В начало</button></div></div>`));
      }
      return;
    }
    if(S.mode==='reveal'){
      a.appendChild(el(`<div class="rv ${S.rev.ok?'ok':'no'}"><div class="hd">${S.rev.head}</div>
        <div class="bd">${S.rev.body}</div></div>
        <div class="row"><button class="pri big" onclick="next()">Дальше →</button></div>`));
      return;
    }
    const c=S.deck[S.i];
    a.appendChild(el(`<div class="card now"><div class="em">${c.e}</div><div class="el">${c.t}</div></div>
      <div class="row">${SEC.map((s,k)=>`<button onclick="put(${k})">${s.n}</button>`).join('')}</div>
      <div class="muted">Спроси себя дважды: светло или темно? и свет прибывает или убывает?</div>`));
    return;
  }

  // ─── уровень 2 ───
  sub.textContent='Уровень 2 · Ясна Кухни, двенадцать долей';
  a.appendChild(el(wheel12()));
  if(S.mode==='end'){
    a.appendChild(el(`<div class="card"><b>Готово.</b> Точных попаданий: ${S.right} из 12.
      <div class="muted" style="margin-top:8px">В продукте здесь — карта различений: какие две доли
      ты путаешь чаще всего и какой вопрос их разводит. Плюс «тень»: партия пишется логом, и по ней
      можно играть против другого человека.</div>
      <div class="row" style="margin-top:12px"><button onclick="S.mode='menu';S.lvl=0;render()">В начало</button></div></div>`));
    return;
  }
  if(S.mode==='reveal'){
    a.appendChild(el(`<div class="rv ${S.rev.ok?'ok':'no'}"><div class="hd">${S.rev.head}</div>
      <div class="bd">${S.rev.body}</div></div>
      <div class="row"><button class="pri big" onclick="next()">Дальше →</button></div>`));
    return;
  }
  const t=S.deck[S.i];
  const opp=S.sel!==null?(S.sel+6)%12:null;
  const oppEl=(opp!==null&&S.placed[opp]!==undefined)?KUHNYA[S.placed[opp]]:null;
  a.appendChild(el(`<div class="card now"><div class="el">${KUHNYA[t]}</div></div>
    ${S.sel!==null&&oppEl?`<div class="card" style="padding:11px 14px;font-size:13px;color:var(--tx2)">
      Напротив стоит <b style="color:var(--tx)">${oppEl}</b>. Это противоположность тому, что в руке?</div>`:''}
    <div class="row"><button class="pri big" ${S.sel===null?'disabled':''} onclick="place()">
      ${S.sel===null?'Выбери долю на круге':'Поставить сюда'}</button></div>
    <div class="muted">Широкие доли — долгие протяжённые времена, узкие — короткие переломы.
    Сперва идут четыре главные, потом остальные.</div>`));
}

S.mode='menu'; render();
</script>
