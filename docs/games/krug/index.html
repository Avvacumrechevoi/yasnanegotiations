<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Что напротив · Ясна</title>
<!--
  «Что напротив» — круг суток на игровом экране, игра спрашивает по одной вещи,
  ответ проводит нитку через середину.

  Выбран из пяти вариантов после CJM провалившегося прототипа docs/games/naprotiv/.
  Диагноз того провала: круг был не иллюстрацией, а ЕДИНСТВЕННЫМ носителем правила.
  Без него «напротив» нечему быть напротив, и половина экранного текста уходит
  на объяснение того, что картинка показывала сама.

  Правила этой сборки:
   • ни одного термина метода на экране: ни оси, ни полки, ни креста, ни чётности;
   • ни одной цифры позиции;
   • карточки — бытовые приметы, а не номенклатура («Первые птицы», не «Искра»);
   • ширина дольки несёт первый закон: широкие — долгие времена, узкие — переломы;
   • злые отвлекающие с первого вопроса: в четвёрке всегда сосед верного места,
     иначе взрослый берёт всё не думая и красной нитки не бывает никогда;
   • ни счёта, ни потолка, ни квот, ни тренировки, ни таймера, ни чипов.

  ТРЕБУЕТ ВРЕМЕНИ АВТОРА (помечено, не замазано):
   1. Колода построена по ЗАКОНАМ метода (Ночь↔День, Восход↔Закат), а НЕ по массиву
      T['суток'] в docs/core/data.js, где Восход стоит на 4, а Закат на 8 — там они
      не напротив. Ровно на этом расхождении прошлый прототип отвечал «не сошлось»
      на верное рассуждение. Одна строка решения автора, ~10 минут.
   2. Шесть разборов — утверждения о методе, копипастом не берутся, ~30 минут.
   3. Каждое следующее явление: 12 бытовых карточек и 6 разборов, 40–60 минут.
-->
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --tx:#12151c; --tx2:#4a5265; --tx3:#8b93a7;
    --line:#e2e6ed; --acc:#F0B93F; --acct:#1B1405;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0e1116; --card:#171b23; --tx:#eef1f6; --tx2:#a8b0c2; --tx3:#727b8f;
           --line:#252b36; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:14px 14px 34px;max-width:440px;margin:0 auto;
    display:flex;flex-direction:column;min-height:100vh}

  /* ─── кольцо ─── */
  #wrap{position:relative;width:100%;max-width:340px;margin:0 auto;flex:0 0 auto}
  #wrap:before{content:'';display:block;padding-top:100%}
  #ring{position:absolute;inset:0;width:100%;height:100%}
  .wedge{transition:fill .9s ease}
  .wedge.intro{opacity:0;animation:wIn .34s ease forwards}
  @keyframes wIn{to{opacity:1}}
  .em{position:absolute;transform:translate(-50%,-50%);font-size:19px;line-height:1;
      opacity:0;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .em.on{animation:pop .34s cubic-bezier(.2,1.6,.4,1) forwards}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
                 100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  .em.fade{transition:opacity .28s} .em.fade.out{opacity:0}
  .chord{stroke-width:2.5;stroke-linecap:round;fill:none;
    stroke-dasharray:230;stroke-dashoffset:230;animation:draw .5s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .tgt{fill:none;stroke:#FFD479;stroke-width:2.5;animation:tgt 1.1s ease-in-out infinite}
  @keyframes tgt{0%,100%{opacity:.25}50%{opacity:.95}}
  .lab{font-size:11.5px;font-weight:600;letter-spacing:.04em}

  /* ─── нижний блок ─── */
  #panel{flex:1 0 auto;min-height:186px;margin-top:6px;display:flex;flex-direction:column;justify-content:flex-start}
  .ask{background:var(--card);border:1px solid var(--line);border-radius:15px;
    padding:14px 16px;text-align:center}
  .ask .big{font-size:19px;font-weight:650;line-height:1.3}
  .ask .big .e{font-size:22px}
  .ask .small{font-size:13.5px;color:var(--tx3);margin-top:5px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .opt{background:var(--card);border:1.5px solid var(--line);border-radius:13px;
    padding:12px 9px;font:inherit;color:inherit;font-size:13.5px;line-height:1.25;
    text-align:center;cursor:pointer;min-height:64px;transition:.12s}
  .opt:hover{border-color:var(--tx3)}
  .opt.pick{border-color:#FFD479;box-shadow:0 0 0 2.5px rgba(255,212,121,.28)}
  .opt.bad{border-color:#E0563C;animation:wob .3s}
  @keyframes wob{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .say{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 16px}
  .say .hd{font-weight:700;margin-bottom:5px}
  .say .bd{font-size:14.5px;line-height:1.5;color:var(--tx2)}
  .go{display:block;width:100%;margin-top:10px;background:var(--acc);color:var(--acct);
    border:0;border-radius:13px;padding:14px;font:inherit;font-size:16px;font-weight:650;cursor:pointer}
  .go.ghost{background:transparent;color:var(--tx2);border:1px solid var(--line)}
  .lead{text-align:center;font-size:15px;line-height:1.45;color:var(--tx2);padding:6px 4px}
  .lead b{color:var(--tx)}
  .note{font-size:12px;color:var(--tx3);text-align:center;margin-top:14px;line-height:1.45}
</style>

<!-- холст шире кольца: боковым подписям «утро» и «вечер» нужны поля, иначе их срезает -->
<div id="wrap"><svg id="ring" viewBox="-20 -10 380 380"></svg></div>
<div id="panel"></div>

<script>
/* ═══ данные ═══ */
const C=170, R=140, Ri=92, Rem=116;
/* холст svg смещён и шире кольца — эмодзи лежат html-слоем поверх, поэтому их
   проценты считаются по этому же прямоугольнику, а не по 340 */
const VB={x:-20, y:-10, w:380};
const pctX=x=>((x-VB.x)/VB.w*100)+'%';
const pctY=y=>((y-VB.y)/VB.w*100)+'%';

/* Сутки. Порядок: 0 — глухая ночь, дальше по кругу через утро, день, вечер.
   Напротив каждого — то, что стоит через шесть мест. */
const DAY=[
 {e:'🌑',t:'Все спят, темнота густая'},
 {e:'🐦',t:'Первые птицы'},
 {e:'🌫️',t:'Небо серое, солнца ещё нет'},
 {e:'🌅',t:'Солнце вышло из-за края'},
 {e:'🚌',t:'Все едут на работу'},
 {e:'🍽️',t:'Накрывают на стол'},
 {e:'🌞',t:'Самая короткая тень'},
 {e:'🥵',t:'Самое жаркое время'},
 {e:'🌇',t:'Тени вытянулись'},
 {e:'🌆',t:'Солнце ушло за край'},
 {e:'🚗',t:'Все едут домой'},
 {e:'🛏️',t:'Стелют постель'}
];
const FIRE=['🪵','✨','💨','🔥','🪔','🍢','♨️','🥵','🌫️','🕯️','🪨','⚱️'];

const PAL_DAY=['#131A30','#1B2545','#2F4472','#4D74B4','#8AA6D4','#D3C493',
               '#F5CF74','#EAB35C','#D8894A','#C06A3C','#7A4634','#3B2A33'];
const PAL_FIRE=['#17120F','#2A1A12','#4D2311','#8C2F10','#C2470F','#E2700F',
                '#FFD15C','#F2A63A','#CF6A2C','#94502E','#6A5A55','#2E2B2A'];

/* Разборы — по одному на каждую пару. Бытовым языком, без единого термина. */
const WHY=[
 'Ниже всего свет — и выше всего свет. Между ними ровно половина круга в любую сторону.',
 'Птицы просыпаются раньше солнца, а жара приходит позже полудня. Начало опережает, вершина запаздывает.',
 'Свет ещё без солнца — и свет уже без солнца. Одно и то же небо, только идёт в разные стороны.',
 'Солнце пересекает край ровно дважды: когда приходит и когда уходит. Одно событие, два конца.',
 'Утром весь город течёт в одну сторону, вечером — ровно в обратную. Тот же поток, развёрнутый.',
 'К обеду накрывают, к ночи стелют. Оба раза готовят то, что вот-вот начнётся.'
];

/* Порядок вопросов. Ноль показывается даром в самом начале, последняя пара закрывается
   сама. Каждый вопрос уносит с поля ровно две карточки, поэтому вариантов остаётся
   9 → 7 → 5 → 3: четвёртый вопрос идёт уже с тремя кнопками, и это потолок.
   Сперва два лёгких (солнце, поток людей), третьим — запаздывание жары, ради которого
   всё и затевалось: там ещё четыре варианта и есть чему ошибиться. */
const ORDER=[3,4,1,2];

/* ═══ состояние ═══ */
const S={ph:'intro', chord:new Array(6).fill(null), placed:new Array(12).fill(false),
         q:null, pick:null, step:0, right:0, fire:false};

const A=i=>90+30*i;
const P=(r,i)=>[C+r*Math.cos(A(i)*Math.PI/180), C+r*Math.sin(A(i)*Math.PI/180)];
const Pa=(r,a)=>[C+r*Math.cos(a*Math.PI/180), C+r*Math.sin(a*Math.PI/180)];
const pal=()=>S.fire?PAL_FIRE:PAL_DAY;

function wedgePath(i){
  const w=i%2?22:34, a0=A(i)-w/2, a1=A(i)+w/2;
  const [x0,y0]=Pa(R,a0),[x1,y1]=Pa(R,a1),[x2,y2]=Pa(Ri,a1),[x3,y3]=Pa(Ri,a0);
  return `M${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${Ri} ${Ri} 0 0 0 ${x3} ${y3}Z`;
}

/* ═══ кольцо ═══ */
function drawRing(intro){
  const sv=document.getElementById('ring'), w=document.getElementById('wrap');
  let s='';
  for(let i=0;i<12;i++)
    s+=`<path class="wedge${intro?' intro':''}" style="animation-delay:${intro?i*0.038:0}s"
         d="${wedgePath(i)}" fill="${pal()[i]}"/>`;

  const labs=S.fire?['дрова','огонь','жар','угли']:['ночь','утро','день','вечер'];
  [0,3,6,9].forEach((i,k)=>{
    const [x,y]=P(R+15,i);
    s+=`<text class="lab" x="${x}" y="${y+4}" text-anchor="middle"
         fill="var(--tx3)">${labs[k]}</text>`;
  });

  /* орбита солнца и луны — только пока не начали отвечать */
  if(S.ph==='intro') s+=`<g><animateTransform attributeName="transform" type="rotate"
      from="0 ${C} ${C}" to="360 ${C} ${C}" dur="26s" repeatCount="indefinite"/>
      <circle cx="${C}" cy="${C-52}" r="5.5" fill="#F5CF74"/>
      <circle cx="${C}" cy="${C+52}" r="4" fill="#5b6478"/>
      <line x1="${C}" y1="${C-52}" x2="${C}" y2="${C+52}" stroke="var(--line)" stroke-width="1"/></g>`;

  /* нитки */
  for(let k=0;k<6;k++){
    if(!S.chord[k]) continue;
    const [x1,y1]=P(Ri-5,k), [x2,y2]=P(Ri-5,k+6);
    const col=S.chord[k]==='gold'?'#FFD479':'#7B8496';
    s+=`<line class="chord" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
         stroke="${col}" opacity="${S.chord[k]==='gold'?1:.55}"/>`;
  }

  /* пульсирующее пустое место, куда ищем пару */
  if(S.q && S.pick===null){
    const [x,y]=P(Rem,S.q.want);
    s+=`<circle class="tgt" cx="${x}" cy="${y}" r="15"/>`;
    const [x1,y1]=P(Ri-5,S.q.show), [x2,y2]=P(Ri-5,S.q.want);
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#FFD479"
         stroke-width="1.5" stroke-dasharray="4 5" opacity=".5"/>`;
  }
  sv.innerHTML=s;

  /* эмодзи — html-слоем поверх svg, координаты в процентах */
  [...w.querySelectorAll('.em')].forEach(n=>n.remove());
  for(let i=0;i<12;i++){
    if(!S.placed[i]) continue;
    const [x,y]=P(Rem,i);
    const d=document.createElement('div');
    d.className='em on'; d.dataset.i=i;
    d.style.left=pctX(x); d.style.top=pctY(y);
    d.textContent=S.fire?FIRE[i]:DAY[i].e;
    w.appendChild(d);
  }
}

/* ═══ экраны ═══ */
const pan=()=>document.getElementById('panel');
const el=h=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};

function intro(){
  S.ph='intro'; drawRing(true);
  pan().innerHTML='';
  pan().appendChild(el(`<div class="lead">Круг суток. Внизу глухая ночь, слева светает,
    наверху разгар, справа всё уходит.</div>`));
  setTimeout(()=>{ if(S.ph==='intro') demo(); }, 1500);
}

function demo(){
  S.ph='demo';
  S.placed[0]=S.placed[6]=true; S.chord[0]='gold';
  drawRing(false);
  pan().innerHTML='';
  pan().appendChild(el(`<div class="say"><div class="hd">Вот как это работает</div>
    <div class="bd">🌑 Когда все спят — и 🌞 когда тень самая короткая.
    Они связаны ниткой через середину: это два конца одного и того же.<br><br>
    ${WHY[0]}</div></div>`));
  pan().appendChild(el(`<button class="go" onclick="ask()">Дальше →</button>`));
}

function ask(){
  /* Проверка «осталось двое» обязана идти ПЕРВОЙ. Если сначала смотреть, кончились ли
     вопросы, игра проскочит в финал и молча запишет последнюю нитку себе в актив —
     а её никто не тянул. */
  const free=[...Array(12).keys()].filter(i=>!S.placed[i]);
  if(free.length===2){
    const a=Math.min(...free);
    S.placed[free[0]]=S.placed[free[1]]=true;
    S.chord[a%6]='gold';
    S.ph='last'; drawRing(false);
    pan().innerHTML='';
    pan().appendChild(el(`<div class="say"><div class="hd">Эти двое остались вдвоём</div>
      <div class="bd">${DAY[free[0]].e} ${DAY[free[0]].t.toLowerCase()} и
      ${DAY[free[1]].e} ${DAY[free[1]].t.toLowerCase()} — больше не с кем.
      Круг замкнулся.<br><br>${WHY[a%6]}</div></div>`));
    pan().appendChild(el(`<button class="go" onclick="done()">Посмотреть, что вышло →</button>`));
    return;
  }
  if(S.step>=ORDER.length){ return done() }

  const k=ORDER[S.step], show=k, want=k+6;
  /* злые отвлекающие: всегда сосед верного места */
  const pool=free.filter(i=>i!==show&&i!==want)
    .map(i=>[Math.min(Math.abs(i-want),12-Math.abs(i-want)),i])
    .sort((a,b)=>a[0]-b[0]).slice(0,4).map(v=>v[1]);
  const opts=[want,...pool.slice(0,3)].map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);

  S.q={show,want,opts}; S.pick=null; S.ph='ask';
  S.placed[show]=true;
  drawRing(false);

  pan().innerHTML='';
  pan().appendChild(el(`<div class="ask">
    <div class="big"><span class="e">${DAY[show].e}</span> ${DAY[show].t}</div>
    <div class="small">а что напротив?</div></div>`));
  const g=el('<div class="opts"></div>');
  opts.forEach(i=>{
    const b=document.createElement('button');
    b.className='opt'; b.innerHTML=`${DAY[i].e}<br>${DAY[i].t}`;
    b.onclick=()=>answer(i,b);
    g.appendChild(b);
  });
  pan().appendChild(g);
}

function answer(i,btn){
  if(S.pick!==null) return;
  const {show,want}=S.q;
  const ok = i===want;
  S.pick=i;
  if(!ok){ btn.classList.add('bad') } else { btn.classList.add('pick') }

  setTimeout(()=>{
    /* Каждый вопрос уносит с поля РОВНО ДВЕ карточки — показанную и её пару.
       На промахе выбранная не встаёт на кольцо: она возвращается в колоду и может
       спроситься ещё раз. Иначе поле пустеет по три за ход и последние вопросы
       остаются без вариантов. */
    S.placed[want]=true;
    S.chord[show%6] = ok ? 'gold' : 'grey';
    if(ok) S.right++;
    S.q=null; S.ph='say'; drawRing(false);
    pan().innerHTML='';
    pan().appendChild(el(`<div class="say">
      <div class="hd">${ok?'Да':'Не это'}</div>
      <div class="bd">${ok?'':`Напротив стоит ${DAY[want].e} <b>${DAY[want].t.toLowerCase()}</b>. `}
      ${WHY[show%6]}</div></div>`));
    S.step++;
    pan().appendChild(el(`<button class="go" onclick="ask()">Дальше →</button>`));
  }, ok?260:420);
}

function done(){
  S.ph='done';
  for(let i=0;i<12;i++) S.placed[i]=true;
  drawRing(false);
  /* Считаем только то, о чём спрашивали: первая нитка показана даром, последняя
     закрылась сама. Приписывать их игроку — врать ему в лицо на финальном экране. */
  const n=ORDER.length, mine=S.right;
  pan().innerHTML='';
  pan().appendChild(el(`<div class="say"><div class="hd">Круг связан</div>
    <div class="bd">Шесть ниток, и каждая соединяет два конца одного и того же.
    Спрашивали про ${n}: ${mine===n?'все ' + n + ' ты нашёл сразу.'
      : mine===0?'ни одна не легла с первого раза — зато теперь видно, как круг устроен.'
      : mine + ' из них ты нашёл сразу.'}</div></div>`));
  pan().appendChild(el(`<button class="go" onclick="focus_()">Ничего не трогай →</button>`));
}

/* ═══ фокус: тот же круг — другое явление ═══ */
function focus_(){
  S.ph='focus';
  const w=document.getElementById('wrap');
  [...w.querySelectorAll('.em')].forEach(n=>{ n.className='em fade'; n.style.opacity=1; });
  pan().innerHTML='';
  pan().appendChild(el(`<div class="lead">…</div>`));

  setTimeout(()=>{
    [...w.querySelectorAll('.em')].forEach(n=>n.classList.add('out'));
  },120);

  setTimeout(()=>{
    S.fire=true;
    drawRing(false);
    pan().innerHTML='';
    pan().appendChild(el(`<div class="say"><div class="hd">Тот же круг. Это костёр.</div>
      <div class="bd">Дрова лежат там же, где глухая ночь. Ровный жар — там же, где полдень.
      А угли, которые жгут сильнее пламени, — там же, где самое жаркое время дня.<br><br>
      Нитки не сдвинулись ни на волос: поменялась только оболочка.</div></div>`));
    pan().appendChild(el(`<button class="go" onclick="restart()">Ещё раз →</button>`));
    pan().appendChild(el(`<div class="note">Прототип. Сутки и костёр расписаны целиком;
      остальные явления — по 12 бытовых карточек на каждое, это работа автора метода.</div>`));
  },560);
}

function restart(){
  S.ph='intro'; S.chord=new Array(6).fill(null); S.placed=new Array(12).fill(false);
  S.q=null; S.pick=null; S.step=0; S.right=0; S.fire=false;
  intro();
}

intro();
</script>
