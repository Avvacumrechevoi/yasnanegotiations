<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ясна. Круг</title>
<!--
  «Что напротив» — круг явления, игра спрашивает по одной вещи, ответ протягивает
  нитку через середину. В конце тот же круг оказывается костром.

  ═══ ЧТО ИСПРАВЛЕНО В ЭТОЙ ВЕРСИИ (разбор пути тремя персонами + излом) ═══

  1. КУЛЬМИНАЦИЯ ОПРОВЕРГАЛА САМА СЕБЯ. drawRing делал sv.innerHTML=s, то есть
     пересоздавал все узлы при каждой перерисовке. Из-за этого .wedge{transition:fill}
     не запускался НИКОГДА (заявленное перетекание за 0.9 с не существовало), а все
     шесть ниток стирались и прочерчивались заново — ровно под словами «нитки не
     сдвинулись ни на волос». Теперь узлы создаются один раз и дальше только меняют
     атрибуты; нитка, однажды протянутая, физически та же самая до конца партии.

  2. ИГРА ВРАЛА ПРО МЕТОД В ДВУХ РАЗБОРАХ. Старый WHY для пары птицы↔жара читался как
     «вершина запаздывает», хотя вершина — полдень, а жара это уже перелом после него.
     Старый WHY для пары небо↔тени описывал сумерки («свет уже без солнца»), а не то
     место, где солнце ещё в небе и оттого тени вытянулись. Оба переписаны.

  3. ПОДПИСЬ «УГЛИ» СТОЯЛА НЕ ТАМ, ПРО ЧТО НАПИСАН ТЕКСТ. Текст фокуса утверждает, что
     угли стоят там же, где самое жаркое время (место 7), а подпись рисовалась на 9.
     Подписи костра теперь на 0·3·6·7 — слово в слово по тексту, игроку есть чем
     проверить утверждение.

  4. ДВА ЗНАЧКА КОСТРА ДОСЛОВНО ПОВТОРЯЛИ СУТОЧНЫЕ (🥵 на том же месте, 🌫️ со второго).
     На экране «поменялась только оболочка» это самоопровержение. Заменены.

  5. ВОПРОСОВ ТРИ ВМЕСТО ЧЕТЫРЁХ. Четвёртый собирался только из трёх кнопок — материала
     на него нет. Заодно выброшен худший вопрос игры («на работу → домой»): он решался
     повтором слов из заголовка, шёл вторым подряд после такого же и учил игрока правилу
     «ищи зеркальную фразу», не имеющему отношения к кругу. Теперь птицы с жарой —
     единственное место, где круг спорит с привычкой — приходят на 0:29, а не на 0:45.

  6. ПРОМАХ РАЗВЕДЁН НА ДВА ЭКРАНА. Сначала «Не это» и куда встаёт правда, кнопка
     «С чего вдруг? →», и только потом разбор. Пик всей партии жил 420 мс и гасился
     ответом, которого никто не просил.

  7. ФИНАЛ БОЛЬШЕ НЕ ЛЬСТИТ. Старый писал «спрашивали про 4: все 4 ты нашёл сразу» —
     то есть поздравлял ровно с тем, что метод не понадобился. Цифр в финале нет.

  8. У ИГРЫ ПОЯВИЛОСЬ ИМЯ. Слова «Ясна» в файле не было ни разу, поэтому на вопрос
     «а что это было?» рассказчик ответить не мог.

  ТРЕБУЕТ ПОДПИСИ АВТОРА МЕТОДА (черновики написаны, ~40 минут на сверку):
   • два разбора — птицы↔жара и небо↔тени;
   • четыре подписи костра: дрова · занялось · ровный жар · угли;
   • колода построена по ЗАКОНАМ (Восход↔Закат), а не по массиву T['суток'] в
     docs/core/data.js, где Восход на 4, а Закат на 8 — там они не напротив.
-->
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --tx:#12151c; --tx2:#4a5265; --tx3:#8b93a7;
    --line:#e2e6ed; --acc:#F0B93F; --acct:#1B1405; --gold:#FFD479; --grey:#7B8496;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0e1116; --card:#171b23; --tx:#eef1f6; --tx2:#a8b0c2; --tx3:#727b8f;
           --line:#252b36; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:12px 14px 30px;max-width:440px;margin:0 auto;
    display:flex;flex-direction:column;min-height:100vh}
  body.pair{padding:0;max-width:none;height:100dvh;overflow:hidden}

  #wrap{position:relative;width:100%;max-width:330px;margin:0 auto;flex:0 0 auto;
        transition:opacity .4s}
  #wrap:before{content:'';display:block;padding-top:100%}
  #ring{position:absolute;inset:0;width:100%;height:100%}
  body.pair #wrap{display:none}

  .wedge{transition:fill .55s ease, opacity .45s ease}
  .em{position:absolute;transform:translate(-50%,-50%);font-size:19px;line-height:1;
      pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55));
      transition:opacity .3s}
  .em.pop{animation:pop .34s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
                 100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
  .chord{stroke-width:2.5;stroke-linecap:round;fill:none;
    stroke-dasharray:230;stroke-dashoffset:230;transition:stroke .6s ease, opacity .5s}
  .chord.drawn{stroke-dashoffset:0;transition:stroke-dashoffset .55s ease, stroke .6s ease, opacity .5s}
  .tgt{fill:none;stroke:var(--gold);stroke-width:3;animation:tgt 1.15s ease-in-out infinite}
  @keyframes tgt{0%,100%{opacity:.2}50%{opacity:.95}}
  .lab{font-size:11.5px;font-weight:600;letter-spacing:.04em;transition:opacity .3s}

  #panel{flex:1 0 auto;min-height:180px;margin-top:4px}
  .ask{background:var(--card);border:1px solid var(--line);border-radius:15px;
    padding:13px 16px;text-align:center}
  .ask .big{font-size:19px;font-weight:650;line-height:1.3}
  .ask .small{font-size:13.5px;color:var(--tx3);margin-top:4px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
  .opt{background:var(--card);border:1.5px solid var(--line);border-radius:13px;
    padding:11px 8px 10px;font:inherit;color:inherit;font-size:13.5px;line-height:1.22;
    text-align:center;cursor:pointer;min-height:66px;transition:.12s;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .opt:hover{border-color:var(--tx3)}
  .opt .sil{display:block;height:7px;border-radius:4px;background:var(--tx3);opacity:.5}
  .opt .sil.w{width:26px} .opt .sil.n{width:12px}
  .opt.pick{border-color:var(--gold);box-shadow:0 0 0 2.5px rgba(255,212,121,.28)}
  .opt.bad{border-color:#E0563C;animation:wob .3s}
  @keyframes wob{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .say{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 16px}
  .say .hd{font-weight:700;margin-bottom:5px}
  .say .bd{font-size:14.5px;line-height:1.5;color:var(--tx2)}
  .say .bd b{color:var(--tx)}
  .go{display:block;width:100%;margin-top:9px;background:var(--acc);color:var(--acct);
    border:0;border-radius:13px;padding:14px;font:inherit;font-size:16px;font-weight:650;cursor:pointer}
  .go.gh{background:transparent;color:var(--tx2);border:1px solid var(--line)}
  .lead{text-align:center;font-size:15px;line-height:1.45;color:var(--tx2);padding:4px 4px 0}
  .lead .claim{display:block;margin-top:12px;font-size:17px;color:var(--tx);font-weight:600}
  .note{font-size:12px;color:var(--tx3);text-align:center;margin-top:12px;line-height:1.45}

  /* ── вдвоём с одного телефона ── */
  #pair{display:none;height:100dvh;flex-direction:column}
  body.pair #pair{display:flex}
  body.pair #panel{display:none}
  .half{flex:1;display:flex;flex-direction:column;justify-content:center;
        padding:10px 12px;gap:8px;overflow:hidden}
  .half.top{transform:rotate(180deg)}
  .half .q{text-align:center;font-size:16px;font-weight:650;line-height:1.25}
  .half .q small{display:block;font-weight:400;font-size:12.5px;color:var(--tx3);margin-top:2px}
  .half .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .half .opt{min-height:50px;font-size:12.5px;padding:7px 5px}
  .half.done{align-items:center;justify-content:center}
  .half .waiting{font-size:15px;color:var(--tx3);text-align:center}
  .bar{height:1px;background:var(--line);flex:0 0 auto}
</style>

<div id="wrap"><svg id="ring" viewBox="-20 -10 380 380"></svg></div>
<div id="panel"></div>
<div id="pair"></div>

<script>
/* ═══════════ данные ═══════════ */
const C=170, R=140, Ri=92, Rem=116;
const VB={x:-20, y:-10, w:380};
const pctX=x=>((x-VB.x)/VB.w*100)+'%', pctY=y=>((y-VB.y)/VB.w*100)+'%';

const DAY=[
 {e:'🌑',t:'Все спят, темнота густая'},
 {e:'🐦',t:'Первые птицы'},
 {e:'🌫️',t:'Небо серое, солнца ещё нет'},
 {e:'🌅',t:'Солнце вышло из-за края'},
 {e:'🚌',t:'Все едут на работу'},
 {e:'🍽️',t:'Накрывают на стол'},
 {e:'🌞',t:'Самая короткая тень'},
 {e:'🥵',t:'Самое жаркое время'},
 {e:'🌇',t:'Тени вытянулись'},
 {e:'🌆',t:'Солнце ушло за край'},
 {e:'🚗',t:'Все едут домой'},
 {e:'🛏️',t:'Стелют постель'}
];
/* ни один значок костра не повторяет суточный — иначе экран «поменялась только
   оболочка» опровергает сам себя */
const FIRE=['🪵','✨','💨','🔥','🪔','🍲','♨️','🌡️','🕯️','🔅','🪨','⚱️'];

const PAL_DAY =['#131A30','#1B2545','#2F4472','#4D74B4','#8AA6D4','#D3C493',
                '#F5CF74','#EAB35C','#D8894A','#C06A3C','#7A4634','#3B2A33'];
const PAL_FIRE=['#17120F','#2A1A12','#4D2311','#8C2F10','#C2470F','#E2700F',
                '#FFD15C','#F2A63A','#CF6A2C','#94502E','#6A5A55','#2E2B2A'];
const LAB_DAY =[[0,'ночь'],[3,'утро'],[6,'день'],[9,'вечер']];
/* подписи костра стоят ровно на тех местах, которые названы в тексте фокуса */
const LAB_FIRE=[[0,'дрова'],[3,'занялось'],[6,'ровный жар'],[7,'угли']];

const WHY=[
 'Ниже всего свет — и выше всего свет. Между ними ровно половина круга в любую сторону.',
 '🐦 — начало света, и оно приходит раньше солнца. 🥵 — начало тьмы, и оно приходит позже полудня. Ни одно начало не совпадает с тем, что видно глазами: света ещё нет, тьмы ещё не видно. Потому они и стоят друг напротив друга.',
 'Утром убывает тьма: небо ещё серое, но её всё меньше. Вечером убывает свет: солнце ещё в небе, но его всё меньше — оттого и тени вытянулись. Одно и то же убывание, только убывает разное.',
 'Солнце пересекает край ровно дважды: когда приходит и когда уходит. Одно событие, два конца.',
 'Утром весь город течёт в одну сторону, вечером — ровно в обратную. Тот же поток, развёрнутый.',
 'К обеду накрывают, к ночи стелют. Оба раза готовят то, что вот-вот начнётся.'
];

/* Три вопроса. Первый обучающий (лёгкий, показывает правило хода), второй — сердце
   игры, третий — на убывание. Оси 4 и 5 закрываются сами: их игрок собрал бы не глядя. */
const ORDER=[3,1,2];

/* ═══════════ состояние ═══════════ */
const S={ph:'intro', chord:new Array(6).fill(null), placed:new Array(12).fill(false),
         q:null, step:0, right:0, fire:false, dark:false,
         pr:null};

const A=i=>90+30*i;
const Pa=(r,a)=>[C+r*Math.cos(a*Math.PI/180), C+r*Math.sin(a*Math.PI/180)];
const P=(r,i)=>Pa(r,A(i));
const wide=i=>i%2===0;
const pal=()=>S.fire?PAL_FIRE:PAL_DAY;
const deck=()=>S.fire?FIRE.map((e,i)=>({e,t:''})):DAY;

function wedgePath(i){
  const w=wide(i)?34:22, a0=A(i)-w/2, a1=A(i)+w/2;
  const [x0,y0]=Pa(R,a0),[x1,y1]=Pa(R,a1),[x2,y2]=Pa(Ri,a1),[x3,y3]=Pa(Ri,a0);
  return `M${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${Ri} ${Ri} 0 0 0 ${x3} ${y3}Z`;
}

/* ═══════════ кольцо: узлы создаются ОДИН раз ═══════════
   Всё остальное — только смена атрибутов. Иначе переходы не запускаются, а нитки
   перечёркиваются заново на каждом экране, в том числе под словами «не сдвинулись». */
const NS='http://www.w3.org/2000/svg';
const N={wedge:[], lab:[], chord:[], em:[], tgt:null, orbit:null};

function buildRing(){
  const sv=document.getElementById('ring'), w=document.getElementById('wrap');
  sv.innerHTML=''; w.querySelectorAll('.em').forEach(n=>n.remove());
  N.wedge=[]; N.lab=[]; N.chord=[]; N.em=[];

  for(let i=0;i<12;i++){
    const p=document.createElementNS(NS,'path');
    p.setAttribute('class','wedge'); p.setAttribute('d',wedgePath(i));
    p.setAttribute('fill',PAL_DAY[i]); p.style.opacity=.42;
    sv.appendChild(p); N.wedge.push(p);
  }
  /* орбита — только на входном экране */
  const g=document.createElementNS(NS,'g');
  g.innerHTML=`<animateTransform attributeName="transform" type="rotate"
      from="0 ${C} ${C}" to="360 ${C} ${C}" dur="26s" repeatCount="indefinite"/>
    <circle cx="${C}" cy="${C-52}" r="5.5" fill="#F5CF74"/>
    <circle cx="${C}" cy="${C+52}" r="4" fill="#5b6478"/>
    <line x1="${C}" y1="${C-52}" x2="${C}" y2="${C+52}" stroke="#444c5e" stroke-width="1"/>`;
  sv.appendChild(g); N.orbit=g;

  const t=document.createElementNS(NS,'path');
  t.setAttribute('class','tgt'); t.style.display='none'; sv.appendChild(t); N.tgt=t;

  for(let k=0;k<6;k++){
    const [x1,y1]=P(Ri-5,k), [x2,y2]=P(Ri-5,k+6);
    const l=document.createElementNS(NS,'line');
    l.setAttribute('class','chord');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1);
    l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke','var(--gold)'); l.style.opacity=0;
    sv.appendChild(l); N.chord.push(l);
  }
  for(let k=0;k<4;k++){
    const t2=document.createElementNS(NS,'text');
    t2.setAttribute('class','lab'); t2.setAttribute('text-anchor','middle');
    t2.setAttribute('fill','var(--tx3)'); sv.appendChild(t2); N.lab.push(t2);
  }
  for(let i=0;i<12;i++){
    const [x,y]=P(Rem,i);
    const d=document.createElement('div');
    d.className='em'; d.style.left=pctX(x); d.style.top=pctY(y); d.style.opacity=0;
    w.appendChild(d); N.em.push(d);
  }
  paintLabels();
}

function paintLabels(){
  const L=S.fire?LAB_FIRE:LAB_DAY;
  N.lab.forEach((n,k)=>{
    const [i,txt]=L[k], [x,y]=P(R+15,i);
    n.setAttribute('x',x); n.setAttribute('y',y+4); n.textContent=txt;
  });
}

function light(i){
  N.wedge[i].style.opacity=1;
  const d=deck()[i];
  N.em[i].textContent=d.e; N.em[i].style.opacity=1;
  N.em[i].classList.remove('pop'); void N.em[i].offsetWidth; N.em[i].classList.add('pop');
}
function tie(k,ok){
  const l=N.chord[k];
  l.setAttribute('stroke', ok?'var(--gold)':'var(--grey)');
  l.style.opacity = ok?1:.6;
  l.classList.add('drawn');
}
function aim(i){
  if(i===null){ N.tgt.style.display='none'; return }
  N.tgt.setAttribute('d',wedgePath(i)); N.tgt.style.display='';
}
function hideOrbit(){ if(N.orbit) N.orbit.style.display='none' }

/* ═══════════ экраны ═══════════ */
const pan=()=>document.getElementById('panel');
const el=h=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const put=(...n)=>{ const p=pan(); p.innerHTML=''; n.forEach(x=>p.appendChild(el(x))) };

function intro(){
  S.ph='intro';
  put(`<div class="lead">Круг суток. Внизу глухая ночь, слева светает, наверху разгар,
       справа всё уходит.
       <span class="claim">Круг — не про сутки. Сутки — то, на чём его удобно показать.</span></div>`,
      `<button class="go" onclick="demo()">Показать →</button>`);
}

function demo(){
  S.ph='demo'; hideOrbit();
  S.placed[0]=S.placed[6]=true; light(0); light(6);
  setTimeout(()=>{ S.chord[0]='gold'; tie(0,true) }, 260);
  put(`<div class="say"><div class="hd">Вот как это работает</div><div class="bd">
      🌑 когда все спят — и 🌞 когда тень самая короткая. Они связаны ниткой через
      середину: это два конца одного и того же.<br><br>
      Дольки чередуются: <b>долгие времена широкие, переломы узкие</b>. Напротив широкой
      всегда широкая.</div></div>`,
      `<button class="go" onclick="ask()">Дальше →</button>`);
}

function ask(){
  const free=[...Array(12).keys()].filter(i=>!S.placed[i]);
  if(S.step>=ORDER.length){ return rest(free) }

  const show=ORDER[S.step], want=show+6;
  /* отвлекающие: сперва соседи по кругу той же ширины (закон работает), плюс один
     другой ширины — чтобы закон было чем проверить */
  const d=i=>Math.min(Math.abs(i-want),12-Math.abs(i-want));
  const cand=free.filter(i=>i!==show&&i!==want).sort((a,b)=>d(a)-d(b));
  const same=cand.filter(i=>wide(i)===wide(want)).slice(0,2);
  const other=cand.filter(i=>wide(i)!==wide(want)).slice(0,1);
  const opts=[want,...same,...other].slice(0,4)
    .map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);

  S.q={show,want,opts}; S.ph='ask';
  S.placed[show]=true; light(show); aim(want);

  put(`<div class="ask"><div class="big">${DAY[show].e} ${DAY[show].t}</div>
       <div class="small">а что напротив?</div></div>`);
  const g=el('<div class="opts"></div>');
  opts.forEach(i=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<span class="sil ${wide(i)?'w':'n'}"></span><span>${DAY[i].e} ${DAY[i].t}</span>`;
    b.onclick=()=>answer(i,b); g.appendChild(b);
  });
  pan().appendChild(g);
}

function answer(i,btn){
  if(S.ph!=='ask') return;
  const {show,want}=S.q, ok=i===want;
  S.ph='wait'; btn.classList.add(ok?'pick':'bad');
  setTimeout(()=>{
    aim(null); S.placed[want]=true; light(want);
    S.chord[show%6]= ok?'gold':'grey'; tie(show%6, ok);
    if(ok) S.right++;
    S.q={show,want};
    if(ok){ S.ph='say'; sayWhy(true) }
    else {
      S.ph='miss';
      put(`<div class="say"><div class="hd">Не это.</div><div class="bd">
           Напротив стоит ${DAY[want].e} <b>${DAY[want].t.toLowerCase()}</b>.</div></div>`,
          `<button class="go" onclick="sayWhy(false)">С чего вдруг? →</button>`);
    }
  }, ok?280:430);
}

function sayWhy(ok){
  S.ph='say'; S.step++;
  put(`<div class="say"><div class="hd">${ok?'Да':'С того, что…'}</div>
       <div class="bd">${WHY[S.q.show%6]}</div></div>`,
      `<button class="go" onclick="ask()">Дальше →</button>`);
}

function rest(free){
  S.ph='rest';
  free.forEach(i=>{ S.placed[i]=true; light(i) });
  const ax=[...new Set(free.map(i=>i%6))];
  ax.forEach(k=>{ S.chord[k]='gold'; tie(k,true) });
  const pairTxt=ax.map(k=>`${DAY[k].e} ${DAY[k].t.toLowerCase()} — с ${DAY[k+6].e} ${DAY[k+6].t.toLowerCase()}`).join('. ');
  put(`<div class="say"><div class="hd">Остались четверо, и они разбираются сами</div>
       <div class="bd">${pairTxt}. Эти две пары ты собрал бы не глядя, поэтому про них
       и не спрашивали.</div></div>`,
      `<button class="go" onclick="star()">Смотреть, что вышло →</button>`);
}

/* ── звезда: заливка уходит, остаются шесть одинаковых ниток ── */
function star(){
  S.ph='star'; S.dark=true;
  N.wedge.forEach(p=>{ p.style.opacity=.10 });
  N.em.forEach(n=>{ n.style.opacity=.25 });
  N.lab.forEach(n=>{ n.style.opacity=.25 });
  N.chord.forEach(l=>{ l.setAttribute('stroke','var(--gold)'); l.style.opacity=1 });
  const took = S.right>0;
  put(`<div class="say"><div class="hd">Шесть ниток</div><div class="bd">
      Двенадцать концов, и ни одного лишнего. Каждая нитка соединяет два конца одного
      и того же.<br><br>${took
        ? 'Птицы с жарой — единственное место, где круг спорит с привычкой, и ты его взял. Проверь на себе: печёт в три часа, а не в двенадцать.'
        : 'Две легли сразу — их протянул бы любой. А птицы с жарой не легли. Круг нужен ровно ради них.'}
      </div></div>`,
      `<button class="go" onclick="focus_()">Не трогай круг →</button>`);
}

/* ── фокус: узлы те же, меняются только заливка, значки и подписи ── */
function focus_(){
  S.ph='focus'; S.fire=true;
  N.em.forEach(n=>{ n.style.opacity=0 });
  put(`<div class="lead">…</div>`);

  setTimeout(()=>{
    N.wedge.forEach((p,i)=>{
      p.style.transitionDelay=(i*0.055)+'s';
      p.setAttribute('fill',PAL_FIRE[i]); p.style.opacity=.95;
    });
    paintLabels(); N.lab.forEach(n=>{ n.style.opacity=1 });
  }, 220);

  setTimeout(()=>{
    N.em.forEach((n,i)=>{ n.textContent=FIRE[i]; n.style.opacity=1 });
    N.wedge.forEach(p=>p.style.transitionDelay='0s');
    put(`<div class="say"><div class="hd">Тот же круг. Это костёр.</div><div class="bd">
        Дрова лежат там же, где глухая ночь. Ровный жар — там же, где полдень. Угли,
        которые жгут сильнее пламени, — там же, где самое жаркое время дня.<br><br>
        <b>Нитки не сдвинулись ни на волос</b>: поменялась только оболочка.
        Мы обещали, что круг не про сутки.</div></div>`,
        `<button class="go" onclick="name_()">А что это вообще было? →</button>`);
  }, 1080);
}

function name_(){
  S.ph='name';
  put(`<div class="say"><div class="hd">Ясна. Круг.</div><div class="bd">
      Одним кругом описывают любое явление: сутки, костёр, год, разговор, работу.
      Мы посмотрели два — и одно место в них, то, которое приходит на шаг позже
      вершины.</div></div>`,
      `<button class="go" onclick="pairStart()">Вдвоём с одного телефона → 2 минуты</button>`,
      `<button class="go gh" onclick="restart()">Дать другому →</button>`);
}

function restart(){
  S.chord=new Array(6).fill(null); S.placed=new Array(12).fill(false);
  S.q=null; S.step=0; S.right=0; S.fire=false; S.dark=false;
  document.body.classList.remove('pair');
  buildRing(); intro();
}

/* ═══════════ вдвоём с одного телефона ═══════════
   Единственное, что метод даёт двоим, — содержательное расхождение. Оно живёт ровно
   до секунды, когда один увидел ответ другого, поэтому оба выбирают одновременно
   и втайне, а вскрытие только после второго тапа. */
function pairStart(){
  document.body.classList.add('pair');
  S.pr={i:0, a:null, b:null, log:[]};
  pairAsk();
}
function pairAsk(){
  const P2=S.pr, show=ORDER[P2.i], want=show+6;
  const d=i=>Math.min(Math.abs(i-want),12-Math.abs(i-want));
  const cand=[...Array(12).keys()].filter(i=>i!==show&&i!==want).sort((a,b)=>d(a)-d(b));
  const same=cand.filter(i=>wide(i)===wide(want)).slice(0,2);
  const other=cand.filter(i=>wide(i)!==wide(want)).slice(0,1);
  P2.opts=[want,...same,...other].slice(0,4).map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);
  P2.show=show; P2.want=want; P2.a=null; P2.b=null;
  pairRender();
}
function pairHalf(side){
  const P2=S.pr, mine=P2[side];
  if(mine!==null) return `<div class="half ${side==='a'?'top':''} done">
    <div class="waiting">Есть.<br>Ждём второго.</div></div>`;
  return `<div class="half ${side==='a'?'top':''}">
    <div class="q">${DAY[P2.show].e} ${DAY[P2.show].t}<small>а что напротив?</small></div>
    <div class="grid">${P2.opts.map(i=>
      `<button class="opt" onclick="pairPick('${side}',${i})">
        <span class="sil ${wide(i)?'w':'n'}"></span><span>${DAY[i].e} ${DAY[i].t}</span></button>`).join('')}</div></div>`;
}
function pairRender(){
  document.getElementById('pair').innerHTML =
    pairHalf('a') + '<div class="bar"></div>' + pairHalf('b');
}
function pairPick(side,i){
  const P2=S.pr;
  if(P2[side]!==null) return;
  P2[side]=i;
  if(P2.a===null||P2.b===null){ return pairRender() }
  pairReveal();
}
function pairReveal(){
  const P2=S.pr, {a,b,want,show}=P2;
  const same=a===b, bothOk=a===want&&b===want;
  P2.log.push({show, a, b, same, bothOk});
  const line = bothOk ? 'Оба взяли верно.'
    : same ? `Вы оба сказали ${DAY[a].e} <b>${DAY[a].t.toLowerCase()}</b> — и оба мимо.`
    : `Вы выбрали разное: ${DAY[a].e} <b>${DAY[a].t.toLowerCase()}</b> и ${DAY[b].e} <b>${DAY[b].t.toLowerCase()}</b>.`;
  const truth = bothOk ? '' :
    `<br><br>Напротив стоит ${DAY[want].e} <b>${DAY[want].t.toLowerCase()}</b>.`;
  document.getElementById('pair').innerHTML =
    `<div class="half" style="justify-content:flex-start;padding-top:22px;overflow:auto">
      <div class="say"><div class="hd">${same?(bothOk?'Сошлось':'Сошлось, но мимо'):'Вы разошлись'}</div>
      <div class="bd">${line}${truth}<br><br>${WHY[show%6]}</div></div>
      <button class="go" onclick="pairNext()">${P2.i<ORDER.length-1?'Дальше →':'Итог →'}</button>
     </div>`;
}
function pairNext(){
  const P2=S.pr;
  if(P2.i<ORDER.length-1){ P2.i++; return pairAsk() }
  const split=P2.log.filter(x=>!x.same);
  const txt = split.length===0
    ? 'Вы ни разу не разошлись. Значит круг у вас уже один — попробуйте на явлении, которого ни один из вас не разбирал.'
    : 'Вы разошлись на ' + split.map(x=>DAY[x.show].t.toLowerCase()).join(' и на ') +
      '. Вот об это и стоит поговорить: не о том, кто прав, а о том, почему каждый решил именно так.';
  document.getElementById('pair').innerHTML =
    `<div class="half" style="justify-content:center">
      <div class="say"><div class="hd">Что между вами</div><div class="bd">${txt}</div></div>
      <button class="go" onclick="pairStart()">Ещё раз вдвоём →</button>
      <button class="go gh" onclick="restart()">В начало →</button>
     </div>`;
}

buildRing(); intro();
</script>
