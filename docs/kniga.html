<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<!-- Значок вкладки: без него браузер сам просит /favicon.ico и получает
     404 в консоль при каждом открытии книги. -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<title>Ясна Суток — учебник</title>
<meta name="description" content="Первая книга о том, как всё устроено. Учебник «Ясна Суток» целиком, со всеми схемами."/>
<script>try{var m=localStorage.getItem('yasna_theme')||'auto';var d=m==='dark'||(m==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);var e=document.documentElement;e.setAttribute('data-theme',d?'dark':'light');e.style.colorScheme=d?'dark':'light';}catch(e){}</script>
<script src="core/theme.js"></script>
<script>
/* Какая книга открыта. Первая (Сутки) живёт в корне kniga/ — так уже
   читают; новые книги — в подпапках kniga/<ид>/. */
(function(){
  var к=null;
  try{ к=new URLSearchParams(location.search).get('kniga'); }catch(e){}
  window.__кнИд=(к==='goda'||к==='zhizni')?к:'sutki';
  window.__кнПуть=(window.__кнИд==='sutki')?'kniga/':'kniga/'+window.__кнИд+'/';
  document.documentElement.classList.add('kniga-'+window.__кнИд);
  document.write('<script src="'+window.__кнПуть+'opis.js?v=2"><\/script>');
})();
</script>
<style>
/* ══ Книга — свой мир внутри приложения ═════════════════════════════
   Интерфейс приложения синий и рубленый; учебник должен читаться как
   учебник: тёплая бумага, серифный шрифт, спокойная кирпичная киноварь
   вместо интерфейсного синего. Шрифты — только системные: приложение
   обязано открываться без сети. */
:root{
  --kn-bum:#F6F2EA; --kn-list:#FFFDF8; --kn-ink:#1F1B16; --kn-ink-2:#5A5148;
  --kn-ink-3:#8A7F72; --kn-kayma:#E2D9CA; --kn-akc:#A8452B; --kn-akc-fon:#F2E4DE;
  --kn-serif:Georgia,'Times New Roman',serif;
  --kn-sans:-apple-system,'Segoe UI',Roboto,sans-serif;
  --kn-kegl:1;
}
/* Каждая книга красит чтение своим акцентом: Сутки — киноварь по тёплой
   бумаге, Года — небесная синь. Класс kniga-<ид> ставится на html. */
html.kniga-goda{
  --kn-akc:#2264A8; --kn-akc-fon:#E4EEF9;
}
html.kniga-zhizni{
  --kn-akc:#1E7A5A; --kn-akc-fon:#E2F2EB;
}
:root[data-theme="dark"]{
  --kn-bum:#14171C; --kn-list:#1A1E25; --kn-ink:#E9E6E0; --kn-ink-2:#B0A99F;
  --kn-ink-3:#8A8279; --kn-kayma:#2C323B; --kn-akc:#E0895F; --kn-akc-fon:#2A2019;
}
html.kniga-goda[data-theme="dark"]{ --kn-akc:#7FB4E8; --kn-akc-fon:#1B2B3D; }
html.kniga-zhizni[data-theme="dark"]{ --kn-akc:#6FCBA8; --kn-akc-fon:#16302A; }
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--kn-bum);color:var(--kn-ink);font-family:var(--kn-serif);
  -webkit-text-size-adjust:100%;overflow-wrap:break-word}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ── Оглавление ── */
.ogl{max-width:660px;margin:0 auto;padding:18px 18px calc(28px + var(--yk-snizu,0px))}
.obl{padding:26px 22px 22px;border-radius:18px;background:var(--kn-list);
  border:1px solid var(--kn-kayma);text-align:center;position:relative;overflow:hidden}
.obl-nad{font:600 11.5px/1 var(--kn-sans);letter-spacing:.18em;text-transform:uppercase;
  color:var(--kn-akc)}
.obl h1{font:400 33px/1.15 var(--kn-serif);margin:10px 0 6px;letter-spacing:-.01em}
.obl-pod{font:italic 400 15px/1.5 var(--kn-serif);color:var(--kn-ink-2)}
.obl-znak{margin:16px auto 4px;display:block;width:58px;height:58px;opacity:.9}
.obl-znak circle{fill:none;stroke:var(--kn-akc);stroke-width:1.4}
.obl-znak line{stroke:var(--kn-akc);stroke-width:1.1;opacity:.55}
.obl-hod{display:flex;align-items:center;gap:10px;margin-top:18px}
.obl-zhelob{flex:1;height:5px;border-radius:3px;background:var(--kn-kayma);overflow:hidden}
.obl-fill{display:block;height:100%;width:0;border-radius:3px;background:var(--kn-akc);
  transition:width .7s cubic-bezier(.2,.9,.3,1)}
.obl-pct{font:600 12.5px/1 var(--kn-sans);color:var(--kn-ink-2);font-variant-numeric:tabular-nums}

.dalshe{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:14px 16px;
  border-radius:14px;background:var(--kn-akc);color:#fff;text-align:left}
.dalshe b{display:block;font:600 15.5px/1.25 var(--kn-sans)}
.dalshe em{display:block;font:400 12.5px/1.35 var(--kn-sans);font-style:normal;opacity:.86;margin-top:2px}
.dalshe span{margin-left:auto;font-size:19px;line-height:1}

.zag-gr{margin:26px 0 8px;font:600 11.5px/1 var(--kn-sans);letter-spacing:.14em;
  text-transform:uppercase;color:var(--kn-ink-3)}
.gl{display:flex;align-items:baseline;gap:12px;width:100%;padding:14px 4px;text-align:left;
  border-bottom:1px solid var(--kn-kayma)}
.gl:last-child{border-bottom:0}
.gl-n{flex:0 0 26px;font:600 13px/1.3 var(--kn-sans);color:var(--kn-ink-3);
  font-variant-numeric:tabular-nums}
.gl-t{flex:1;min-width:0}
.gl-imya{font:400 17px/1.3 var(--kn-serif);display:block}
.gl-meta{display:block;margin-top:3px;font:400 12.5px/1.4 var(--kn-sans);color:var(--kn-ink-3)}
.gl-gal{flex:0 0 auto;font-size:13px;color:var(--kn-akc)}
.gl--net{opacity:.45}
.gl--net .gl-gal{color:var(--kn-ink-3)}

/* ── Лист главы ── */
.list{display:none;max-width:660px;margin:0 auto;padding:0 18px calc(96px + var(--yk-snizu,0px))}
body.chtenie .list{display:block}
body.chtenie .ogl{display:none}
.polosa{position:fixed;left:0;top:0;height:3px;width:0;background:var(--kn-akc);z-index:30}
/* Шапка страницы — одна на оглавление и главу: возврат всегда на месте,
   а не плавающей кнопкой, которую надо искать глазами. */
.kn-shapka{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;
  padding:8px 12px;background:var(--kn-bum);border-bottom:1px solid var(--kn-kayma)}
html.yk-est .kn-shapka{padding-top:calc(8px + var(--yk-sverhu,0px))}
.kn-shapka-t{flex:1;min-width:0;font:600 14px/1.3 var(--kn-sans);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;text-align:center;color:var(--kn-ink)}
.gl-kegl{flex:0 0 auto;min-width:44px;min-height:44px;display:flex;align-items:center;
  justify-content:center;font:600 13px/1 var(--kn-sans);color:var(--kn-ink-2);
  border:1px solid var(--kn-kayma);border-radius:11px;padding:0 10px}

.telo{font-size:calc(17.5px * var(--kn-kegl));line-height:1.62;padding-top:22px}
.telo .zag{font:400 calc(25px * var(--kn-kegl))/1.25 var(--kn-serif);margin:30px 0 14px;
  text-align:center}
.telo .zag:first-child{margin-top:6px}
.telo p{margin:0 0 13px;text-indent:1.4em;text-align:justify;hyphens:auto}
.telo p.bez{text-indent:0}
.telo .nom{float:left;margin-left:-2.6em;width:2.2em;text-align:right;
  font:600 calc(11px * var(--kn-kegl))/1.9 var(--kn-sans);color:var(--kn-ink-3);
  font-variant-numeric:tabular-nums}
@media (max-width:520px){ .telo .nom{float:none;margin:0 .5em 0 0;line-height:inherit} }
.telo .vydel{margin:16px 0;padding:13px 16px;border-left:3px solid var(--kn-akc);
  background:var(--kn-akc-fon);border-radius:0 10px 10px 0;font-weight:600;text-indent:0}
/* Пункты книги пронумерованы внутри самих строк («1. Длительность…»),
   поэтому маркеры списка сняты — иначе выходило «• 1.». Отступ висячий:
   номер стоит на поле, продолжение строки выравнивается по тексту. */
.telo ul.spis{margin:8px 0 15px;padding-left:1.6em;list-style:none}
.telo ul.spis li{margin-bottom:8px;text-indent:-1.6em}
.telo .snoska{margin:14px 0;font-size:calc(14px * var(--kn-kegl));color:var(--kn-ink-2);
  text-indent:0;font-style:italic}
.telo table{width:100%;margin:16px 0;border-collapse:collapse;font-size:calc(15px * var(--kn-kegl))}
.telo td{border:1px solid var(--kn-kayma);padding:8px 10px;vertical-align:top}

.shema{margin:22px 0;padding:16px 12px 12px;background:var(--kn-list);
  border:1px solid var(--kn-kayma);border-radius:14px;text-align:center}
.shema svg{max-width:100%;height:auto;display:block;margin:0 auto}
.shema-pod{margin-top:10px;font:400 calc(13px * var(--kn-kegl))/1.45 var(--kn-sans);
  color:var(--kn-ink-2)}
.shema-net{padding:22px 12px;color:var(--kn-ink-3);font:400 15px/1 var(--kn-sans)}
/* Оформление издания: рамка не нужна, довольно подписи. */
.shema--podpis{background:none;border:0;border-left:2px solid var(--kn-kayma);
  border-radius:0;padding:2px 0 2px 14px;margin:18px 0;text-align:left}
.shema--podpis .shema-pod{margin-top:0;font-style:italic}

.hvost{display:flex;gap:10px;margin-top:30px}
/* Пока главы нет (открываем или не открылась), листать нечем — хвост убираем.
   Своё display:flex перебивает встроенное [hidden], поэтому правило явное. */
.hvost[hidden]{display:none}
.hvost button{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--kn-kayma);
  background:var(--kn-list);font:600 14.5px/1.25 var(--kn-sans);padding:8px 12px}
.hvost button.glav{background:var(--kn-akc);color:#fff;border-color:transparent}
.hvost button[disabled]{opacity:.4}
.grузка{padding:40px 0;text-align:center;color:var(--kn-ink-3);font:400 14px/1.5 var(--kn-sans)}
.grузка .povtor{display:block;margin:16px auto 0;min-height:48px;padding:0 22px;
  border-radius:14px;border:1px solid var(--kn-kayma);background:var(--kn-list);
  color:var(--kn-ink);font:600 14.5px/1 var(--kn-sans)}

/* ── Акценты текста ─────────────────────────────────────────────
   Номер записи и врезки — в цвете книги; первый абзац главы открывает
   буквица. Акцент разный у книг (киноварь/небо) — см. html.kniga-*. */
.telo .nom{color:var(--kn-akc);opacity:.75}
.telo .zag{color:var(--kn-akc)}
.telo p.bukvica::first-letter{font-size:3.05em;line-height:.82;float:left;
  padding:2px 8px 0 0;color:var(--kn-akc);font-family:var(--kn-serif)}
.kegl-vspl{position:fixed;left:50%;bottom:calc(96px + var(--yk-snizu,0px));
  transform:translateX(-50%);padding:9px 16px;border-radius:12px;z-index:40;
  background:var(--kn-ink);color:var(--kn-bum);font:600 13px/1 var(--kn-sans);
  opacity:0;pointer-events:none}
.kegl-vspl.vidno{animation:kegl-pokaz 1.4s ease forwards}
@keyframes kegl-pokaz{0%{opacity:0;transform:translateX(-50%) translateY(6px)}
  12%,70%{opacity:1;transform:translateX(-50%)}100%{opacity:0}}

/* ── Дыхание чтения ─────────────────────────────────────────────
   Части главы поднимаются по мере прокрутки, схемы проявляются после
   загрузки. Всё гаснет при prefers-reduced-motion. */
@media (prefers-reduced-motion: no-preference){
  .telo>*{opacity:0;transform:translateY(10px);
    transition:opacity .5s ease,transform .5s cubic-bezier(.2,.9,.3,1)}
  .telo>.vidno{opacity:1;transform:none}
  /* Служебные блоки («Открываю…», сообщение о сбое) в это дыхание не входят:
     наблюдатель, который зажигает абзацы, ставится только после удачной
     загрузки — и глава молча выглядела пустой. */
  .telo>.grузка{opacity:1;transform:none}
  .shema svg{opacity:0;transform:scale(.985);
    transition:opacity .6s ease,transform .6s cubic-bezier(.2,.9,.3,1)}
  .shema.pokazana svg{opacity:1;transform:none}
  .obl-znak{animation:kn-vrash-znak 60s linear infinite}
  @keyframes kn-vrash-znak{to{transform:rotate(360deg)}}
}
@media (prefers-reduced-motion: reduce){
  .telo>*{opacity:1;transform:none}
  .shema svg{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="polosa" id="polosa" aria-hidden="true"></div>

<header class="kn-shapka" id="kn-shapka">
  <!-- Кнопку возврата рисует оболочка приложения в своей шапке, эту она
       прячет целиком. Прежняя подпись обещала «Уроки», а в главе кнопка
       вела в оглавление — обещание не совпадало с делом. Заголовок оболочка
       читает отсюда (data-yk-imya-iz="#shapka-t"), поэтому узел остаётся. -->
  <div class="kn-shapka-t" id="shapka-t">Библиотека Ясна</div>
  <button class="gl-kegl" id="kegl" type="button" aria-label="Размер текста">Аа</button>
</header>

<main class="ogl" id="ogl">
  <div class="obl">
    <div class="obl-nad">Учебник</div>
    <h1 id="obl-imya">Ясна Суток</h1>
    <div class="obl-pod" id="obl-pod">Первая книга о том, как всё устроено</div>
    <svg class="obl-znak" viewBox="0 0 60 60" aria-hidden="true">
      <circle cx="30" cy="30" r="26"/><circle cx="30" cy="30" r="17"/>
      <line x1="30" y1="4" x2="30" y2="56"/><line x1="4" y1="30" x2="56" y2="30"/>
      <line x1="11.6" y1="11.6" x2="48.4" y2="48.4"/><line x1="48.4" y1="11.6" x2="11.6" y2="48.4"/>
    </svg>
    <div class="obl-hod">
      <span class="obl-zhelob"><i class="obl-fill" id="obl-fill"></i></span>
      <span class="obl-pct" id="obl-pct">0%</span>
    </div>
    <button class="dalshe" id="dalshe" type="button">
      <span class="dalshe-t"><b id="dalshe-t">Начать чтение</b><em id="dalshe-o">с первой страницы</em></span>
      <span aria-hidden="true">›</span>
    </button>
  </div>

  <div class="zag-gr">Оглавление</div>
  <div id="spisok"></div>
</main>

<article class="list" id="list">
  <div class="telo" id="telo"></div>
  <div class="hvost">
    <button id="pred" type="button">‹ Назад</button>
    <button id="sled" class="glav" type="button">Дальше ›</button>
  </div>
</article>

<script src="navigatsiya.js"></script>
<script>
(function(){
  var О = window.YasnaKnigaOpis || {главы:[]};
  /* У каждой книги свои путь и память чтения. */
  var ПУТЬ = window.__кнПуть || 'kniga/';
  var КЛЮЧ = (window.__кнИд==='sutki') ? 'yasna_kniga_v1' : 'yasna_kniga_'+window.__кнИд+'_v1';
  function читать(){ try{ return JSON.parse(localStorage.getItem(КЛЮЧ)) || {}; }catch(e){ return {}; } }
  function писать(с){ try{ localStorage.setItem(КЛЮЧ, JSON.stringify(с)); }catch(e){} }
  var сост = читать();
  if(!сост.прочитано) сост.прочитано = {};
  if(!сост.кегль) сост.кегль = 1;
  document.documentElement.style.setProperty('--kn-kegl', сост.кегль);

  var эОгл=document.getElementById('ogl'), эЛист=document.getElementById('list'),
      эТело=document.getElementById('telo'), эСписок=document.getElementById('spisok'),
      эХвост=document.querySelector('.hvost');

  /* Главы лежат отдельными файлами и подключаются по требованию: узел 8 — это
     четверть книги, держать её в памяти ради оглавления незачем. */
  var загружены = {};
  function главаДанные(н){
    var л = (window.YasnaKniga && window.YasnaKniga.главы) || [];
    for(var i=0;i<л.length;i++) if(л[i].номер===н) return л[i];
    return null;
  }
  function загрузить(н, дальше){
    if(главаДанные(н)) return дальше(главаДанные(н));
    var оп = опись(н);
    if(!оп) return дальше(null);
    if(загружены[н]) return setTimeout(function(){ дальше(главаДанные(н)); }, 60);
    загружены[н]=true;
    var с=document.createElement('script');
    с.src=ПУТЬ+оп.файл+'.js?v=2';
    с.onload=function(){ дальше(главаДанные(н)); };
    с.onerror=function(){ загружены[н]=false; дальше(null); };
    document.head.appendChild(с);
  }
  function опись(н){
    for(var i=0;i<О.главы.length;i++) if(О.главы[i].номер===н) return О.главы[i];
    return null;
  }

  /* ── Оглавление ── */
  function числоЗаписей(оп){ return оп.записи ? (оп.записи[1]-оп.записи[0]+1) : 0; }
  function естьГлава(оп){
    /* Ненаписанные главы честно помечаем: обещать оглавлением то, чего нет,
       хуже, чем показать «пишется». */
    return оп.есть !== false;
  }
  function рисоватьОглавление(){
    var html='';
    О.главы.forEach(function(оп){
      var пр = !!сост.прочитано[оп.номер];
      var мета = оп.страницы && оп.страницы[0]
        ? 'стр. ' + оп.страницы[0] + (оп.страницы[1]!==оп.страницы[0] ? '–'+оп.страницы[1] : '')
        : '';
      if(оп.записи) мета += (мета?' · ':'') + 'записи ' + оп.записи[0] + '–' + оп.записи[1];
      if(!мета && оп.есть===false) мета = 'набирается со скана';
      html += '<button class="gl'+(оп.есть===false?' gl--net':'')+'" data-gl="'+оп.номер+'" type="button">'
        + '<span class="gl-n">'+(оп.номер||'—')+'</span>'
        + '<span class="gl-t"><span class="gl-imya">'+оп.имя+'</span>'
        + '<span class="gl-meta">'+мета+(оп.есть===false?' · пишется':'')+'</span></span>'
        + '<span class="gl-gal">'+(оп.есть===false?'·':(пр?'✓':'›'))+'</span></button>';
    });
    эСписок.innerHTML=html;

    /* Процент — по книжным страницам прочитанных глав: главы разного
       веса, и «3 из 13» врало бы о реальном месте в книге. */
    function вес(оп){ return (оп.страницы&&оп.страницы[1])?(оп.страницы[1]-оп.страницы[0]+1):1; }
    var всего=0, сдел=0;
    О.главы.forEach(function(оп){
      if(!естьГлава(оп)) return;
      всего+=вес(оп);
      if(сост.прочитано[оп.номер]) сдел+=вес(оп);
    });
    var pct = всего ? Math.round(сдел/всего*100) : 0;
    document.getElementById('obl-pct').textContent = pct+'%';
    setTimeout(function(){ document.getElementById('obl-fill').style.width = pct+'%'; }, 60);

    var дальшеН = сост.глава!=null ? сост.глава : null;
    if(дальшеН==null){
      for(var i=0;i<О.главы.length;i++){
        if(естьГлава(О.главы[i]) && !сост.прочитано[О.главы[i].номер]){ дальшеН=О.главы[i].номер; break; }
      }
    }
    if(дальшеН==null) дальшеН = О.главы[0].номер;
    var оп=опись(дальшеН);
    document.getElementById('dalshe-t').textContent = сост.глава!=null ? 'Продолжить' : 'Начать чтение';
    document.getElementById('dalshe-o').textContent = оп ? оп.имя : '';
    document.getElementById('dalshe').onclick=function(){ открыть(дальшеН); };
  }

  /* ── Отрисовка главы ── */
  function экр(т){ return String(т==null?'':т).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function частьВHTML(ч){
    if(ч.т==='заголовок') return '<h2 class="zag">'+экр(ч.текст)+'</h2>';
    if(ч.т==='абзац'){
      var ном = ч.н ? '<span class="nom">'+ч.н+'</span>' : '';
      return '<p'+(ч.н?'':' class="bez"')+'>'+ном+экр(ч.текст)+'</p>';
    }
    if(ч.т==='выделение') return '<p class="vydel">'+экр(ч.текст)+'</p>';
    if(ч.т==='список'){
      var нумер = (ч.пункты||[]).every(function(п){ return /^\s*\d+[.)]/.test(п); });
      var тег = нумер ? 'ul' : 'ul';   /* номера уже внутри строк книги */
      return '<'+тег+' class="spis">'+(ч.пункты||[]).map(function(п){
        return '<li>'+экр(п)+'</li>'; }).join('')+'</'+тег+'>';
    }
    if(ч.т==='таблица'){
      return '<table><tbody>'+(ч.строки||[]).map(function(р){
        return '<tr>'+r(р)+'</tr>'; }).join('')+'</tbody></table>';
      function r(р){ return (р||[]).map(function(к){ return '<td>'+экр(к)+'</td>'; }).join(''); }
    }
    if(ч.т==='сноска') return '<p class="snoska">'+экр(ч.текст)+'</p>';
    if(ч.т==='схема'){
      return '<figure class="shema" data-shema="'+экр(ч.id)+'">'
        + '<div class="shema-mesto shema-net">…</div>'
        + (ч.подпись ? '<figcaption class="shema-pod">'+экр(ч.подпись)+'</figcaption>' : '')
        + '</figure>';
    }
    return '';
  }

  /* Схемы — отдельные SVG-файлы: тянем после отрисовки текста, чтобы чтение
     начиналось сразу, а не ждало картинок. */
  function подтянутьСхемы(){
    var места=эТело.querySelectorAll('[data-shema]');
    [].forEach.call(места, function(ф){
      var id=ф.getAttribute('data-shema');
      fetch(ПУТЬ+'shemy/'+id+'.svg').then(function(о){
        if(!о.ok) throw 0; return о.text();
      }).then(function(svg){
        if(svg.indexOf('<svg')<0) throw 0;
        var м=ф.querySelector('.shema-mesto');
        if(м){ м.classList.remove('shema-net'); м.innerHTML=svg;
          requestAnimationFrame(function(){ ф.classList.add('pokazana'); }); }
      }).catch(function(){
        /* Рисунка нет — это оформление издания (обложка, марка, QR-код):
           перерисовать его «один в один» нельзя, подделка была бы хуже
           отсутствия. Оставляем честную подпись вместо пустой рамки. */
        var м=ф.querySelector('.shema-mesto');
        if(м) м.remove();
        ф.classList.add('shema--podpis');
      });
    });
  }

  /* Глава не доехала. Раньше здесь стояло «Эта глава ещё набирается со скана»
     — неправда: книга набрана целиком, а файл просто не загрузился. Говорим
     как есть и даём повторить; листать нечего, поэтому хвост скрыт. */
  function сбой(н){
    эТело.innerHTML='<div class="grузка">Не удалось открыть главу.'
      + '<button class="povtor" id="povtor" type="button">Повторить</button></div>';
    эХвост.hidden=true;
    var к=document.getElementById('povtor');
    if(к) к.onclick=function(){ открыть(н); };
  }

  /* ── Глава в адресе ──────────────────────────────────────────────
     Android выгружает WebView из фона, и человек возвращался на обложку
     вместо страницы, которую читал: открытая глава нигде не была записана.
     Теперь она держится в адресе, как урок держится в ?lesson=.
     Первый заход в главу кладёт запись в историю — по ней «назад» вернёт в
     оглавление; переход к соседней главе запись ЗАМЕНЯЕТ, иначе выход из
     книги стоил бы столько нажатий, сколько глав перелистали. */
  var главаВИстории=false;      /* запись положили мы — есть куда возвращаться */
  function адресГлавы(н){
    var q; try{ q=new URLSearchParams(location.search); }catch(e){ return null; }
    q.set('glava', String(н));
    return location.pathname+'?'+q.toString();
  }
  function запомнитьГлаву(н){
    var а=адресГлавы(н);
    if(!а || !history.replaceState) return;
    try{
      if(document.body.classList.contains('chtenie')) history.replaceState({глава:н},'',а);
      else { history.pushState({глава:н},'',а); главаВИстории=true; }
    }catch(e){}
  }
  function снятьГлавуИзАдреса(){
    if(!history.replaceState) return;
    var q; try{ q=new URLSearchParams(location.search); }catch(e){ return; }
    if(!q.has('glava')) return;
    q.delete('glava');
    var х=q.toString();
    try{ history.replaceState({},'',location.pathname+(х?'?'+х:'')); }catch(e){}
  }

  /* изИстории — глава открыта возвратом по истории или прямой ссылкой:
     адрес уже верен, трогать историю нельзя. */
  function открыть(н, изИстории){
    var оп=опись(н);
    if(!оп || оп.есть===false) return;
    if(!изИстории) запомнитьГлаву(н);
    /* Оболочке приложения глава — слой: наббар прячется, кнопка шапки
       становится ✕ «Закрыть: <глава>» и ведёт в оглавление, а не в Уроки. */
    if(window.yasnaNav) window.yasnaNav.объявить({тип:'слой', имя:оп.имя, закрыть:кОглавлению});
    эТело.innerHTML='<div class="grузка">Открываю…</div>';
    эХвост.hidden=true;
    document.body.classList.add('chtenie');
    document.getElementById('shapka-t').textContent=оп.имя;
    window.scrollTo(0,0);
    загрузить(н, function(г){
      if(!г){ сбой(н); return; }
      эХвост.hidden=false;
      эТело.innerHTML=(г.части||[]).map(частьВHTML).join('');
      /* Буквица — первому содержательному абзацу главы, и только если он без
         номера записи: ::first-letter взял бы первую цифру номера, и запись
         931 читалась как «9…31» (главы 4, 8, 10). */
      var перв=эТело.querySelector('p:not(.snoska):not(.vydel)');
      if(перв && !перв.querySelector('.nom')
         && перв.textContent.replace(/\s/g,'').length>40) перв.classList.add('bukvica');
      /* Части поднимаются, когда доезжают до глаз; без наблюдателя — сразу. */
      if('IntersectionObserver' in window){
        var набл=new IntersectionObserver(function(зап){
          зап.forEach(function(x){ if(x.isIntersecting){ x.target.classList.add('vidno'); набл.unobserve(x.target); } });
        },{rootMargin:'0px 0px -8% 0px'});
        [].forEach.call(эТело.children,function(э){ набл.observe(э); });
      } else {
        [].forEach.call(эТело.children,function(э){ э.classList.add('vidno'); });
      }
      подтянутьСхемы();
      сост.глава=н; писать(сост);
      var i=О.главы.map(function(x){return x.номер}).indexOf(н);
      var пред=i>0?О.главы[i-1]:null, след=i<О.главы.length-1?О.главы[i+1]:null;
      var кП=document.getElementById('пред')||document.getElementById('pred');
      var кС=document.getElementById('sled');
      кП.disabled=!пред; кС.disabled=!(след&&след.есть!==false);
      кП.onclick=function(){ if(пред) открыть(пред.номер); };
      кС.onclick=function(){ if(след&&след.есть!==false) открыть(след.номер); };
      кС.textContent = (след&&след.есть!==false) ? 'Дальше ›' : 'Это конец книги';
    });
  }

  /* Выход из главы один на все пути — ✕ оболочки, Esc, аппаратная «назад».
     Запись в историю клали мы — уходим по ней (главу закроет popstate), иначе
     пришли прямой ссылкой: снимаем ?glava= сами, возвращаться некуда. */
  function кОглавлению(){
    if(главаВИстории){ главаВИстории=false; history.back(); return; }
    снятьГлавуИзАдреса();
    закрытьГлаву();
  }
  function закрытьГлаву(){
    if(!document.body.classList.contains('chtenie')) return;
    if(window.yasnaNav) window.yasnaNav.объявить(null);
    document.body.classList.remove('chtenie');
    document.getElementById('shapka-t').textContent=О.имя||'Книга';
    document.getElementById('polosa').style.width='0';
    рисоватьОглавление();
    window.scrollTo(0,0);
  }
  /* Возврат по истории (аппаратная «назад» на сайте, жест, кнопка браузера):
     в адресе есть глава — открываем её, нет — закрываем открытую. */
  window.addEventListener('popstate', function(){
    var н=null;
    try{ н=new URLSearchParams(location.search).get('glava'); }catch(e){}
    главаВИстории=(н!=null);
    if(н!=null && опись(+н)){ открыть(+н, true); return; }
    закрытьГлаву();
  });

  /* Прогресс чтения: полоска сверху; дочитал до низа — глава прочитана. */
  window.addEventListener('scroll', function(){
    if(!document.body.classList.contains('chtenie')) return;
    var в=document.documentElement.scrollHeight-window.innerHeight;
    var д=в>0?Math.min(1,window.scrollY/в):1;
    document.getElementById('polosa').style.width=(д*100)+'%';
    if(д>0.94 && сост.глава!=null && !сост.прочитано[сост.глава]){
      сост.прочитано[сост.глава]=Date.now(); писать(сост);
    }
  }, {passive:true});

  эСписок.addEventListener('click', function(e){
    var к=e.target.closest&&e.target.closest('[data-gl]');
    if(к) открыть(+к.getAttribute('data-gl'));
  });
  /* Размер текста: четыре честные ступени по кругу. Кнопка живёт и в
     оглавлении — это настройка всего чтения, не одной главы. Прежний шаг
     +0.2 давал дикий ряд 1 → 1.2 → 1.4 → 0.9. */
  var СТУПЕНИ=[1,1.15,1.3,0.9], ПОДПИСИ=['обычный','крупнее','крупный','мелкий'];
  document.getElementById('kegl').onclick=function(){
    var т=СТУПЕНИ.indexOf(сост.кегль); if(т<0) т=0;
    т=(т+1)%СТУПЕНИ.length;
    сост.кегль=СТУПЕНИ[т];
    document.documentElement.style.setProperty('--kn-kegl', сост.кегль);
    писать(сост);
    var п=document.getElementById('kegl-vspl');
    if(!п){ п=document.createElement('div'); п.id='kegl-vspl'; п.className='kegl-vspl';
      document.body.appendChild(п); }
    п.textContent='Текст: '+ПОДПИСИ[т];
    п.classList.remove('vidno'); void п.offsetWidth; п.classList.add('vidno');
  };
  /* Сохранённый прежним шагом кегль 1.2/1.4 приводим к ближней ступени. */
  if(СТУПЕНИ.indexOf(сост.кегль)<0){
    сост.кегль=сост.кегль>1.2?1.3:(сост.кегль>1?1.15:1);
    document.documentElement.style.setProperty('--kn-kegl', сост.кегль);
  }
  /* Аппаратная «назад» и Esc: из главы — в оглавление, а не из книги вон. */
  window.addEventListener('yasna:назад', function(e){
    /* Читаем главу — возвращаемся в оглавление, а не уходим с экрана.
       Событие шлют оба пути: аппаратная «назад» и кнопка в шапке. */
    if(document.body.classList.contains('chtenie')){ e.preventDefault&&e.preventDefault(); кОглавлению(); }
  });
  window.addEventListener('keydown', function(e){
    if(e.key==='Escape' && document.body.classList.contains('chtenie')) кОглавлению();
  });

  document.getElementById('obl-imya').textContent=О.имя||'Книга';
  document.getElementById('obl-pod').textContent=О.подпись||'';
  document.getElementById('shapka-t').textContent=О.имя||'Книга';
  document.title=(О.имя||'Книга')+' — учебник';
  /* Ненаписанных глав больше нет — весь учебник набран. Пометку оставляем
     в механике: если опись когда-нибудь опередит файлы, глава честно скажет
     «пишется», а не отдаст пустой лист. */
  рисоватьОглавление();

  var q=new URLSearchParams(location.search);
  if(q.get('glava')) открыть(+q.get('glava'), true);
})();
</script>
</body>
</html>
