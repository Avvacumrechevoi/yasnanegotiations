<!-- ═══════════════════════════════════════════════════════════════════════
     «ЛЕНТА УПРАВЛЕНИЙ» — вся лента с чипами управлений.

     Главный вход в ленту — раздел «Лента новостей» на «Сегодня»
     (app/glavnaya.html); сюда ведут дверь из Библиотеки («Вся лента»), чип
     «Записи в ленте» на карточке управления и пункт «Только «Управление»» в
     меню записи. Экран — тонкая обёртка над core/lenta.js: чипы управлений
     (только те, у кого есть записи) и YasnaLenta.встроить() с фильтром.

     Разбор владельца 05.09.2026: чипов типов записей нет (угадывали тип
     неверно), бесконечной прокрутки нет — «Показать ещё» по 20 записей.
     Числа, слова и состояния — в модуле; здесь только чипы и адрес.
     ═══════════════════════════════════════════════════════════════════════ -->

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--surface);color:var(--on-surface);padding-bottom:24px;
  font-family:var(--ya-font-text,system-ui,sans-serif);-webkit-font-smoothing:antialiased}
[hidden]{display:none !important}
button{font:inherit;color:inherit}
/* Шапка страницы. В приложении заголовок даёт оболочка (html.yk-shapka-est),
   своя шапка тогда прячется — иначе «Лента управлений» стояла бы дважды. */
.ln-shapka{padding:20px 16px 4px}
.ln-shapka h1{font:var(--type-headline-l)}
.ln-shapka p{margin-top:6px;font:var(--type-body-m);color:var(--on-surface-variant)}
html.yk-shapka-est .ln-shapka{display:none}
/* Прилипшие чипы управлений. */
.ln-lipko{position:sticky;top:var(--yk-shapka,0px);z-index:10;background:var(--surface);padding:6px 0 0;border-bottom:1px solid var(--outline-variant)}
.ln-lipko[hidden]{display:none !important}
.ln-telo{padding:0 0 8px}
</style>
</head>
<body>
<header class="ln-shapka">
  <h1>Лента управлений</h1>
  <p>Записи из открытых каналов управлений центра.</p>
</header>

<div class="ln-lipko" id="ln-lipko" hidden>
  <div class="chipy" id="chipy-upr" role="group" aria-label="Управления"></div>
</div>

<main class="ln-telo">
  <div id="lenta-koren"></div>
</main>

<script src="core/svyaz.js"></script>
<script src="core/upravleniya-dannye.js"></script>
<script src="core/lenta.js"></script>
<script>
(function(){
  'use strict';
  var Л = window.YasnaLenta;
  if(!Л) return;
  var эл = Л.эл;
  var КЛЮЧ_ФИЛЬТРА = 'yasna_lenta_filtr_v1';
  var $ = function(id){ return document.getElementById(id); };

  /* ── Фильтр управления. Старшинство: адрес (ссылка с карточки управления
     обязана открыть его) → память сессии при возврате внутрь ленты → пусто. */
  var П = new URLSearchParams(location.search);
  var ОТКУДА = /^(segodnya|biblioteka|upravleniya|lenta)$/.test(П.get('otkuda') || '') ? П.get('otkuda') : '';
  var УПР = '';
  (function(){
    var у = П.get('upravlenie');
    if(у != null){ УПР = /^[a-z0-9-]{1,40}$/.test(у) ? у : ''; return; }
    if(П.has('otkuda') && !возврат()) return;
    try { var с = JSON.parse(sessionStorage.getItem(КЛЮЧ_ФИЛЬТРА) || 'null'); if(с && /^[a-z0-9-]{1,40}$/.test(String(с.упр || ''))) УПР = String(с.упр); } catch(e){}
  })();
  function возврат(){
    try {
      var н = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
      if(н && н.type) return н.type === 'back_forward';
      return !!(performance.navigation && performance.navigation.type === 2);
    } catch(e){ return false; }
  }
  function запомнить(){ try { sessionStorage.setItem(КЛЮЧ_ФИЛЬТРА, JSON.stringify({ упр: УПР })); } catch(e){} }

  /* ── Чипы: «Все» и только управления с записями (сервер их называет),
     в порядке центра (по nomer). Центр и совладельцы чужого канала (Граника у
     канала Ясна-Школы) чипа не получают — иначе чужой канал выдавался бы за
     их ленту. */
  var сЗаписями = [];
  function порядок(id){ var у = Л.управление(id); var д = (window.YasnaUpravleniya && window.YasnaUpravleniya.upravleniya) || []; for(var i=0;i<д.length;i++) if(д[i].id === id) return д[i].nomer || 99; return 99; }
  function чипы(){
    var к = $('chipy-upr'), список = сЗаписями.filter(function(id){ return id && id !== 'centr'; });
    if(УПР && список.indexOf(УПР) < 0) список.push(УПР);
    список.sort(function(a, b){ return порядок(a) - порядок(b); });
    while(к.firstChild) к.removeChild(к.firstChild);
    if(!список.length){ $('ln-lipko').hidden = true; return; }
    [''].concat(список).forEach(function(id){
      var упр = id ? Л.управление(id) : null;
      var б = эл('button', { class: 'chip' + (id ? '' : ' bez'), type: 'button', 'aria-pressed': String(УПР === id), 'data-upr': id },
        [ упр ? Л.диск(упр, 'mdisk') : null, упр ? упр.имя : 'Все' ]);
      б.addEventListener('click', function(){ выбрать(id); });
      к.appendChild(б);
    });
    $('ln-lipko').hidden = false;
    var активный = к.querySelector('[aria-pressed="true"]');
    if(активный && активный.scrollIntoView){ try { активный.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch(e){} }
  }
  function выбрать(id){
    if(УПР === id) return;
    УПР = id || ''; запомнить();
    [].forEach.call($('chipy-upr').children, function(c){ c.setAttribute('aria-pressed', String(c.getAttribute('data-upr') === УПР)); });
    лента.фильтр(УПР || null);
    try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch(e){ window.scrollTo(0, 0); }
  }

  /* ── Лента. Чипы перерисовываются по каждому первому ответу сервера
     (в нём — управления с записями); «Только «Управление»» из меню записи
     перехватываем здесь и переключаем чип, а не уходим на другой экран. */
  var кэш = Л.кэш();
  if(кэш && кэш.upravleniya_s_zapisyami){ сЗаписями = кэш.upravleniya_s_zapisyami.slice(); чипы(); }
  var лента = Л.встроить($('lenta-koren'), { n: Л.ПАЧКА, upravlenie: УПР || null, otkuda: ОТКУДА || 'lenta' });
  document.addEventListener('yasna:лента-ответ', function(e){
    var о = e.detail && e.detail.ответ;
    if(о && о.upravleniya_s_zapisyami && о.upravleniya_s_zapisyami.length){ сЗаписями = о.upravleniya_s_zapisyami.slice(); чипы(); }
  });
  document.addEventListener('yasna:лента-фильтр', function(e){
    e.preventDefault();
    выбрать(e.detail && e.detail.upravlenie);
  });
})();
</script>
</body>
</html>
