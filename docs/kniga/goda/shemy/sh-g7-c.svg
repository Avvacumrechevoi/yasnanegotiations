<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 1020" width="1540" height="1020" role="img" aria-label="Весы Года: шестиугольник между Чашей Тепла и Чашей Холода, Стрелка Весов, Шкала Весов, Точка Весов, Весы и кубок">
  <title>Весы Года (№413)</title>
  <g fill="none" stroke="var(--kn-ink,#1a1a1a)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== Шестиугольник Года ===== -->
    <path d="M 600,357 L 687,162 L 1077,162 L 1152,357 L 1074,552 L 684,552 Z"/>

    <!-- горизонтальная ось: от стрелки через шкалу и шестиугольник к Весам,
         с разрывами под числами 3 и 9 -->
    <path d="M 519,357 L 654,357 M 705,357 L 1044,357 M 1098,357 L 1185,357"/>

    <!-- ===== Шкала Весов (нониусная шкала) ===== -->
    <g stroke-width="3">
      <path d="M 600,240 L 600,465"/>
      <!-- крупные деления -->
      <path d="M 576,240 L 600,240 M 576,296 L 600,296 M 576,353 L 600,353 M 576,409 L 600,409 M 576,465 L 600,465" stroke-width="4"/>
      <!-- мелкие деления -->
      <g stroke-width="2.6">
        <path d="M 590,251 L 600,251 M 590,262 L 600,262 M 590,274 L 600,274 M 590,285 L 600,285"/>
        <path d="M 590,307 L 600,307 M 590,319 L 600,319 M 590,330 L 600,330 M 590,341 L 600,341"/>
        <path d="M 590,364 L 600,364 M 590,375 L 600,375 M 590,387 L 600,387 M 590,398 L 600,398"/>
        <path d="M 590,420 L 600,420 M 590,432 L 600,432 M 590,443 L 600,443 M 590,454 L 600,454"/>
      </g>
    </g>

    <!-- ===== Стрелка Весов: оперение + древко + наконечник ===== -->
    <path d="M 291,339 L 309,357 L 291,375 M 309,339 L 327,357 L 309,375 M 327,339 L 345,357 L 327,375" stroke-width="4"/>
    <path d="M 345,357 L 519,357"/>
    <path d="M 519,338 L 561,357 L 519,376 Z" fill="var(--kn-ink,#1a1a1a)" stroke="none"/>

    <!-- ===== Указатель «Точка Весов» ===== -->
    <path d="M 1203,216 L 1182,282" stroke-width="3.6" stroke-dasharray="12 10"/>
    <path d="M 1167,288 L 1203,294 L 1170,324 Z" fill="var(--kn-ink,#1a1a1a)" stroke="none"/>

    <!-- ================= ВЕСЫ ================= -->
    <g stroke-width="3">
      <!-- глаз-солнце на вершине -->
      <g stroke-width="2.4">
        <path d="M 1275,282 L 1275,294 M 1275,324 L 1275,336 M 1248,309 L 1260,309 M 1290,309 L 1302,309
                 M 1256,290 L 1264,298 M 1286,320 L 1294,328 M 1294,290 L 1286,298 M 1264,320 L 1256,328
                 M 1265,285 L 1268,295 M 1285,285 L 1282,295 M 1265,333 L 1268,323 M 1285,333 L 1282,323"/>
        <ellipse cx="1275" cy="309" rx="14" ry="8"/>
        <circle cx="1275" cy="309" r="3.6" fill="var(--kn-ink,#1a1a1a)"/>
      </g>
      <!-- шейка и навершие столбика -->
      <path d="M 1275,336 L 1275,342"/>
      <ellipse cx="1276" cy="345" rx="13" ry="9"/>
      <path d="M 1268,352 L 1268,358 M 1284,352 L 1284,358"/>

      <!-- коромысло весов (волна) -->
      <path d="M 1168,348 C 1181,341 1191,371 1212,375 C 1238,379 1258,367 1276,363
               C 1296,367 1316,379 1342,375 C 1363,371 1371,343 1376,346"/>
      <path d="M 1168,357 C 1183,352 1193,380 1212,384 C 1238,388 1258,376 1276,372
               C 1296,376 1316,388 1342,384 C 1361,380 1371,354 1376,355" stroke-width="2.4"/>
      <!-- центральный узел коромысла -->
      <path d="M 1252,362 L 1258,354 L 1294,354 L 1300,362 L 1294,381 L 1258,381 Z"/>
      <path d="M 1264,358 L 1264,378 M 1288,358 L 1288,378" stroke-width="2.2"/>
      <ellipse cx="1276" cy="368" rx="7" ry="8" stroke-width="2.2"/>

      <!-- левая подвеска и чаша -->
      <path d="M 1194,378 L 1155,453 M 1194,378 L 1233,453"/>
      <path d="M 1149,453 L 1239,453"/>
      <path d="M 1155,453 C 1160,468 1174,474 1194,474 C 1214,474 1228,468 1233,453"/>
      <path d="M 1163,466 L 1225,466" stroke-width="2.2"/>
      <!-- солнце в левой чаше -->
      <g stroke-width="2.4">
        <circle cx="1196" cy="432" r="11"/>
        <path d="M 1196,410 L 1196,421 M 1196,443 L 1196,454 M 1174,432 L 1185,432 M 1207,432 L 1218,432
                 M 1180,416 L 1188,424 M 1204,440 L 1212,448 M 1212,416 L 1204,424 M 1188,440 L 1180,448"/>
      </g>

      <!-- правая подвеска и чаша -->
      <path d="M 1356,378 L 1320,456 M 1356,378 L 1392,456"/>
      <path d="M 1314,456 L 1398,456"/>
      <path d="M 1320,456 C 1325,470 1338,477 1356,477 C 1374,477 1387,470 1392,456"/>
      <path d="M 1328,469 L 1384,469" stroke-width="2.2"/>
      <!-- месяц в правой чаше -->
      <path d="M 1362,414 A 21,21 0 1 0 1362,456 A 16,16 0 1 1 1362,414 Z" stroke-width="2.6"/>

      <!-- столб весов -->
      <path d="M 1269,381 L 1269,489 M 1284,381 L 1284,489"/>
      <path d="M 1263,428 L 1290,428 L 1290,436 L 1263,436 Z" fill="var(--kn-ink,#1a1a1a)" stroke="none"/>
      <path d="M 1263,443 L 1290,443 L 1290,451 L 1263,451 Z" fill="var(--kn-ink,#1a1a1a)" stroke="none"/>
      <!-- подножие -->
      <path d="M 1269,489 C 1263,501 1257,507 1248,513 L 1305,513 C 1296,507 1290,501 1284,489"/>
      <path d="M 1245,513 L 1308,513 L 1308,519 L 1245,519 Z" fill="var(--kn-ink,#1a1a1a)" stroke="none"/>

      <!-- звёздочки вокруг весов -->
      <g fill="var(--kn-ink,#1a1a1a)" stroke="none">
        <path d="M 1329,273 L 1334,285 L 1346,290 L 1334,295 L 1329,307 L 1324,295 L 1312,290 L 1324,285 Z"/>
        <path d="M 1200,306 L 1203,313 L 1210,316 L 1203,319 L 1200,326 L 1197,319 L 1190,316 L 1197,313 Z"/>
        <path d="M 1224,462 L 1228,473 L 1239,477 L 1228,481 L 1224,492 L 1220,481 L 1209,477 L 1220,473 Z"/>
        <path d="M 1161,477 L 1164,484 L 1171,487 L 1164,490 L 1161,497 L 1158,490 L 1151,487 L 1158,484 Z"/>
        <path d="M 1344,477 L 1347,485 L 1355,488 L 1347,491 L 1344,499 L 1341,491 L 1333,488 L 1341,485 Z"/>
      </g>
    </g>

    <!-- ================= ЧАША ХОЛОДА (кубок) ================= -->
    <g stroke-width="3">
      <!-- верхний обод: тяжёлый профиль -->
      <path d="M 744,699 C 800,690 958,690 1014,699"/>
      <path d="M 744,699 C 800,710 958,710 1014,699"/>
      <path d="M 747,714 C 802,724 956,724 1011,714" stroke-width="2.4"/>
      <path d="M 744,699 L 747,714 M 1014,699 L 1011,714" stroke-width="2.4"/>
      <!-- поясок под ободом (тёмная резьба) -->
      <path d="M 747,714 C 802,724 956,724 1011,714 L 1006,741 C 952,752 806,752 752,741 Z"
            fill="var(--kn-ink,#1a1a1a)" stroke="none" opacity="0.88"/>
      <!-- тулово чаши -->
      <path d="M 752,741 C 762,779 796,806 828,816 L 930,816 C 962,806 996,779 1006,741"/>
      <!-- фестоны нижнего края тулова -->
      <g stroke-width="2.2">
        <path d="M 768,772 C 786,796 810,812 828,816"/>
        <path d="M 990,772 C 972,796 948,812 930,816"/>
        <path d="M 852,816 C 846,796 843,769 843,747"/>
        <path d="M 906,816 C 912,796 915,769 915,747"/>
        <path d="M 879,816 L 879,747"/>
      </g>
      <!-- узел (яблоко) с зернью -->
      <path d="M 828,816 C 816,822 806,830 806,842 C 806,856 838,867 879,867 C 920,867 952,856 952,842 C 952,830 942,822 930,816"/>
      <g stroke-width="2.2">
        <path d="M 820,832 C 858,843 900,843 938,832"/>
        <path d="M 828,858 C 862,866 896,866 930,858"/>
        <path d="M 846,822 L 843,861 M 879,819 L 879,867 M 912,822 L 915,861"/>
      </g>
      <!-- ножка -->
      <path d="M 858,867 C 854,879 852,890 852,900 M 900,867 C 904,879 906,890 906,900"/>
      <!-- раструб подножия -->
      <path d="M 852,900 C 842,927 816,955 783,972 M 906,900 C 916,927 942,955 975,972"/>
      <g stroke-width="2.2">
        <path d="M 834,936 C 864,945 894,945 924,936"/>
        <path d="M 810,960 C 856,970 902,970 948,960"/>
        <path d="M 879,900 L 879,969"/>
      </g>
      <path d="M 783,972 L 975,972"/>
      <!-- основание -->
      <path d="M 747,976 L 1011,976 L 1011,993 L 747,993 Z" fill="var(--kn-ink,#1a1a1a)" stroke="none"/>
    </g>
  </g>

  <!-- ================= ПОДПИСИ ================= -->
  <g fill="var(--kn-ink,#1a1a1a)" font-family="var(--kn-serif,Georgia,serif)">
    <text x="882" y="81" font-size="46" text-anchor="middle">Чаша Тепла</text>
    <text x="879" y="660" font-size="46" text-anchor="middle">Чаша Холода</text>

    <text x="66" y="360" font-size="46">Стрелка</text>
    <text x="66" y="399" font-size="46">Весов</text>

    <text x="438" y="534" font-size="46">Шкала</text>
    <text x="438" y="573" font-size="46">Весов</text>

    <text x="1194" y="207" font-size="46">Точка Весов</text>
    <text x="1272" y="570" font-size="46" text-anchor="middle">Весы</text>

    <text x="681" y="371" font-size="44" text-anchor="middle">3</text>
    <text x="1071" y="373" font-size="44" text-anchor="middle">9</text>
  </g>
</svg>
