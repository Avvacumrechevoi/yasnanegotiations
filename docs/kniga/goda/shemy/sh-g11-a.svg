<!-- ===== подписи ===== -->
<g font-size="56" font-weight="700" letter-spacing="4">
  <text x="2650" y="118" text-anchor="end">Направление в Будущий Год.</text>
  <text x="2650" y="174" text-anchor="end">Или, Направление В Будущее.</text>

  <text x="44" y="362">Перекладина – отрезок</text>
  <text x="44" y="418">Течения Реки Вечности.</text>
  <text x="44" y="474">Реки Времён.</text>

  <text x="2900" y="692" text-anchor="end">Шест – Переправа через</text>
  <text x="2900" y="748" text-anchor="end">Реку Времени.</text>
  <text x="2900" y="804" text-anchor="end">Переход от прошедшего Года в</text>
  <text x="2900" y="860" text-anchor="end">Год следующий.</text>

  <text x="1480" y="1246" text-anchor="middle">Камень «Павел» Прошедший Год.</text>
  <text x="1465" y="1302" text-anchor="middle">Или, прошлое Время, о котором нужно помнить.</text>
</g>
</svg>
