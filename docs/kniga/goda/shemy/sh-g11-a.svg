<!-- ===== стрелки-выноски ===== -->
<g fill="none" stroke="var(--kn-ink,#1a1a1a)" stroke-width="4" marker-end="url(#ca-ah)">
  <line x1="1488" y1="172" x2="1488" y2="76"/>
  <line x1="1488" y1="1192" x2="1488" y2="1128"/>
</g>
<g fill="none" stroke="var(--kn-ink,#1a1a1a)" stroke-width="3.4" stroke-dasharray="14 12" marker-end="url(#ca-ah)">
  <line x1="560" y1="458" x2="1196" y2="458"/>
  <line x1="1980" y1="692" x2="1608" y2="692"/>
