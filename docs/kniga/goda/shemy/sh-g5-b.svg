<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-212 -14 1342 878" width="100%" fill="var(--kn-ink,#1a1a1a)" font-family="var(--kn-serif,Georgia,serif)" role="img" aria-label="Серповая Ясна: двенадцать Серпов Луны по кругу Года">

<defs>
<g id="knMoon">
  <!-- внешнее тонкое кольцо, разомкнутое справа -->
  <path d="M 18.5,-29.7 A 35,35 0 1 0 8.5,34.0" fill="none" stroke="var(--kn-ink,#1a1a1a)" stroke-width="1.7" stroke-linecap="round"/>
  <!-- тело серпа -->
  <path d="M -14,-26.5 A 30,30 0 1 1 -14,26.5 A 27,27 0 0 1 -14,-26.5 Z" fill="none" stroke="var(--kn-ink,#1a1a1a)" stroke-width="1.9"/>
  <!-- лик луны в профиль -->
  <g fill="none" stroke="var(--kn-ink,#1a1a1a)" stroke-width="1.25" stroke-linecap="round">
    <path d="M 24,-19 C 20,-17 18.5,-13.5 19.2,-10"/>
    <path d="M 20.5,-12.5 C 21.6,-13.6 23.2,-13.4 23.9,-12.2"/>
    <path d="M 19.2,-10 C 17.6,-7.6 15.6,-5.2 16,-3.4 C 16.4,-1.8 18.4,-1.4 19.7,-1.8"/>
    <path d="M 19.5,1.2 C 18,2 17.5,3.4 18.6,4.3 C 19.5,5 20.8,4.8 21.5,4.1"/>
    <path d="M 20.6,7.4 C 19.7,9.6 20.4,12.4 22.4,14"/>
    <path d="M 27,-22 C 29.2,-18.4 29.6,-14 28.4,-10"/>
  </g>
  <circle cx="22" cy="-11.6" r="1.1" fill="var(--kn-ink,#1a1a1a)" stroke="none"/>
  <!-- растительный убор справа и снизу -->
  <g fill="var(--kn-ink,#1a1a1a)" stroke="none">
    <ellipse cx="36" cy="-25" rx="6.2" ry="3.5" transform="rotate(-45 36 -25)"/>
    <ellipse cx="43" cy="-15" rx="6.6" ry="3.6" transform="rotate(-22 43 -15)"/>
    <ellipse cx="45" cy="-3" rx="6.0" ry="3.3" transform="rotate(4 45 -3)"/>
    <ellipse cx="43" cy="9" rx="7.0" ry="3.8" transform="rotate(25 43 9)"/>
    <ellipse cx="37" cy="20" rx="6.6" ry="3.6" transform="rotate(46 37 20)"/>
    <ellipse cx="27" cy="28" rx="7.0" ry="3.8" transform="rotate(66 27 28)"/>
    <ellipse cx="16" cy="33" rx="6.2" ry="3.4" transform="rotate(84 16 33)"/>
    <ellipse cx="34" cy="-13" rx="4.2" ry="2.5" transform="rotate(-55 34 -13)"/>
    <ellipse cx="35" cy="3" rx="4.5" ry="2.7" transform="rotate(-6 35 3)"/>
    <ellipse cx="27" cy="17" rx="4.2" ry="2.5" transform="rotate(40 27 17)"/>
    <ellipse cx="19" cy="25" rx="3.8" ry="2.3" transform="rotate(70 19 25)"/>
    <circle cx="47" cy="-23" r="2.7"/>
    <circle cx="8" cy="37" r="2.4"/>
  </g>
  <g fill="none" stroke="var(--kn-ink,#1a1a1a)" stroke-width="1.4" stroke-linecap="round">
    <path d="M 29,-27 C 36,-32 43,-30 45,-25"/>
    <path d="M 46,-9 C 50,-7 50,-1 46,1"/>
    <path d="M 39,24 C 43,28 41,33 36,33"/>
    <path d="M 20,35 C 16,39 10,39 7,35"/>
    <path d="M 31,-4 C 36,-6 39,-2 37,2"/>
  </g>
</g>
</defs>

<!-- ===== светлый (растущий) серп Года: от Полки 5 через 3 к 11 ===== -->
<path d="M 330,170.2 A 300,300 0 0 0 630,689.8 A 301.2,301.2 0 0 1 330,170.2 Z"
      fill="var(--kn-ink,#1a1a1a)" fill-opacity="0.36" stroke="none"/>
<!-- ===== тёмный серп Года: от Полки 5 через 9 к 11 ===== -->
<path d="M 330,170.2 A 300,300 0 0 1 630,689.8 A 301.2,301.2 0 0 0 330,170.2 Z"
      fill="var(--kn-ink,#1a1a1a)" stroke="none"/>

<!-- ===== шестиугольник Года по нечётным Полкам 1-3-5-7-9-11 ===== -->
<path d="M 330,170.2 L 618.6,189.9 L 757.3,430 L 630,689.8 L 341.4,670.1 L 202.7,430 Z"
      fill="none" stroke="var(--kn-ink,#1a1a1a)" stroke-width="2.4" stroke-linejoin="round"/>

<!-- ===== Линия борьбы и сопротивления (3 — 9) ===== -->
<line x1="149" y1="430" x2="335" y2="430" stroke="var(--kn-ink,#1a1a1a)" stroke-opacity="0.42" stroke-width="2.4"/>
<line x1="630" y1="430" x2="811" y2="430" stroke="var(--kn-ink,#1a1a1a)" stroke-width="5"/>

<!-- ===== стрелы движения по кругу ===== -->
<g stroke="var(--kn-ink,#1a1a1a)" stroke-width="2.2" fill="none" stroke-dasharray="9 7">
  <line x1="271" y1="368" x2="326" y2="273"/>
  <line x1="689" y1="492" x2="634" y2="587"/>
</g>
<g fill="var(--kn-ink,#1a1a1a)" stroke="none">
  <path d="M 338,253 L 333.1,280.3 L 316.7,270.7 Z"/>
  <path d="M 622,607 L 626.9,579.7 L 643.3,589.3 Z"/>
</g>

<!-- ===== восемь нарисованных Серпов Луны ===== -->
<use href="#knMoon" xlink:href="#knMoon" transform="translate(5,66)"/>
<use href="#knMoon" xlink:href="#knMoon" transform="translate(-72,256)"/>
<use href="#knMoon" xlink:href="#knMoon" transform="translate(-72,596)"/>
<use href="#knMoon" xlink:href="#knMoon" transform="translate(10,788)"/>
<use href="#knMoon" xlink:href="#knMoon" transform="translate(932,62)"/>
<use href="#knMoon" xlink:href="#knMoon" transform="translate(1004,256)"/>
<use href="#knMoon" xlink:href="#knMoon" transform="translate(1004,596)"/>
<use href="#knMoon" xlink:href="#knMoon" transform="translate(955,795)"/>

<!-- ===== номера Полок ===== -->
<g font-size="29" text-anchor="middle" font-variant-numeric="lining-nums" style="font-feature-settings:'lnum' 1">
  <text x="480" y="770">0</text>
  <text x="303" y="729">1</text>
  <text x="184" y="595">2</text>
  <text x="122" y="442">3</text>
  <text x="184" y="285">4</text>
  <text x="308" y="160">5</text>
  <text x="472" y="108">6</text>
  <text x="652" y="160">7</text>
  <text x="776" y="285">8</text>
  <text x="849" y="442">9</text>
  <text x="778" y="595">10</text>
  <text x="655" y="729">11</text>
</g>

<!-- ===== подписи ===== -->
<g font-size="26">
  <!-- Полка 6 -->
  <text x="476" y="35" text-anchor="middle">Серп после Летнего</text>
  <text x="476" y="63" text-anchor="middle">Солнцестояния</text>
  <!-- Полка 5 -->
  <text x="70" y="130">Серп начала</text>
  <text x="70" y="158">Лета</text>
  <!-- Полка 4 -->
  <text x="0" y="231">Серп Весны</text>
  <!-- Полка 3 -->
  <text x="-178" y="393">Серп</text>
  <text x="-178" y="419">после</text>
  <text x="-178" y="445">Вессеннего</text>
  <text x="-178" y="471">Равноденствия</text>
  <!-- Полка 2 -->
  <text x="-2" y="629">Серп Весны</text>
  <!-- Полка 1 -->
  <text x="76" y="728">Серп конца</text>
  <text x="76" y="754">Зимы</text>
  <!-- Полка 0 -->
  <text x="476" y="803" text-anchor="middle">Серп после Зимнего</text>
  <text x="476" y="830" text-anchor="middle">Солнцестояния</text>
  <!-- Полка 7 -->
  <text x="888" y="127" text-anchor="end">Серп конца</text>
  <text x="888" y="153" text-anchor="end">Лета</text>
  <!-- Полка 8 -->
  <text x="766" y="221">Серп Осени</text>
  <!-- Полка 9 -->
  <text x="1110" y="421" text-anchor="end">Серп после</text>
  <text x="1110" y="447" text-anchor="end">Осеннего</text>
  <text x="1110" y="473" text-anchor="end">Равноденствия</text>
  <!-- Полка 10 -->
  <text x="766" y="629">Серп Осени</text>
  <!-- Полка 11 -->
  <text x="910" y="734" text-anchor="end">Серп начала</text>
  <text x="910" y="760" text-anchor="end">Зимы</text>
  <!-- центр -->
  <text x="476" y="425" text-anchor="middle">Линия борьбы и</text>
  <text x="476" y="452" text-anchor="middle">сопротивления</text>
</g>
</svg>
