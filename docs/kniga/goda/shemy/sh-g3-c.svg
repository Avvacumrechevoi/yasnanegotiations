<svg xmlns="http://www.w3.org/2000/svg" viewBox="215 210 1075 725" width="100%" role="img" aria-label="Чертёж Года: двенадцать точек, серпы света и тьмы, риски переломов" font-family="var(--kn-serif,Georgia,serif)" fill="var(--kn-ink,#1a1a1a)" stroke="none">

<!-- ========== хорды шестиугольника (боковые) ========== -->
<g fill="none" stroke="var(--kn-ink,#1a1a1a)" stroke-width="2.4">
  <line x1="600" y1="300.192" x2="450" y2="560"/>
  <line x1="450" y1="560" x2="600" y2="819.808"/>
  <line x1="900" y1="300.192" x2="1050" y2="560"/>
  <line x1="1050" y1="560" x2="900" y2="819.808"/>
  <!-- верхняя хорда 5–7 с разрывом под «0» -->
  <line x1="604" y1="300.192" x2="733.5" y2="300.192"/>
  <line x1="774.4" y1="300.192" x2="900" y2="300.192"/>
  <!-- нижняя хорда 1–11 с разрывом под «0» -->
  <line x1="600" y1="819.808" x2="728.7" y2="819.808"/>
  <line x1="776" y1="819.808" x2="900" y2="819.808"/>
</g>

<!-- ========== серп СВЕТА (левая половина, светлый) ========== -->
<path d="M 600,300.192 A 300,300 0 0 0 450,560 A 300,300 0 0 0 900,819.808 A 301.05,301.05 0 0 1 600,300.192 Z"
      fill="var(--kn-ink,#1a1a1a)" fill-opacity="0.42"/>

<!-- ========== серп ТЬМЫ (правая половина, чёрный) ========== -->
<path d="M 600,300.192 A 300,300 0 0 1 1050,560 A 300,300 0 0 1 900,819.808 A 301.05,301.05 0 0 0 600,300.192 Z"
      fill="var(--kn-ink,#1a1a1a)"/>

<!-- ========== риски переломов на хордах ========== -->
<!-- «−» на хорде 3–5 -->
<rect x="529.4" y="407.8" width="12.6" height="6.3"/>
<!-- «−» на хорде 9–11 -->
<rect x="958.0" y="704.0" width="12.6" height="6.3"/>
<!-- «+» на хорде 1–3 -->
<g stroke="var(--kn-ink,#1a1a1a)" stroke-width="4" fill="none">
  <line x1="527.8" y1="712.0" x2="543.6" y2="712.0"/>
  <line x1="535.7" y1="704.1" x2="535.7" y2="719.9"/>
  <!-- «+» на хорде 7–9 -->
  <line x1="958.0" y1="411.0" x2="973.8" y2="411.0"/>
  <line x1="965.9" y1="403.1" x2="965.9" y2="418.9"/>
</g>

<!-- ========== «0» в разрывах верхней и нижней хорды ========== -->
<g font-size="16" text-anchor="middle" font-variant-numeric="lining-nums">
  <text x="753.9" y="303.1">0</text>
  <text x="753.2" y="824.6">0</text>
</g>

<!-- ========== Линия борьбы и сопротивления ========== -->
<line x1="442" y1="560" x2="639" y2="560" stroke="var(--kn-ink,#1a1a1a)" stroke-opacity="0.5" stroke-width="4.7"/>
<line x1="873.5" y1="560" x2="1054.9" y2="560" stroke="var(--kn-ink,#1a1a1a)" stroke-width="5"/>
<g font-size="24" letter-spacing="2" text-anchor="middle">
  <text x="751" y="552">Линия борьбы и</text>
  <text x="751" y="578">сопротивления</text>
</g>

<!-- ========== пунктирные стрелки хода ========== -->
<g stroke="var(--kn-ink,#1a1a1a)" stroke-width="2.6" fill="none" stroke-dasharray="6 8">
  <line x1="545.9" y1="500.1" x2="598.0" y2="408.7"/>
  <line x1="954.1" y1="619.9" x2="902.0" y2="711.3"/>
</g>
<path d="M 616.9,378.7 L 598.0,392.9 L 612.1,400.8 Z"/>
<path d="M 883.1,741.3 L 902.0,727.1 L 887.9,719.2 Z"/>

<!-- ========== номера точек 0–11 ========== -->
<g font-size="24" text-anchor="middle" font-variant-numeric="lining-nums">
  <text x="755.5" y="241.6">6</text>
  <text x="588.5" y="279.5">5</text>
  <text x="913.9" y="281">7</text>
  <text x="467.2" y="410.2">4</text>
  <text x="1036" y="407.1">8</text>
  <text x="424.6" y="569.4">3</text>
  <text x="1076.9" y="563.1">9</text>
  <text x="468" y="739.5">2</text>
  <text x="1039.9" y="734.8">10</text>
  <text x="594" y="864">1</text>
  <text x="913.9" y="864">11</text>
  <text x="754.7" y="898.7">0</text>
</g>

<!-- ========== подписи ========== -->
<g font-size="24" letter-spacing="2">
  <text x="507.4" y="243" text-anchor="middle">Конец Весны</text>
  <text x="998.2" y="244.8" text-anchor="middle">Начало Осени</text>

  <text x="232.4" y="520.5">Весеннее</text>
  <text x="232.4" y="541">Равноденствие</text>

  <text x="1271" y="575.7" text-anchor="end">Осеннее</text>
  <text x="1271" y="596.2" text-anchor="end">Равноденствие</text>

  <text x="501.9" y="914" text-anchor="middle">Начало Весны</text>
  <text x="986.4" y="908" text-anchor="middle">Конец Осени</text>
</g>

</svg>
