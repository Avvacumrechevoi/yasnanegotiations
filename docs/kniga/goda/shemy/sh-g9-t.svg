<text x="1156" y="98.0" text-anchor="middle" font-size="42" font-weight="400" letter-spacing="1.2">Человек и все</text>
<text x="1156" y="145.0" text-anchor="middle" font-size="42" font-weight="400" letter-spacing="1.2">его родственники.</text>
<text x="1156" y="192.0" text-anchor="middle" font-size="42" font-weight="400" letter-spacing="1.2">Обезьяны</text>
<text x="1953" y="198.0" text-anchor="end" font-size="42" font-weight="400" letter-spacing="1.2">Кот и все его</text>
<text x="1953" y="245.0" text-anchor="end" font-size="42" font-weight="400" letter-spacing="1.2">родственники.</text>
<text x="1953" y="292.0" text-anchor="end" font-size="42" font-weight="400" letter-spacing="1.2">Лев, Тигр, Гепард,</text>
<text x="1953" y="339.0" text-anchor="end" font-size="42" font-weight="400" letter-spacing="1.2">Барс, Оцелот...</text>
<text x="500" y="264.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">Олень и все его</text>
<text x="500" y="311.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">родственники.</text>
<text x="500" y="358.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">Лось, Верблюд,</text>
<text x="500" y="405.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">Жираф, Окапи...</text>
<text x="2125" y="508.0" text-anchor="end" font-size="42" font-weight="400" letter-spacing="1.2">Собака и все её</text>
<text x="2125" y="555.0" text-anchor="end" font-size="42" font-weight="400" letter-spacing="1.2">родственники.</text>
<text x="2125" y="602.0" text-anchor="end" font-size="42" font-weight="400" letter-spacing="1.2">Волк, Медведь,</text>
<text x="2125" y="649.0" text-anchor="end" font-size="42" font-weight="400" letter-spacing="1.2">Лисица, Куница...</text>
<text x="312" y="614.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">Телец и все его</text>
<text x="312" y="661.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">родственники.</text>
<text x="312" y="708.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">Тур, Бизон, Як...</text>
<text x="150" y="898.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">Овен и все его</text>
<text x="150" y="945.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">родственники.</text>
<text x="150" y="992.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">Муфлон, Арха...</text>
<text x="1881" y="895.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">Все птицы.</text>
<text x="281" y="1164.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">Лошадь и все её</text>
<text x="281" y="1211.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">родственники.</text>
<text x="281" y="1258.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">Кулан, Зебра...</text>
<text x="2181" y="1145.0" text-anchor="end" font-size="42" font-weight="400" letter-spacing="1.2">Дракон, Крокодил,</text>
<text x="2181" y="1192.0" text-anchor="end" font-size="42" font-weight="400" letter-spacing="1.2">Варан, и все</text>
<text x="2181" y="1239.0" text-anchor="end" font-size="42" font-weight="400" letter-spacing="1.2">Ящеры и Ящерицы.</text>
<text x="250" y="1426.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">Мышь и все её</text>
<text x="250" y="1473.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">родственники.</text>
<text x="250" y="1520.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">Крыса, Крот,</text>
<text x="250" y="1567.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">Белка, Заяц...</text>
<text x="1588" y="1426.0" text-anchor="start" font-size="42" font-weight="400" letter-spacing="1.2">Все Змеи.</text>
<text x="1156" y="1623.0" text-anchor="middle" font-size="42" font-weight="400" letter-spacing="1.2">Свинья и все её</text>
<text x="1156" y="1670.0" text-anchor="middle" font-size="42" font-weight="400" letter-spacing="1.2">родственники.</text>
