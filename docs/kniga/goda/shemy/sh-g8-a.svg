<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1860 1380" width="1860" height="1380" role="img" aria-label="Все Полки Ясны: круг из двенадцати Полок с номерами 0–11 и знаками зодиака, Горизонт Ясны и Столп Ясны">
  <title>Все Полки Ясны (№671)</title>
  <g fill="none" stroke="var(--kn-ink,#1a1a1a)" stroke-width="4.5" stroke-linecap="butt">

    <!-- ===== Столп Ясны: вертикальная ось ===== -->
    <path d="M 930,396 L 930,926"/>
    <path d="M 906,396 L 954,396"/>
    <path d="M 906,926 L 954,926"/>

    <!-- ===== Горизонт Ясны: горизонтальная ось ===== -->
    <path d="M 676,660 L 1168,660"/>
    <path d="M 676,634 L 676,686"/>
    <path d="M 1168,634 L 1168,686"/>

    <!-- ===== Восемь промежуточных Полок: короткие лучи ===== -->
    <g stroke-width="4">
      <path d="M 838,819 L 802,882"/>   <!-- 1 -->
      <path d="M 771,752 L 708,788"/>   <!-- 2 -->
      <path d="M 771,568 L 708,532"/>   <!-- 4 -->
      <path d="M 838,501 L 802,438"/>   <!-- 5 -->
      <path d="M 1022,501 L 1058,438"/> <!-- 7 -->
      <path d="M 1089,568 L 1152,532"/> <!-- 8 -->
      <path d="M 1089,752 L 1152,788"/> <!-- 10 -->
      <path d="M 1022,819 L 1058,882"/> <!-- 11 -->
    </g>

    <!-- ===== Отвес Ясны: верхний отрезок и указатель ===== -->
    <path d="M 930,64 L 930,132" stroke-width="4"/>
    <path d="M 946,70 L 986,52 L 986,64 L 1026,64 L 1026,80 L 986,80 L 986,90 Z"
          fill="var(--kn-ink,#1a1a1a)" stroke="none"/>
    <path d="M 1030,72 L 1042,72 M 1048,72 L 1058,72" stroke-width="4"/>

    <!-- ===== Столп Ясны: нижний отрезок и указатель ===== -->
    <path d="M 930,1196 L 930,1284" stroke-width="4"/>
    <path d="M 962,1276 L 998,1258 L 998,1268 L 1018,1268 L 1018,1284 L 998,1284 L 998,1294 Z"
          fill="var(--kn-ink,#1a1a1a)" stroke="none"/>
    <path d="M 1026,1276 L 1038,1276 M 1044,1276 L 1054,1276" stroke-width="4"/>

    <!-- ===== Выноска «Горизонт Ясны» ===== -->
    <path d="M 62,674 L 302,674" stroke-width="4"/>

    <!-- ===== Выноска «Или, Уровень Ясны» ===== -->
    <path d="M 1530,656 L 1786,656" stroke-width="4"/>

    <!-- тире перед числом 3 -->
    <path d="M 576,664 L 604,664" stroke-width="4"/>
  </g>

  <!-- ================= ПОДПИСИ ================= -->
  <g fill="var(--kn-ink,#1a1a1a)" font-family="var(--kn-serif,Georgia,serif)">

    <!-- номера Полок 0–11 -->
    <g font-size="46" text-anchor="middle">
      <text x="934" y="1012">0</text>
      <text x="778" y="956">1</text>
      <text x="654" y="836">2</text>
      <text x="626" y="680">3</text>
      <text x="670" y="516">4</text>
      <text x="778" y="400">5</text>
      <text x="934" y="340">6</text>
      <text x="1082" y="404">7</text>
      <text x="1190" y="516">8</text>
      <text x="1222" y="676">9</text>
      <text x="1198" y="840">10</text>
      <text x="1086" y="952">11</text>
    </g>

    <!-- знаки зодиака -->
    <g font-size="92" text-anchor="middle">
      <text x="930" y="1096">♑︎</text>
      <text x="726" y="1048">♒︎</text>
      <text x="626" y="880">♓︎</text>
      <text x="518" y="672">♈︎</text>
      <text x="598" y="468">♉︎</text>
      <text x="730" y="300">♊︎</text>
      <text x="930" y="272">♋︎</text>
      <text x="1126" y="304">♌︎</text>
      <text x="1274" y="472">♍︎</text>
      <text x="1306" y="664">♎︎</text>
      <text x="1290" y="896">♏︎</text>
      <text x="1126" y="1040">♐︎</text>
    </g>

    <!-- названия созвездий -->
    <g font-size="50" text-anchor="middle">
      <text x="926" y="1185">Козерог</text>
      <text x="630" y="1137">Водолей</text>
      <text x="462" y="905">Рыбы</text>
      <text x="394" y="665">Овен</text>
      <text x="478" y="437">Телец</text>
      <text x="610" y="229">Близнецы</text>
      <text x="934" y="177">Рак</text>
      <text x="1154" y="221">Лев</text>
      <text x="1366" y="441">Дева</text>
      <text x="1430" y="677">Весы</text>
      <text x="1438" y="921">Скорпион</text>
      <text x="1238" y="1105">Стрелец</text>
    </g>

    <!-- боковые подписи -->
    <text x="62" y="616" font-size="50">Горизонт</text>
    <text x="58" y="660" font-size="50">Ясны</text>

    <text x="1786" y="600" font-size="44" text-anchor="end">Или, Уровень</text>
    <text x="1794" y="636" font-size="44" text-anchor="end">Ясны</text>

    <text x="1062" y="88" font-size="44">Или, отвес Ясны</text>
    <text x="1062" y="1296" font-size="44">Столп Ясны</text>
  </g>
</svg>
