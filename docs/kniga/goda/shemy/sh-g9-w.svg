  <line x1="310" y1="1518" x2="2354" y2="1518" marker-end="url(#gw-ax)"/>
</g>

<!-- ===== круг ===== -->
<circle cx="1290" cy="1500" r="378" fill="none" stroke="var(--kn-ink,#1a1a1a)" stroke-width="7"/>

