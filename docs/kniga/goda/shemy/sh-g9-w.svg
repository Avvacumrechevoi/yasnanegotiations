  <line x1="1290" y1="1944" x2="1290" y2="2044" marker-end="url(#gw-ax)"/>
</g>

<!-- ===== ось Восток — Запад ===== -->
<g fill="none" stroke="var(--kn-ink,#1a1a1a)" stroke-width="4">
