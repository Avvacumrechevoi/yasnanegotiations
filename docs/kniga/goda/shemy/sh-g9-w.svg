<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2620 2210" width="100%" font-family="var(--kn-serif,Georgia,serif)" fill="var(--kn-ink,#1a1a1a)" role="img" aria-label="Газета и Журнал: круг с крайними путями светил, полями Газеты и Журнала, страницами и разворотами">
<defs>
  <marker id="gw-ah" viewBox="0 0 10 8" refX="9.6" refY="4" markerWidth="44" markerHeight="35" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,4 L0,8 L2.4,4 Z" fill="var(--kn-ink,#1a1a1a)" stroke="none"/>
  </marker>
  <marker id="gw-ax" viewBox="0 0 10 8" refX="9.6" refY="4" markerWidth="52" markerHeight="42" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,4 L0,8 L2.4,4 Z" fill="var(--kn-ink,#1a1a1a)" stroke="none"/>
  </marker>
</defs>

<!-- ===== крайние пути светил (пунктирные дуги) ===== -->
<g fill="none" stroke="var(--kn-ink,#1a1a1a)" stroke-width="4" stroke-dasharray="15 13">
  <path d="M947.6,1191.3 A360,360 0 1 1 1645.2,1138.8"/>
  <path d="M910.7,1876.2 A882,882 0 1 1 1628.9,1894.4"/>
</g>

<!-- ===== крайние точки: наконечники дуг ===== -->
<g fill="var(--kn-ink,#1a1a1a)" stroke="none">
  <ellipse cx="947.6" cy="1191.3" rx="33" ry="21" transform="rotate(42,947.6,1191.3)"/>
  <ellipse cx="1645.2" cy="1138.8" rx="33" ry="21" transform="rotate(134.5,1645.2,1138.8)"/>
  <ellipse cx="910.7" cy="1876.2" rx="33" ry="21" transform="rotate(-44.7,910.7,1876.2)"/>
  <ellipse cx="1628.9" cy="1894.4" rx="33" ry="21" transform="rotate(-130.7,1628.9,1894.4)"/>
</g>

<!-- ===== точки на круге ===== -->
<g fill="none" stroke="var(--kn-ink,#1a1a1a)" stroke-width="3" stroke-dasharray="5 5">
  <circle cx="990" cy="1246.8" r="18"/>
  <circle cx="1557" cy="1194" r="18"/>
  <circle cx="960" cy="1831.8" r="18"/>
  <circle cx="1530" cy="1809" r="18"/>
</g>

