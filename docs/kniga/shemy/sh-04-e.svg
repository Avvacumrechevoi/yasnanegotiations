<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="960" height="790" role="img" aria-label="Лучевая Ясна: Явный и Неявный Свет, Линия Борьбы, два кулака">
  <g fill="none" stroke="var(--kn-ink,#1a1a1a)" stroke-width="3" stroke-linecap="butt">
    <!-- 8 косых лучей (30°, 60°, 120°, 150°, 210°, 240°, 300°, 330°) -->
    <line x1="661.9" y1="295.0" x2="739.8" y2="250.0"/>
    <line x1="585.0" y1="218.1" x2="630.0" y2="140.2"/>
    <line x1="375.0" y1="218.1" x2="330.0" y2="140.2"/>
    <line x1="298.1" y1="295.0" x2="220.2" y2="250.0"/>
    <line x1="298.1" y1="505.0" x2="220.2" y2="550.0"/>
    <line x1="375.0" y1="581.9" x2="330.0" y2="659.8"/>
    <line x1="585.0" y1="581.9" x2="630.0" y2="659.8"/>
    <line x1="661.9" y1="505.0" x2="739.8" y2="550.0"/>

    <!-- верхний луч с поперечиной: Явный Свет -->
    <line x1="480" y1="220" x2="480" y2="100"/>
    <line x1="453" y1="100" x2="507" y2="100" stroke-width="5"/>

    <!-- нижний луч с поперечиной: Неявный Свет -->
    <line x1="480" y1="580" x2="480" y2="700"/>
    <line x1="453" y1="700" x2="507" y2="700" stroke-width="5"/>

    <!-- горизонталь: сплошная от засечек к кулакам -->
    <line x1="175" y1="400" x2="246" y2="400" stroke-width="2"/>
    <line x1="714" y1="400" x2="785" y2="400" stroke-width="2"/>
    <!-- засечки на горизонтали -->
    <line x1="175" y1="386" x2="175" y2="414"/>
    <line x1="785" y1="386" x2="785" y2="414"/>
    <!-- пунктирные продолжения горизонтали -->
    <line x1="175" y1="400" x2="35" y2="400" stroke-width="2" stroke-dasharray="12 10"/>
    <line x1="785" y1="400" x2="925" y2="400" stroke-width="2" stroke-dasharray="12 10"/>
    <!-- пунктир между кулаками -->
    <line x1="468" y1="400" x2="492" y2="400" stroke-width="2" stroke-dasharray="9 8"/>

    <!-- левая стрелка вверх (Линия Борьбы) -->
    <line x1="55" y1="603" x2="55" y2="452" stroke-width="2"/>
    <line x1="40" y1="603" x2="70" y2="603" stroke-width="4"/>
    <!-- правая стрелка вниз (Линия Борьбы) -->
    <line x1="905" y1="213" x2="905" y2="372" stroke-width="2"/>
  </g>
  <!-- наконечники стрелок -->
  <path d="M 55 442 L 47 464 L 55 459 L 63 464 Z" fill="var(--kn-ink,#1a1a1a)"/>
  <path d="M 905 382 L 897 360 L 905 365 L 913 360 Z" fill="var(--kn-ink,#1a1a1a)"/>

  <!-- ЛЕВЫЙ КУЛАК (костяшки вправо) -->
  <g transform="translate(459,400)">
    <g stroke="var(--kn-ink,#1a1a1a)" stroke-width="3" stroke-linejoin="round">
      <!-- рукав -->
      <path d="M -215 -40 L -104 -30 L -92 40 L -215 47 Z" fill="var(--kn-ink,#1a1a1a)" fill-opacity="0.18"/>
      <path d="M -215 33 L -95 27 L -92 40 L -215 47 Z" fill="var(--kn-ink,#1a1a1a)" fill-opacity="1" stroke="none"/>
      <!-- кисть -->
      <path d="M -104 -30 L -78 -54 L -30 -60 L -8 -48 L 8 -44 L 12 -8 L 13 24 L 7 52 L -22 63 L -60 59 L -92 40 Z"
            fill="var(--kn-ink,#1a1a1a)" fill-opacity="0.18"/>
      <!-- граница пальцев -->
      <path d="M -30 -60 L -26 -14 L -24 12 L -22 38 L -22 63" fill="none"/>
      <!-- членения пальцев -->
      <line x1="-27" y1="-14" x2="11" y2="-11"/>
      <line x1="-25" y1="12" x2="12" y2="14"/>
      <line x1="-23" y1="38" x2="9" y2="39"/>
      <!-- большой палец (тёмный клин) -->
      <path d="M -76 -34 C -60 -12, -52 14, -44 34 C -38 50, -30 60, -22 63 L -52 60 C -64 42, -72 12, -80 -22 Z"
            fill="var(--kn-ink,#1a1a1a)" fill-opacity="1" stroke="none"/>
      <path d="M -76 -34 C -60 -12, -52 14, -44 34 C -38 50, -30 60, -22 63" fill="none"/>
      <!-- складки на кисти -->
      <path d="M -96 -6 C -78 -12, -60 -10, -46 -2" fill="none" stroke-width="2"/>
      <path d="M -92 8 C -74 2, -58 4, -46 12" fill="none" stroke-width="2"/>
      <!-- ноготь на верхнем пальце -->
      <path d="M -20 -46 L -6 -46 L -6 -22 L -13 -30 L -20 -22 Z" fill="none" stroke-width="2"/>
    </g>
  </g>

  <!-- ПРАВЫЙ КУЛАК (зеркальный) -->
  <g transform="translate(501,400) scale(-1,1)">
    <g stroke="var(--kn-ink,#1a1a1a)" stroke-width="3" stroke-linejoin="round">
      <path d="M -215 -40 L -104 -30 L -92 40 L -215 47 Z" fill="var(--kn-ink,#1a1a1a)" fill-opacity="0.18"/>
      <path d="M -215 33 L -95 27 L -92 40 L -215 47 Z" fill="var(--kn-ink,#1a1a1a)" fill-opacity="1" stroke="none"/>
      <path d="M -104 -30 L -78 -54 L -30 -60 L -8 -48 L 8 -44 L 12 -8 L 13 24 L 7 52 L -22 63 L -60 59 L -92 40 Z"
            fill="var(--kn-ink,#1a1a1a)" fill-opacity="0.18"/>
      <path d="M -30 -60 L -26 -14 L -24 12 L -22 38 L -22 63" fill="none"/>
      <line x1="-27" y1="-14" x2="11" y2="-11"/>
      <line x1="-25" y1="12" x2="12" y2="14"/>
      <line x1="-23" y1="38" x2="9" y2="39"/>
      <path d="M -76 -34 C -60 -12, -52 14, -44 34 C -38 50, -30 60, -22 63 L -52 60 C -64 42, -72 12, -80 -22 Z"
            fill="var(--kn-ink,#1a1a1a)" fill-opacity="1" stroke="none"/>
      <path d="M -76 -34 C -60 -12, -52 14, -44 34 C -38 50, -30 60, -22 63" fill="none"/>
      <path d="M -96 -6 C -78 -12, -60 -10, -46 -2" fill="none" stroke-width="2"/>
      <path d="M -92 8 C -74 2, -58 4, -46 12" fill="none" stroke-width="2"/>
      <path d="M -20 -46 L -6 -46 L -6 -22 L -13 -30 L -20 -22 Z" fill="none" stroke-width="2"/>
    </g>
  </g>

  <!-- ПОДПИСИ -->
  <g fill="var(--kn-ink,#1a1a1a)" font-family="var(--kn-serif,Georgia,serif)" font-size="27">
    <text x="480" y="64" text-anchor="middle">Явный Свет</text>
    <text x="480" y="750" text-anchor="middle">Неявный Свет</text>
    <text x="925" y="196" text-anchor="end">Линия Борьбы</text>
    <text x="18" y="640" text-anchor="start">Линия Борьбы</text>
  </g>
  <g fill="var(--kn-ink,#1a1a1a)" font-family="var(--kn-serif,Georgia,serif)" font-size="23">
    <text x="127" y="392" text-anchor="middle">Выход</text>
    <text x="127" y="422" text-anchor="middle">Солнца</text>
    <text x="837" y="392" text-anchor="middle">Заход</text>
    <text x="837" y="422" text-anchor="middle">Солнца</text>
  </g>
</svg>
