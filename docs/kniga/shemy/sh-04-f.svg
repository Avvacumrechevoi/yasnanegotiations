<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 840" width="980" height="840" role="img" aria-label="Двенадцать времён суток: спад и рост тьмы, песочные часы в середине">
  <g fill="none" stroke="var(--kn-ink,#1a1a1a)" stroke-width="2.6" stroke-linecap="butt">
    <!-- лучи 60°: Последняя Тьма, Первая Тьма, Первый Свет, Последний Свет -->
    <line x1="420" y1="308.8" x2="334" y2="159.8"/>
    <line x1="560" y1="308.8" x2="646" y2="159.8"/>
    <line x1="420" y1="551.2" x2="334" y2="700.2"/>
    <line x1="560" y1="551.2" x2="646" y2="700.2"/>

    <!-- лучи 30°, разорванные подписями «Спад Тьмы» / «Рост Тьмы» -->
    <line x1="372.2" y1="362" x2="308.1" y2="325"/>
    <line x1="238.9" y1="285" x2="199" y2="262"/>
    <line x1="607.8" y1="362" x2="671.9" y2="325"/>
    <line x1="741.1" y1="285" x2="781" y2="262"/>
    <line x1="372.2" y1="498" x2="308.1" y2="535"/>
    <line x1="238.9" y1="575" x2="199" y2="598"/>
    <line x1="607.8" y1="498" x2="671.9" y2="535"/>
    <line x1="741.1" y1="575" x2="781" y2="598"/>

    <!-- вертикальные лучи с поперечинами -->
    <line x1="490" y1="334" x2="490" y2="84"/>
    <line x1="462" y1="84" x2="518" y2="84" stroke-width="4"/>
    <line x1="490" y1="564" x2="490" y2="770"/>
    <line x1="462" y1="770" x2="518" y2="770" stroke-width="4"/>

    <!-- горизонталь: пунктир от часов и засечки восхода/захода -->
    <line x1="436" y1="430" x2="300" y2="430" stroke-width="2" stroke-dasharray="11 9"/>
    <line x1="544" y1="430" x2="680" y2="430" stroke-width="2" stroke-dasharray="11 9"/>
    <line x1="145" y1="418" x2="145" y2="442"/>
    <line x1="835" y1="418" x2="835" y2="442"/>
  </g>

  <!-- ПЕСОЧНЫЕ ЧАСЫ -->
  <g transform="translate(490,430)" stroke="var(--kn-ink,#1a1a1a)" stroke-width="2.6" stroke-linejoin="round">
    <!-- стекло -->
    <path d="M -30 -80 C -36 -76, -35 -44, -18 -20 C -10 -10, -6 -6, -4 -3 L 4 -3 C 6 -6, 10 -10, 18 -20 C 35 -44, 36 -76, 30 -80 Z" fill="none"/>
    <path d="M -4 3 C -6 6, -10 10, -18 20 C -35 44, -36 76, -30 80 L 30 80 C 36 76, 35 44, 18 20 C 10 10, 6 6, 4 3 Z" fill="none"/>
    <!-- песок в верхней колбе -->
    <path d="M -26 -42 C -12 -34, 12 -34, 26 -42 L 4 -3 L -4 -3 Z" fill="var(--kn-ink,#1a1a1a)" stroke="none"/>
    <path d="M -26 -42 C -12 -34, 12 -34, 26 -42" fill="none" stroke-width="2"/>
    <!-- струйка песка -->
    <line x1="0" y1="8" x2="2" y2="52" stroke-width="1.6"/>
    <!-- песок в нижней колбе -->
    <path d="M -29 80 C -28 60, -8 50, 10 54 C 24 58, 29 70, 29 80 Z" fill="var(--kn-ink,#1a1a1a)" stroke="none"/>
    <path d="M -29 80 C -28 60, -8 50, 10 54 C 24 58, 29 70, 29 80" fill="none" stroke-width="2"/>
    <!-- горловина -->
    <ellipse cx="0" cy="0" rx="9" ry="5" fill="var(--kn-ink,#1a1a1a)" fill-opacity="0.25"/>
    <!-- стойки -->
    <path d="M -44 -84 C -38 -50, -38 50, -44 84 L -34 84 C -40 50, -40 -50, -34 -84 Z" fill="var(--kn-ink,#1a1a1a)" fill-opacity="0.85"/>
    <path d="M 44 -84 C 38 -50, 38 50, 44 84 L 34 84 C 40 50, 40 -50, 34 -84 Z" fill="var(--kn-ink,#1a1a1a)" fill-opacity="0.85"/>
    <!-- перехваты на стойках -->
    <g stroke-width="2">
      <line x1="-45" y1="-8" x2="-33" y2="-8"/><line x1="-45" y1="0" x2="-33" y2="0"/><line x1="-45" y1="8" x2="-33" y2="8"/>
      <line x1="33" y1="-8" x2="45" y2="-8"/><line x1="33" y1="0" x2="45" y2="0"/><line x1="33" y1="8" x2="45" y2="8"/>
    </g>
    <!-- верхняя и нижняя перекладины -->
    <rect x="-56" y="-104" width="112" height="22" rx="11" fill="var(--kn-ink,#1a1a1a)" fill-opacity="0.18"/>
    <rect x="-56" y="82" width="112" height="22" rx="11" fill="var(--kn-ink,#1a1a1a)" fill-opacity="0.18"/>
    <path d="M 34 -104 L 56 -104 A 11 11 0 0 1 56 -82 L 34 -82 Z" fill="var(--kn-ink,#1a1a1a)" stroke="none"/>
    <path d="M 34 82 L 56 82 A 11 11 0 0 1 56 104 L 34 104 Z" fill="var(--kn-ink,#1a1a1a)" stroke="none"/>
    <g stroke-width="1.6">
      <line x1="-40" y1="-97" x2="30" y2="-97"/><line x1="-40" y1="-89" x2="30" y2="-89"/>
      <line x1="-40" y1="89" x2="30" y2="89"/><line x1="-40" y1="97" x2="30" y2="97"/>
    </g>
  </g>

  <!-- ИМЕНА ВРЕМЁН (12) -->
  <g fill="var(--kn-ink,#1a1a1a)" font-family="var(--kn-serif,Georgia,serif)" font-size="23" text-anchor="middle">
    <text x="490" y="40">Дневной</text>
    <text x="490" y="66">Переход</text>
    <text x="712" y="130">Первая</text>
    <text x="712" y="156">Тьма</text>
    <text x="268" y="130">Последняя</text>
    <text x="268" y="156">Тьма</text>
    <text x="855" y="250">Закат</text>
    <text x="855" y="276">Солнца</text>
    <text x="125" y="250">Восход</text>
    <text x="125" y="276">Солнца</text>
    <text x="860" y="600">Вечерние</text>
    <text x="860" y="626">Сумерки</text>
    <text x="120" y="600">Утренняя</text>
    <text x="120" y="626">Заря</text>
    <text x="712" y="748">Последний Свет</text>
    <text x="268" y="748">Первый Свет</text>
    <text x="490" y="806">Тьма Ночи</text>
  </g>

  <!-- ПОДПИСИ НА ЛУЧАХ И ГОРИЗОНТАЛИ (6) -->
  <g fill="var(--kn-ink,#1a1a1a)" font-family="var(--kn-serif,Georgia,serif)" font-size="20" text-anchor="middle">
    <text x="274" y="299">Спад</text>
    <text x="274" y="321">Тьмы</text>
    <text x="274" y="549">Спад</text>
    <text x="274" y="571">Тьмы</text>
    <text x="706" y="299">Рост</text>
    <text x="706" y="321">Тьмы</text>
    <text x="706" y="549">Рост</text>
    <text x="706" y="571">Тьмы</text>
    <text x="228" y="424">Проявление</text>
    <text x="228" y="448">Света</text>
    <text x="752" y="424">Проявление</text>
    <text x="752" y="448">Тьмы</text>
    <text x="80" y="424">Выход</text>
    <text x="80" y="448">Солнца</text>
    <text x="900" y="424">Заход</text>
    <text x="900" y="448">Солнца</text>
  </g>
</svg>
