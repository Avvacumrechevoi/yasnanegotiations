<!-- Тема оформления: применяем сохранённый выбор ДО отрисовки (без мигания).
     Класс на body больше не переключаем — цвет держат роли и html[data-theme].
     color-scheme выставляем явно, чтобы браузер в системном тёмном НЕ перекрашивал
     светлую страницу принудительно (force-dark делал текст серым). -->
<script>try{var m=localStorage.getItem('yasna_theme')||'auto';var d=m==='dark'||(m==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){}</script>

<!-- Three.js — после первой отрисовки или по первому действию: экрану Игр он
     не нужен ни разу, но пусть будет под рукой, если игра его попросит.
     window.YasnaБиблиотеки.нужна('three') — точка, за которую можно
     зацепиться из бандла. -->
<script>
(function(){
  var АДРЕСА = { three: 'vendor/js/three-r128.min.js' };
  var начатые = {};
  function нужна(имя){
    if(начатые[имя]) return начатые[имя];
    начатые[имя] = new Promise(function(готово){
      var s = document.createElement('script');
      s.src = АДРЕСА[имя];
      s.async = true;
      s.onload  = function(){ готово(true); };
      s.onerror = function(){ готово(false); };
      document.head.appendChild(s);
    });
    return начатые[имя];
  }
  window.YasnaБиблиотеки = { нужна: нужна };

  var СОБЫТИЯ = ['pointerdown','keydown','wheel','touchstart'];
  var поднято = false;
  function поднять(){
    if(поднято) return;
    поднято = true;
    СОБЫТИЯ.forEach(function(с){ window.removeEventListener(с, поднять, true); });
    нужна('three');
  }
  СОБЫТИЯ.forEach(function(с){ window.addEventListener(с, поднять, true); });
  function потом(){
    if(window.requestIdleCallback) requestIdleCallback(поднять, { timeout: 1500 });
    else setTimeout(поднять, 300);
  }
  if(document.readyState === 'complete') потом();
  else window.addEventListener('load', потом);
})();
</script>
