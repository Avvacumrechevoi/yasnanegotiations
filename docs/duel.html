<body class="theme-vk-dark vk-light">
<!-- Тема оформления: применяем сохранённый выбор ДО отрисовки (без мигания).
     Светлая по умолчанию (vk-light); '1' в localStorage → тёмная (снимаем vk-light).
     color-scheme выставляем явно, чтобы браузер в системном тёмном НЕ перекрашивал
     светлую страницу принудительно (force-dark делал текст серым). -->
<script>try{var m=localStorage.getItem('yasna_theme')||'auto';var d=m==='dark'||(m==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');document.documentElement.style.colorScheme=d?'dark':'light';document.body.classList.toggle('vk-light',!d);}catch(e){}</script>
