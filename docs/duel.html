<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="yandex" content="noindex, nofollow"/>
<!-- Единая тема (core/theme.js, ключ yasna_theme): html[data-theme] и роли из
     tokeny.css. Адаптер с классом vk-light убран — цвет больше не собирается
     из трёх слоёв, светлая и тёмная берутся из одних и тех же ролей. -->
<!-- Замок: подключён ПЕРВЫМ, до всего остального (см. core/gate.js) -->
<script src="core/gate.js"></script>
<script src="core/theme.js?v=86eb1366"></script>
<script src="core/storage.js?v=529ec80c"></script>
<script src="core/access.js?v=4ed1e962"></script>
<script src="core/account.js?v=19915f6a"></script>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes,viewport-fit=cover"/>
<!-- Приложение: манифест, иконки и цвет строки состояния. Раньше манифест
     висел на двух страницах из девяти, иконка была одна — SVG в data-URI, а
     theme-color на каждой странице свой: на светлых страницах стояла почти
     чёрная полоса. Теперь одинаково везде, и по теме смотрящего. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0071e3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ясна">
<script defer src="core/pwa.js"></script>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>Игра по Ясне</title>
<meta name="description" content="Игра по Ясне — Партия из 18 вопросов с соперником Тенью. Тренируй память, собирай бусины, поднимайся по ступеням."/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="Игра по Ясне"/>
<meta property="og:description" content="Партия из 18 вопросов · 6 тем · соперник Тень. Бусины, ступени, Архив недели."/>
<meta property="og:url" content="https://yasnalab.ru/duel.html"/>
<meta name="twitter:card" content="summary"/>

<!-- API config через meta — позволяет инжектить через CI/sed без правки исходников. -->
<meta name="yasna:api"    content="https://d5dmdje8c5mk8811il5j.iwzqm34r.apigw.yandexcloud.net"/>
<meta name="yasna:tg-bot" content="YasnaDuelBot"/>

<!-- Роли цвета, шкала типа и движение: один файл на сайт и приложение. Подключён ПЕРВЫМ из стилей — он только объявляет переменные и ничего не перебивает. -->
<link rel="stylesheet" href="core/tokeny.css">
<!-- styles.css нужен ради общих узлов, которые рисует ядро: шторка (.sht-*),
     досье места (.dos-*), круг. Собственно экран Игр — один файл ниже.
     Было семь таблиц на 389 КБ, и три из них перекрашивали друг друга.
     Гарнитуры больше не отдельной ссылкой: их подтягивает tokeny.css. -->
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="games/duel/duel-page.css?v=d3fbd5c2"/>
<link rel="stylesheet" href="core/site-nav.css?v=52aebf72"/>
</head>
<!-- .igra — область действия компонентного CSS экрана, а не тема: тему держит
     html[data-theme]. Без этого класса правила экрана доставали бы до
     admin.html, который грузит тот же файл. -->
<body class="igra">
<!-- Тема оформления: применяем сохранённый выбор ДО отрисовки (без мигания).
     Класс на body больше не переключаем — цвет держат роли и html[data-theme].
     color-scheme выставляем явно, чтобы браузер в системном тёмном НЕ перекрашивал
     светлую страницу принудительно (force-dark делал текст серым). -->
<script>try{var m=localStorage.getItem('yasna_theme')||'auto';var d=m==='dark'||(m==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){}</script>
<div id="duel-page-root"></div>

<!-- React + Three.js + Firebase из CDN -->
<script src="vendor/js/react-18.2.0.min.js"></script>
<script src="vendor/js/react-dom-18.2.0.min.js"></script>
<script src="vendor/js/three-r128.min.js"></script>
<!-- Firebase compat-сборки: глобальный объект `firebase`, классические script-теги -->
<script src="vendor/js/firebase-app-compat-10.13.2.js"></script>
<script src="vendor/js/firebase-auth-compat-10.13.2.js"></script>
<script src="vendor/js/firebase-database-compat-10.13.2.js"></script>

<script>
  (function(){
    var m = function(n){ var el = document.querySelector('meta[name="yasna:'+n+'"]'); return el ? el.getAttribute('content') : ''; };
    window.YASNA_LEADERBOARD_API = m('api') || '';
    window.YASNA_TG_BOT = m('tg-bot') || '';
  })();
</script>

<!-- Pre-built bundle: core/* + games/duel/* + duel-page (см. scripts/build.mjs) -->
<!-- Cache-busting: меняй версию при каждом релизе чтобы CDN отдавал свежий файл -->
<script src="dist/duel.min.js?v=d5cb075b"></script>
</body>
</html>
