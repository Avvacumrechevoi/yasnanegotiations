<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Профиль · Ясна</title>
<!--
  ПРОФИЛЬ — единственное место авторизации в приложении.
  Правило простое: игры и уроки не спрашивают ничего и работают сразу
  (гость создаётся при первом запуске автоматически); всё, что касается
  личности, собрано здесь — имя и зверь для Партии, вход по почте, выход.
  Пишет в те же ключи, что и сайт: yasna_duel_profile (nickname, avatar,
  deviceId — deviceId НЕ трогаем, это ключ к прогрессу).
-->
<link rel="stylesheet" href="vendor/fonts/shrifty.css">
<style>
  :root{
    --syn:#0071e3; --syn-t:#0B57C0;
    --fon:#f5f6f8; --kart:#ffffff;
    --ink:#101418; --ink-2:#5c6570; --kayma:rgba(16,20,24,.1);
    --pole:#eef1f5;
    --sverhu: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
    --snizu:  var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  }
  @media (prefers-color-scheme: dark){
    :root{
      --fon:#101214; --kart:#1a1d21;
      --ink:#e8ebee; --ink-2:#9aa3ad; --kayma:rgba(232,235,238,.12);
      --pole:#24282d;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--fon);color:var(--ink);
    font:400 16px/1.5 Inter,system-ui,-apple-system,sans-serif;
    padding-top:var(--sverhu)}
  header{padding:16px 20px 4px}
  header h1{font:600 24px/1.2 Manrope,Inter,sans-serif;margin:0}
  header .pod{font-size:13px;color:var(--ink-2);margin-top:3px}
  main{padding:10px 16px calc(84px + var(--snizu))}
  .kart{background:var(--kart);border:1px solid var(--kayma);border-radius:18px;
    padding:18px;margin:12px 0 0}
  .kart h2{font:600 12.5px/1 Manrope,sans-serif;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink-2);margin:0 0 14px}

  /* имя и зверь */
  label{display:block;font:600 13px/1 Manrope,sans-serif;color:var(--ink-2);
    margin:0 0 7px}
  input[type=text]{width:100%;font:400 17px/1.3 Inter,sans-serif;color:var(--ink);
    background:var(--pole);border:1.5px solid transparent;border-radius:12px;
    padding:13px 14px;outline:none}
  input[type=text]:focus{border-color:var(--syn)}
  .zveri{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
  .zver{width:46px;height:46px;border-radius:50%;border:2px solid transparent;
    background:var(--pole);font-size:24px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;padding:0}
  .zver.vybran{border-color:var(--syn);background:transparent}
  .knopka{display:block;width:100%;font:600 16px/1 Manrope,Inter,sans-serif;
    color:#fff;background:var(--syn);border:0;border-radius:12px;
    padding:15px;margin:16px 0 0;cursor:pointer;text-align:center;
    text-decoration:none}
  .knopka:active{filter:brightness(.92)}
  .knopka--tihaya{background:transparent;color:var(--syn);
    border:1.5px solid var(--kayma)}
  .soobshenie{font-size:13.5px;color:var(--syn);margin:10px 0 0;min-height:1.2em}
  .opis{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin:8px 0 0}
  .vhod-status{display:flex;align-items:center;gap:10px;font-size:15px}
  .versiya{text-align:center;color:var(--ink-2);font-size:12px;margin:26px 0 0}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:900;background:var(--kart);
    border-top:1px solid var(--kayma);padding:6px 6px calc(6px + var(--snizu));
    display:flex}
  nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;text-decoration:none;color:var(--ink-2);
    font:500 10.5px/1 Manrope,Inter,sans-serif;border-radius:12px;min-height:48px;
    justify-content:center}
  nav a svg{width:23px;height:23px;stroke:currentColor;fill:none;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  nav a.tut{color:var(--syn)}
</style>
</head>
<body>

<header>
  <h1>Профиль</h1>
  <div class="pod">имя и зверь увидят соперники в игре</div>
</header>

<main>
  <section class="kart">
    <h2>Как вас называть</h2>
    <label for="imya">Имя</label>
    <input type="text" id="imya" maxlength="20" autocomplete="nickname" placeholder="Например, Иван">
    <div class="zveri" id="zveri" role="radiogroup" aria-label="Зверь-аватар"></div>
    <button class="knopka" id="sohranit" type="button">Сохранить</button>
    <div class="soobshenie" id="soobshenie" role="status"></div>
  </section>

  <section class="kart">
    <h2>Вход по почте</h2>
    <div class="vhod-status" id="vhod-status"></div>
    <p class="opis" id="vhod-opis"></p>
    <a class="knopka" id="vhod-knopka" href="duel.html#login">Войти по почте</a>
    <button class="knopka knopka--tihaya" id="vyhod" type="button" hidden>Выйти</button>
  </section>

  <div class="versiya">Ясна для Android · 1.6</div>
</main>

<nav aria-label="Разделы">
  <a href="index.html">
    <svg viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2M6 9.8V20h12V9.8"/></svg>
    Главная
  </a>
  <a href="duel.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.5v4.5l3 2.2"/></svg>
    Игра
  </a>
  <a href="learn.html">
    <svg viewBox="0 0 24 24"><path d="M12 4 2.8 8.4 12 12.8l9.2-4.4zM6 10.6V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-5.4"/></svg>
    Уроки
  </a>
  <a href="konstruktor.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 3.4v17.2M3.4 12h17.2"/></svg>
    Разбор
  </a>
  <a class="tut" href="profil.html" aria-current="page">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>
    Профиль
  </a>
</nav>

<script>
(function(){
  var КЛЮЧ='yasna_duel_profile';
  var ЗВЕРИ=['🦊','🐺','🦁','🐯','🐻','🐼','🦉','🦅','🐉','🦄','⚔️','🎯'];

  function профиль(){
    try{ return JSON.parse(localStorage.getItem(КЛЮЧ))||{} }catch(e){ return {} }
  }

  var п=профиль();
  var выбран=п.avatar||ЗВЕРИ[0];
  document.getElementById('imya').value=(п.nickname==='Гость'?'':п.nickname)||'';

  var ряд=document.getElementById('zveri');
  ЗВЕРИ.forEach(function(з){
    var b=document.createElement('button');
    b.type='button'; b.className='zver'+(з===выбран?' vybran':''); b.textContent=з;
    b.setAttribute('role','radio');
    b.setAttribute('aria-checked', з===выбран?'true':'false');
    b.onclick=function(){
      выбран=з;
      ряд.querySelectorAll('.zver').forEach(function(x){
        x.classList.toggle('vybran',x.textContent===з);
        x.setAttribute('aria-checked',x.textContent===з?'true':'false');
      });
    };
    ряд.appendChild(b);
  });

  document.getElementById('sohranit').onclick=function(){
    var имя=(document.getElementById('imya').value||'').trim().slice(0,20)||'Гость';
    var п=профиль();
    /* deviceId сохраняем как есть: это ключ к накопленному прогрессу. */
    п.nickname=имя; п.avatar=выбран;
    if(!п.deviceId){
      п.deviceId=localStorage.getItem('yasna_device_id_v1')
        ||((window.crypto&&crypto.randomUUID)?crypto.randomUUID():'dev-'+Date.now());
    }
    try{ localStorage.setItem(КЛЮЧ,JSON.stringify(п));
      document.getElementById('soobshenie').textContent='Сохранено: '+выбран+' '+имя;
    }catch(e){
      document.getElementById('soobshenie').textContent='Не удалось сохранить.';
    }
  };

  /* Статус входа. Токен и пользователь — те же ключи, что на сайте. */
  var статус=document.getElementById('vhod-status');
  var опис=document.getElementById('vhod-opis');
  var кнВход=document.getElementById('vhod-knopka');
  var кнВыход=document.getElementById('vyhod');
  function показатьВход(){
    var польз=null;
    try{ польз=JSON.parse(localStorage.getItem('yasna_duel_user')) }catch(e){}
    var есть=!!localStorage.getItem('yasna_duel_token');
    if(есть&&польз){
      статус.textContent='✓ Вы вошли: '+(польз.name||польз.email||'аккаунт');
      опис.textContent='Прогресс привязан к почте и переживёт переустановку приложения.';
      кнВход.hidden=true; кнВыход.hidden=false;
    } else {
      статус.textContent='Вы играете гостем.';
      опис.textContent='Вход по почте привязывает прогресс к вам: он переживёт '+
        'переустановку и откроется на любом устройстве. Письмо придёт с кодом — пароля нет.';
      кнВход.hidden=false; кнВыход.hidden=true;
    }
  }
  кнВыход.onclick=function(){
    try{ localStorage.removeItem('yasna_duel_token');
         localStorage.removeItem('yasna_duel_user'); }catch(e){}
    показатьВход();
  };
  показатьВход();
})();
</script>
<script defer src="pribavka.js"></script>
</body>
</html>
