<!--
  «СЕГОДНЯ» — первая вкладка приложения. Заменяет собой index.html сайта
  при сборке www/ (см. sobrat-vitrinu.mjs).

  ЧЕМ ЭТОТ ЭКРАН ОТЛИЧАЕТСЯ ОТ ВКЛАДОК. Раньше здесь стояла витрина из
  13–19 дверей, и каждая вела туда же, куда наббар в десяти пикселях ниже:
  «Игры по Ясне», «Обучение», «Всё обучение одним списком», «Дальше»,
  «Видео · Разборы» — четыре имени одного экрана «Уроки». Человек не мог
  ответить, зачем ему главная, если внизу и так пять вкладок.

  Правило теперь одно: на «Сегодня» нет ссылок на вкладку как таковую.
  Здесь живёт только то, чего во вкладках нет, — что делать ПРЯМО СЕЙЧАС:
    1. одно дело: «Продолжить: <занятие>» — первое незаконченное занятие
       по дереву (YasnaZnanie.продолжить(), тот же источник, что и на
       экране «Уроки»: два экрана не должны звать в разные места);
    2. цитата дня — дословная строка учебника (citaty.js); тап открывает
       ГЛАВУ КНИГИ, в которой эта запись стоит (раньше вёл в Разбор на
       пустой круг — обещание «посмотреть, из чего сложено» не сбывалось);
    3. «Тренировка» — три строки со своим счётом: Разложи по кругу,
       Переговоры, Партия. Ноль не печатаем никогда: у кого счёта ещё нет,
       строка говорит, что внутри;
    4. «Лента» — одна строка-дверь в записи открытых каналов управлений
       (lenta.html), и стоит она ТОЛЬКО когда есть непрочитанное: число
       новых считает сервер от последней увиденной записи (core/lenta.js,
       свежее()). Нет нового, нет сети, сервер молчит — раздела нет вовсе:
       дверь без числа была бы ссылкой на дочерний экран Библиотеки, а
       таким на «Сегодня» не место.
  Целей на экране пять, с непрочитанным в ленте — шесть. Профиль — аватар в общей шапке (navigatsiya.js),
  своей карточки здесь у него нет; шапку и наббар рисует оболочка.

  Вёрстка нарочно простая: обычный поток, без вложенного скролла и
  backdrop-filter — они рисовали «призраков» в WebView.
-->
<!-- ═══ Заставка приложения ═══════════════════════════════════════════
     Продолжение системной: тот же фон, тот же знак. Двенадцать лучей
     зажигаются по кругу — как круг Ясны собирается из частей, — и заставка
     растворяется. Показывается ОДИН раз за запуск (sessionStorage живёт,
     пока жив WebView), иначе мелькала бы при каждом возврате на главную
     по наббару. Разметка и стили встроены сюда намеренно: внешний файл
     подъехал бы позже первого кадра, и человек увидел бы пустой экран. -->

     карточки со сценой: у всех трёх дверей одно и то же дело — открыть

  <script>

      <span class="o" id="sejchas-o">Метод Ясны · 5 минут</span>
    </span>
    <span class="shevron" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M9 5.5 15.5 12 9 18.5"/></svg>
    </span>
  </a>

  <!-- ЦИТАТА ДНЯ — дословная строка учебника (citaty.js), та же, что уходит
       утренним уведомлением. Адрес ставит скрипт: по номеру записи находим
       главу и открываем книгу на ней. -->
  <a class="citata" id="citata" href="kniga.html">
    <svg class="znak-vod" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.6l2.2 6.3 6.3 2.1-6.3 2.1-2.2 6.3-2.2-6.3-6.3-2.1 6.3-2.1z"/></svg>
    <span class="k">Цитата дня</span>
    <div class="tx">«Мир — управляемый страх»</div>
    <div class="niz"><span class="ot"></span><span class="ist">Ясна Суток ›</span></div>
  </a>

  <h2>Тренировка</h2>
  <!-- Три двери, и все три ведут в дело, а не в раздел. Подписи ставит
       скрипт: есть свой счёт — говорим счёт, нет — говорим, что внутри. -->
  <div class="spisok">
    <a href="games/krug/index.html">
      <span class="ik" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 3.4v17.2M3.4 12h17.2"/></svg>
      </span>
      <span>Разложи по кругу<small id="tr-krug">шестнадцать явлений на выбор</small></span>
      <svg class="shevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5 15.5 12 9 18.5"/></svg>
    </a>
    <a href="negotiations.html">
      <span class="ik" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 6.5h16v9H9.5L5.5 19v-3.5H4z"/></svg>
      </span>
      <span>Переговоры<small id="tr-neg">четыре сценария разговора</small></span>
      <svg class="shevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5 15.5 12 9 18.5"/></svg>
    </a>
    <a href="duel.html">
      <span class="ik" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3.4l2.4 6.2 6.2 2.4-6.2 2.4-2.4 6.2-2.4-6.2L3.4 12l6.2-2.4z"/></svg>
      </span>
      <span>Партия<small id="tr-duel">вопросы на темы Ясны</small></span>
      <svg class="shevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5 15.5 12 9 18.5"/></svg>
    </a>
  </div>

  <!-- ЛЕНТА УПРАВЛЕНИЙ — дверь только при непрочитанном. Раздел стоит
       скрытым и открывается скриптом, когда свежее() насчитало хотя бы одну
       новую запись; число и подпись ставит он же. Та же строка списка, что
       у тренировок: одно дело — открыть ленту и прочитать новое. -->
  <section id="lenta-razdel" hidden>
    <h2>Лента</h2>
    <div class="spisok">
      <a href="lenta.html?otkuda=segodnya" id="lenta-dver">
        <span class="ik" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 12.5 20 5l-3.2 14L11 15.6zM11 15.6 9.8 19"/></svg>
        </span>
        <span>Свежее от управлений<small id="lenta-o">Телеграм и Rutube</small></span>
        <svg class="shevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5 15.5 12 9 18.5"/></svg>
      </a>
    </div>
  </section>
</main>


<script src="citaty.js"></script>
<script src="obnovlenie.js"></script>
<!-- Лента управлений: транспорт к серверу, данные управлений (имена и
     эмблемы для модуля ленты) и сам модуль — тот же набор, что у экрана
     lenta.html, чтобы «N новых» считалось одним кодом на обоих экранах. -->
<script src="core/svyaz.js"></script>
<script src="core/upravleniya-dannye.js"></script>
<script src="core/lenta.js"></script>
<script>
(function(){
  function читать(ключ){
    try{ return JSON.parse(localStorage.getItem(ключ)) }catch(e){ return null }
  }
  function текст(ид,зн){ var э=document.getElementById(ид); if(э) э.textContent=зн; }
  function склонение(н,один,два,много){
    return (н%10===1&&н%100!==11) ? один
         : ([2,3,4].indexOf(н%10)>-1&&[12,13,14].indexOf(н%100)===-1) ? два : много;
  }

  /* ── СЕЙЧАС: одно дело ─────────────────────────────────────────────────
     Раньше здесь стояли две карточки — «Игры по Ясне» и «Обучение», — и обе
     вели на вкладку наббара, а карточка «Обучение» обещала «пять минут — и
     первый урок пройден», открывая каталог из десятков узлов. Теперь ссылка
     ведёт в САМО ЗАНЯТИЕ, а имя занятия и его объём человек читает до
     нажатия. Источник один с экраном «Уроки»: YasnaZnanie.продолжить(). */
  function адресЗанятия(а){
    а=String(а||'');
    /* Урок теперь свой экран. В дереве ещё стоит старый адрес
       konstruktor.html?lesson=…: в приложении он переадресуется, но лишней
       загрузкой всего Разбора — пишем сразу новый. Метка otkuda нужна не
       живому переходу (его помнит оболочка), а холодному запуску по ссылке. */
    var м=/[?&]lesson=([^&#]+)/.exec(а);
    if(м) return 'lesson.html?lesson='+м[1]+'&otkuda=index.html';
    /* Якорь без файла — знакомство: оно живёт на экране «Уроки». */
    if(а.charAt(0)==='#') return 'learn.html'+а;
    return а;
  }
  try{ (function(){
    var к=document.getElementById('sejchas'); if(!к) return;
    var п=null;
    try{ if(window.YasnaZnanie && window.YasnaZnanie.продолжить) п=window.YasnaZnanie.продолжить(); }catch(e){}
    var у=п&&п.узел;
    if(!у||!у.адрес){
      /* Дерево не доехало или пройдено всё написанное. Ставим дверь в дерево
         и говорим ровно то, что посчитано, — общего процента здесь нет. */
      var сч=null;
      try{ if(window.YasnaZnanie && window.YasnaZnanie.счёт) сч=window.YasnaZnanie.счёт(); }catch(e){}
      текст('sejchas-k','Уроки');
      текст('sejchas-t','Дерево знаний');
      текст('sejchas-o', (сч&&сч.всего&&сч.пройдено>=сч.всего)
        ? 'пройдено '+сч.пройдено+' из '+сч.всего+' написанных'
        : 'занятия по всем явлениям');
      к.setAttribute('href','learn.html');
      return;
    }
    текст('sejchas-k', (п.состояние&&п.состояние.код==='начато') ? 'Продолжить' : 'Начать');
    текст('sejchas-t', у.имя);
    текст('sejchas-o', [у.ветвьИмя, у.жанр, у.объём].filter(Boolean).join(' · '));
    к.setAttribute('href', адресЗанятия(у.адрес));
  })(); }catch(__е){ try{console.error("секция главной:",__е)}catch(_){}}

  /* ── ТРЕНИРОВКА ────────────────────────────────────────────────────────
     Правило то же, что было у виджетов: показываем только посчитанное.
     Нет своего счёта — строка говорит, что внутри, а не печатает ноль:
     ноль на первом экране читается как упрёк, а не как приглашение. */
  try{ (function(){
    /* Круг: ключ игры (games/krug/krug.js) — {v,games,best}; в best лежат
       ясны, которые человек уже раскладывал. Всего их 16 — столько же, как
       на экране Круга (6 из уроков + 10 из корпуса). */
    var кр=читать('yasna_krug_v1')||{}, разобрано=0;
    try{ разобрано=Object.keys(кр.best||{}).length; }catch(e){}
    if(разобрано>0) текст('tr-krug', разобрано+' из 16 явлений разобрано');

    var нег=читать('yasna_neg_lessons_v1'), сцен=0;
    try{ сцен=Array.isArray(нег)?нег.length:Object.keys(нег||{}).length; }catch(e){}
    if(сцен>0) текст('tr-neg', сцен+' из 4 сценариев просмотрено');

    var д=читать('yasna_duel_data')||{};
    var партий=(д.totals&&д.totals.played)||0;
    if(партий>0) текст('tr-duel', партий+' '+склонение(партий,'партия','партии','партий')+' сыграно');
  })(); }catch(__е){ try{console.error("секция главной:",__е)}catch(_){}}

  /* ── ЛЕНТА УПРАВЛЕНИЙ: дверь только при непрочитанном ─────────────────
     Число новых считает сервер от последней увиденной записи (метку ставит
     экран ленты); без сети модуль считает по своему кэшу и не бросает.
     Правило одно: novyh ≥ 1 — раздел виден с числом, иначе раздела нет.
     Проверяем при открытии, при возврате из bfcache (тогда счёт в памяти
     модуля устарел — экран ленты уже сдвинул метку) и при возвращении
     приложения на экран; модуль сам не ходит в сеть чаще раза в 5 минут. */
  try{ (function(){
    var раздел=document.getElementById('lenta-razdel'), дверь=document.getElementById('lenta-dver');
    var Л=window.YasnaLenta;
    if(!раздел||!дверь||!Л||typeof Л.свежее!=='function') return;
    function показать(н){
      н=Number(н)||0;
      if(н<1){ раздел.hidden=true; return; }
      var сколько=н+' '+склонение(н,'новая запись','новые записи','новых записей');
      текст('lenta-o', сколько+' · Телеграм и Rutube');
      дверь.setAttribute('aria-label','Лента управлений: '+сколько+', Телеграм и Rutube');
      раздел.hidden=false;
    }
    function проверить(){
      var п=null;
      try{ п=Л.свежее(); }catch(e){ return; }
      if(!п||typeof п.then!=='function') return;
      п.then(function(о){ показать(о&&о.novyh); }, function(){});
    }
    проверить();
    window.addEventListener('pageshow', function(e){
      if(!e.persisted) return;
      try{ if(typeof Л.забытьСвежее==='function') Л.забытьСвежее(); }catch(_){}
      проверить();
    });
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) проверить(); });
  })(); }catch(__е){ try{console.error("секция главной:",__е)}catch(_){}}

  /* ── ЦИТАТА ДНЯ ────────────────────────────────────────────────────────
     Дословная строка книги (citaty.js); та же, что уходит утренним
     уведомлением. Ротация по дню года живёт в citaty.js; если файл не
     доехал или пуст, стоит запасная строка — карточка не должна встречать
     человека пустотой.

     Куда ведёт. Прежде — в Разбор на пустой круг: карточка обещала
     «посмотреть, из чего это сложено», и не выполняла обещание. Теперь в
     учебник, на главу, где эта запись стоит. Номер записи есть в самой
     цитате, границы глав — в описи книги (kniga/opis.js), так что номера
     глав здесь не повторяются и разойтись с книгой не могут. */
  try{ (function(){
    var к=document.getElementById('citata');
    if(!к) return;
    var тх='«Мир — управляемый страх»', от='', ист='Ясна Суток', ном=null;
    try{
      var ц=window.yasnaCitata && window.yasnaCitata();
      if(ц && ц[0]){
        тх='«'+ц[0]+'»';
        от=ц[1]||'';
        if(ц[2]){ ист='Ясна Суток · '+ц[2];
          var ц2=/(\d+)/.exec(String(ц[2])); if(ц2) ном=+ц2[1]; }
      }
    }catch(e){}
    к.querySelector('.tx').textContent=тх;
    к.querySelector('.ot').textContent=от;
    /* Шеврон — знак того, что карточка открывается: без него тапабельность
       цитаты ничем не показана. */
    к.querySelector('.ist').textContent=ист+' ›';
    var глава=null;
    try{
      var О=window.YasnaKnigaOpis;
      if(ном!=null && О && О.главы) О.главы.forEach(function(г){
        if(г.записи && ном>=г.записи[0] && ном<=г.записи[1] && г.есть!==false) глава=г.номер;
      });
    }catch(e){}
    к.setAttribute('href', глава!=null ? 'kniga.html?glava='+глава : 'kniga.html');
    /* Голосом читается одной фразой: «цитата, откуда она, куда ведёт». */
    к.setAttribute('aria-label','Цитата дня: '+тх+'. Открыть учебник, '+ист);
  })(); }catch(__е){ try{console.error("секция главной:",__е)}catch(_){}}

  /* Утренние цитаты: включённое расписание сдвигаем на 14 дней вперёд при
     каждом открытии — иначе оно молча иссякает через две недели. */
  if(window.yasnaPushiVkl && window.yasnaPushiVkl() && window.yasnaPushi)
    window.yasnaPushi(true);

  /* Обновления: тихая проверка раз в несколько часов; плашка — только
     когда в хранилище действительно лежит более новая сборка. */
  if(window.yasnaObnovaPlashka) window.yasnaObnovaPlashka();

})();
</script>
